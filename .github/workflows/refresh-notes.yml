name: Refresh release notes

# Regenerates the notes of an existing release from the commit it was tagged at,
# e.g. after improving scripts/release_notes.py. Run from Actions -> Refresh release notes.
# With "Also replace the files", the release's zips and changes.ini are swapped for main's build
# (only allowed while main has the same stock file), so a pack fix reaches an existing release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to refresh, e.g. 4.10.2-LIVE"
        required: true
        type: string
      files:
        description: "Also replace the files with main's build (same stock file only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Replace the files with main's build
        if: inputs.files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ch=$(echo "$TAG" | sed -E 's/^[0-9.]+-([A-Z]+).*/\1/')
          if ! git diff --quiet "refs/tags/$TAG" HEAD -- "stock/$ch/global.ini"; then
            echo "::error::main has a different $ch stock file than $TAG; its build belongs in a new release, not this one."
            exit 1
          fi
          python scripts/validate.py --channel "$ch"
          version=$(python scripts/version_info.py --channel "$ch" version)
          rm -rf out && mkdir out
          (cd "dist/$ch/remix"   && zip -qr "../../../out/ScCompLangPackWaldo-$version-$ch.zip" data user.cfg)
          (cd "dist/$ch/classic" && zip -qr "../../../out/ScCompLangPackWaldo-Classic-$version-$ch.zip" data user.cfg)
          cp "dist/$ch/remix/changes.ini"   "out/ScCompLangPackWaldo-$version-$ch-changes.ini"
          cp "dist/$ch/classic/changes.ini" "out/ScCompLangPackWaldo-Classic-$version-$ch-changes.ini"
          gh release upload "$TAG" out/* --clobber
          # Notes from main too, so they describe exactly the files now attached.
          python scripts/release_notes.py --channel "$ch" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          gh release edit "$TAG" --notes-file notes.md

      - name: Rebuild notes at the tagged commit
        if: ${{ !inputs.files }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ch=$(echo "$TAG" | sed -E 's/^[0-9.]+-([A-Z]+).*/\1/')
          # Use the current scripts, but the stock data as it was when the release was tagged.
          cp -r scripts /tmp/scripts
          cp "stock/$ch/version.json" /tmp/version.json 2>/dev/null || true
          git checkout -q "refs/tags/$TAG"
          rm -rf scripts && cp -r /tmp/scripts scripts
          # Metadata fixed after tagging (e.g. a corrected build string) applies if it's the same version.
          if [ -f /tmp/version.json ] && [ "$(jq -r .version /tmp/version.json)" = "$(jq -r .version "stock/$ch/version.json")" ]; then
            cp /tmp/version.json "stock/$ch/version.json"
          fi
          python scripts/release_notes.py --channel "$ch" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          gh release edit "$TAG" --notes-file notes.md
