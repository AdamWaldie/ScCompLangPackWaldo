name: Patch watch

# Backstop for Auto-update: opens an issue when a newer LIVE build is out than the one in stock/LIVE/
# (e.g. if the auto-update source is lagging).
# The issue is closed automatically when the matching release is published.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  # GitHub starts schedules (and the Actions tab's "Run workflow" by default) on the default branch.
  # Any run that isn't on main hands itself over to main, so main's code always does the work.
  route-to-main:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Run this workflow on main instead
        run: |
          gh workflow run patch-watch.yml --ref main
          echo "::notice::Run started from '${{ github.ref_name }}'; handed over to main."
      - name: Note that the default branch isn't main (once)
        run: |
          title="Default branch is not main"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body "Scheduled and manually started workflows begin on the default branch (\`${{ github.ref_name }}\`) and hand over to \`main\` automatically, so nothing is out of date. To remove the extra hop, set **Settings → General → Default branch** to \`main\`, then close this issue."
          fi

  check:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check for a newer game build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/check_patch.py > pending.jsonl
          [ -s pending.jsonl ] || { echo "Up to date."; exit 0; }
          # Don't wait for the next scheduled run: try to pick the new patch up right away.
          gh workflow run auto-update.yml --ref main || echo "::warning::could not start Auto-update"
          gh label create patch-detected --color D93F0B --description "New game build, pack needs updating" 2>/dev/null || true

          # Read from fd 3 so commands inside the loop can never swallow the remaining lines.
          while read -r line <&3; do
            ch=$(echo "$line" | jq -r .channel)
            version=$(echo "$line" | jq -r .version)
            build=$(echo "$line" | jq -r .build)
            branch=$(echo "$line" | jq -r .branch)
            title="$ch $version (build $build) is out - pack needs updating"

            if gh issue list --label patch-detected --state open --json title --jq '.[].title' | grep -qxF "$title"; then
              echo "Already reminded: $title"
              continue
            fi
            # A newer build supersedes older reminders for the same channel.
            gh issue list --label patch-detected --state open --json number,title \
              --jq ".[] | select(.title | startswith(\"$ch \")) | .number" | while read -r n; do
                gh issue close "$n" --comment "Superseded by build $build."
              done

            {
              echo "A newer Star Citizen **$ch** build was detected: \`$branch\`."
              echo
              echo "Current pack: \`$(python scripts/version_info.py --channel "$ch" title 2>/dev/null || echo 'none')\`"
              echo
              echo "The Auto-update workflow hasn't found this build in its source yet; it checks every 2 hours and"
              echo "releases automatically when it does. To release sooner, run \`update.bat\` after the launcher"
              echo "has patched, then merge the pull request it opens."
              echo
              echo "_This issue closes automatically when the release is published._"
            } > body.md
            gh issue create --title "$title" --label patch-detected --body-file body.md
          done 3< pending.jsonl
