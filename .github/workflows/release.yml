name: Release

# Publishes each channel whose pack changed:
#  - new stock file (new patch or build): a new release, and the floating "latest" release moves to it
#  - same stock file, different pack (matching blueprint data arrived, or a pack fix was merged):
#    the files and notes of every existing release of that stock file, and of "latest", are replaced
# Runs on push to main touching stock/, game data or dist/, when called by Auto-update after it
# commits, and on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["stock/*/global.ini", "data/gamedata/*.json", "dist/**"]
  workflow_call:
    inputs:
      channels:
        description: "Space-separated channels to release"
        required: true
        type: string
      ref:
        description: "Commit to release"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      channels:
        description: "Channel to release"
        required: true
        type: choice
        options: [LIVE]

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Push: the pushed main commit. Called from Auto-update: the commit it made. By hand: main.
          ref: ${{ inputs.ref || (github.event_name == 'push' && github.sha) || 'main' }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pick channels
        id: channels
        run: |
          if [ -n "${{ inputs.channels }}" ]; then
            list="${{ inputs.channels }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            list=""  # first push that creates main: nothing to compare against, don't release the seed files
          else
            # Only channels whose built pack changed; new inputs that don't change it are no reason to release.
            list=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- dist | cut -d/ -f2 | sort -u \
                   | while read -r ch; do [ -f "stock/$ch/global.ini" ] && echo "$ch"; done | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Validate
        if: steps.channels.outputs.list != ''
        run: |
          for ch in ${{ steps.channels.outputs.list }}; do
            python scripts/validate.py --channel "$ch"
          done

      - name: Package and publish
        if: steps.channels.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          for ch in ${{ steps.channels.outputs.list }}; do
            version=$(python scripts/version_info.py --channel "$ch" version)
            build=$(python scripts/version_info.py --channel "$ch" build)
            title=$(python scripts/version_info.py --channel "$ch" title)
            scripts/package_release.sh "$ch" out latest
            python scripts/release_notes.py --channel "$ch" > "notes-$ch.md"

            # Existing releases built from this exact stock file get the new files instead of a new release.
            same=()
            for t in $(git tag -l "*-$ch" "*-$ch-*" --sort=-creatordate); do
              if git diff --quiet "refs/tags/$t" HEAD -- "stock/$ch/global.ini" && gh release view "$t" >/dev/null 2>&1; then
                same+=("$t")
              fi
            done

            if [ ${#same[@]} -gt 0 ]; then
              for t in "${same[@]}"; do
                gh release upload "$t" out/* --clobber
                gh release edit "$t" --notes-file "notes-$ch.md"
                echo "Updated $t in place"
              done
              tag=${same[0]}
              if gh release view latest >/dev/null 2>&1; then
                gh release upload latest latest/* --clobber
                echo "Updated latest in place"
                continue
              fi
            else
              tag="$version-$ch"
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                # Same patch, new stock file (hotfix build): keep tags unique.
                tag="$tag-${build:-$(date -u +%Y%m%d%H%M)}"
              fi
              gh release create "$tag" out/* --target "$head_sha" \
                --title "$title" --notes-file "notes-$ch.md"
            fi

            # Floating release with fixed asset names, for installers and auto-updaters:
            #   https://github.com/<repo>/releases/download/latest/ScCompLangPackWaldo-LIVE.zip
            floating=latest
            gh release delete "$floating" --yes --cleanup-tag 2>/dev/null || true
            git push -q origin ":refs/tags/$floating" 2>/dev/null || true
            gh release create "$floating" latest/* --target "$head_sha" --latest=false \
              --title "Latest $ch ($title)" \
              --notes "Always the newest $ch build, with fixed file names for auto-updaters. Currently **$title** - see [$tag](https://github.com/${{ github.repository }}/releases/tag/$tag) for the change report."

            # Close any "new patch detected" reminder for this channel.
            gh issue list --label patch-detected --state open --json number,title \
              --jq ".[] | select(.title | startswith(\"$ch \")) | .number" | while read -r n; do
                gh issue close "$n" --comment "Released in [$tag](https://github.com/${{ github.repository }}/releases/tag/$tag)."
              done || true
          done
