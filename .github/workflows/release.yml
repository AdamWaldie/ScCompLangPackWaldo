name: Release

# Publishes a release for each channel whose stock file changed:
#  - push to main touching stock/ (an update PR was merged)
#  - called by the Auto-update workflow after it commits a new stock file
#  - on demand from the Actions tab
on:
  push:
    branches: [main]
    paths: ["stock/*/global.ini"]
  workflow_call:
    inputs:
      channels:
        description: "Space-separated channels to release"
        required: true
        type: string
      ref:
        description: "Commit to release"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      channels:
        description: "Channel to release"
        required: true
        type: choice
        options: [LIVE]

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pick channels
        id: channels
        run: |
          if [ -n "${{ inputs.channels }}" ]; then
            list="${{ inputs.channels }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            list=""  # first push that creates main: nothing to compare against, don't release the seed files
          else
            list=$(git diff --name-only --diff-filter=d "${{ github.event.before }}" "${{ github.sha }}" -- 'stock/*/global.ini' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Validate
        if: steps.channels.outputs.list != ''
        run: |
          for ch in ${{ steps.channels.outputs.list }}; do
            python scripts/validate.py --channel "$ch"
          done

      - name: Package and publish
        if: steps.channels.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          before="${{ github.event.before }}"
          git rev-parse -q --verify "${before:-none}^{commit}" >/dev/null 2>&1 || before="HEAD~1"
          for ch in ${{ steps.channels.outputs.list }}; do
            version=$(python scripts/version_info.py --channel "$ch" version)
            build=$(python scripts/version_info.py --channel "$ch" build)
            title=$(python scripts/version_info.py --channel "$ch" title)
            cig_branch=$(python scripts/version_info.py --channel "$ch" branch)
            tag="$version-$ch"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # Same patch re-released (hotfix build or pack fix): keep tags unique.
              tag="$tag-${build:-$(date -u +%Y%m%d%H%M)}"
            fi

            # Versioned assets (kept forever) and fixed-name copies for the floating "latest" release.
            rm -rf out latest && mkdir -p out latest
            (cd "dist/$ch/remix"   && zip -qr "../../../out/ScCompLangPackWaldo-$version-$ch.zip" data user.cfg)
            (cd "dist/$ch/classic" && zip -qr "../../../out/ScCompLangPackWaldo-Classic-$version-$ch.zip" data user.cfg)
            cp "dist/$ch/remix/changes.ini"   "out/ScCompLangPackWaldo-$version-$ch-changes.ini"
            cp "dist/$ch/classic/changes.ini" "out/ScCompLangPackWaldo-Classic-$version-$ch-changes.ini"
            for f in out/*; do
              cp "$f" "latest/$(basename "$f" | sed "s/-$version-$ch/-$ch/")"
            done

            base=$(git describe --tags --abbrev=0 --match "*-$ch*" 2>/dev/null || echo "$before")
            {
              echo "Star Citizen **$title** language pack."
              [ -n "$cig_branch" ] && echo "CIG build: \`$cig_branch\`"
              echo
              echo "| Download | Format |"
              echo "|---|---|"
              echo "| \`ScCompLangPackWaldo-$version-$ch.zip\` | Remix: \`M2A XL-1\`, \`EM Dominator II Missile\`, \`B5 Stormburst Bomb\` |"
              echo "| \`ScCompLangPackWaldo-Classic-$version-$ch.zip\` | Classic: \`XL-1 Military A\`, \`[EM] Dominator II Missile\` |"
              echo
              echo "**Install:** extract, then copy \`data\` and \`user.cfg\` into your \`StarCitizen/$ch\` folder."
              echo "If you already have a \`user.cfg\`, add \`g_language = english\` to it instead of overwriting."
              echo
              echo "The \`*-changes.ini\` files contain only the lines this pack changes, for merging with other packs (e.g. in StarMeld)."
              echo
              python scripts/report.py --channel "$ch" --base-ref "$base" || true
              echo
              echo "Based on [ScCompLangPackRemix](https://github.com/BeltaKoda/ScCompLangPackRemix) by BeltaKoda and the original [ScCompLangPack](https://github.com/ExoAE/ScCompLangPack) by ExoAE."
            } > "notes-$ch.md"

            gh release create "$tag" out/* --target "$head_sha" \
              --title "$title" --notes-file "notes-$ch.md"

            # Floating release with fixed asset names, for installers and auto-updaters:
            #   https://github.com/<repo>/releases/download/latest/ScCompLangPackWaldo-LIVE.zip
            floating=latest
            gh release delete "$floating" --yes --cleanup-tag 2>/dev/null || true
            git push -q origin ":refs/tags/$floating" 2>/dev/null || true
            gh release create "$floating" latest/* --target "$head_sha" --latest=false \
              --title "Latest $ch ($title)" \
              --notes "Always the newest $ch build, with fixed file names for auto-updaters. Currently **$title** - see [$tag](https://github.com/${{ github.repository }}/releases/tag/$tag) for the change report."

            # Close any "new patch detected" reminder for this channel.
            gh issue list --label patch-detected --state open --json number,title \
              --jq ".[] | select(.title | startswith(\"$ch \")) | .number" | while read -r n; do
                gh issue close "$n" --comment "Released in [$tag](https://github.com/${{ github.repository }}/releases/tag/$tag)."
              done || true
          done
