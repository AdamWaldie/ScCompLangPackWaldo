name: Open update PR

# scripts/update_stock.py --push creates update/<channel>-<version> branches.
# This validates the new stock file and opens a pull request carrying the change report.
on:
  push:
    branches: ["update/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out channel and version
        id: meta
        run: |
          ch=$(git diff --name-only origin/main...HEAD -- 'stock/*/global.ini' | head -1 | cut -d/ -f2)
          if [ -z "$ch" ]; then echo "::error::No stock/<CHANNEL>/global.ini change on this branch"; exit 1; fi
          echo "channel=$ch" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c "import json;print(json.load(open('stock/$ch/version.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Build, validate and report
        id: check
        run: |
          ch=${{ steps.meta.outputs.channel }}
          python scripts/build.py --channel "$ch"
          status=passed
          git diff --quiet -- dist || status="failed: dist/ was not rebuilt"
          python scripts/validate.py --channel "$ch" > validate.txt 2>&1 || status="failed"
          {
            echo "Automated update of **$ch** to **${{ steps.meta.outputs.version }}**."
            echo
            echo "Validation: **$status**"
            echo '```'; cat validate.txt; echo '```'
            echo
            python scripts/report.py --channel "$ch" --base-ref origin/main
            echo
            echo "Merging this pull request publishes the $ch release."
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_REF_NAME}"
          title="${{ steps.meta.outputs.channel }} ${{ steps.meta.outputs.version }}"
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file body.md
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file body.md
          fi
