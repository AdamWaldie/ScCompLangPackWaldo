name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild every channel
        run: |
          for ini in stock/*/global.ini; do
            python scripts/build.py --channel "$(basename "$(dirname "$ini")")"
          done

      - name: Committed dist/ matches a fresh build
        run: |
          if ! git diff --quiet -- dist; then
            git diff --stat -- dist
            echo "::error::dist/ is out of date. Run 'python scripts/build.py --channel <CH>' and commit the result."
            exit 1
          fi

      - name: Validate
        run: python scripts/validate.py

      - name: Change report
        if: github.event_name == 'pull_request'
        run: |
          for ini in stock/*/global.ini; do
            ch="$(basename "$(dirname "$ini")")"
            python scripts/report.py --channel "$ch" --base-ref "origin/${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
          done
