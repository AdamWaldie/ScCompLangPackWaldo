name: Auto-update

# Fully remote, fully automatic LIVE patch pipeline. Every 2 hours:
#   fetch the newest stock LIVE global.ini (scripts/fetch_stock.py) and contract/blueprint game data
#   (scripts/fetch_gamedata.py) -> build -> validate -> commit to main -> publish the release.
# Game data only takes effect once it matches the stock patch, so blueprint lists appear in a
# follow-up release as soon as the matching dump is published.
# If validation fails (e.g. a new component needs an override), nothing is committed or released;
# an issue with the report is opened instead, and the next run after the fix releases it.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  # GitHub runs schedules from the default branch. If that isn't main, hand the run over to
  # main so the latest workflow code always does the work.
  route-to-main:
    if: github.event_name == 'schedule' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Run this workflow on main instead
        run: |
          gh workflow run auto-update.yml --ref main
          echo "::notice::Scheduled run started from '${{ github.ref_name }}'; handed over to main."
      - name: Note that the default branch isn't main (once)
        run: |
          title="Default branch is not main"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body "Scheduled workflows start on the default branch (\`${{ github.ref_name }}\`) and hand over to \`main\` automatically, so nothing is out of date. To remove the extra hop, set **Settings → General → Default branch** to \`main\`, then close this issue."
          fi

  update:
    if: github.event_name != 'schedule' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.commit.outputs.released }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch newer stock file and game data
        id: fetch
        run: |
          python scripts/fetch_stock.py | tee fetched.json
          # Bad or unreachable game data must never block a stock update; the last good summary is kept.
          python scripts/fetch_gamedata.py | tee gamedata.json || echo "::warning::game data not updated (see log)"
          if [ -n "$(git status --porcelain -- stock/LIVE data/gamedata)" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date."
          fi

      - name: Build, validate and report
        id: check
        if: steps.fetch.outputs.updated == 'true'
        run: |
          python scripts/build.py --channel LIVE
          {
            python scripts/report.py --channel LIVE --base-ref HEAD
            echo
            [ -s fetched.json ] && echo "Stock source: \`$(jq -r .source fetched.json)\`"
            [ -s gamedata.json ] && echo "Game data: \`$(jq -r '.version + " " + .build' gamedata.json)\`"
            true
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if python scripts/validate.py --channel LIVE > validate.txt 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            cat validate.txt
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue when blocked
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto-update-blocked --color B60205 --description "Auto-update needs a manual fix" 2>/dev/null || true
          title="LIVE $(python scripts/version_info.py --channel LIVE version) auto-update blocked - needs a fix"
          {
            echo "The automatic update failed validation, so nothing was committed or released."
            echo "Usually a new component needs a row in \`data/component_overrides.csv\`. Once that fix is on main,"
            echo "the next scheduled run (or **Actions → Auto-update → Run workflow**) releases it."
            echo
            echo '```'; cat validate.txt; echo '```'
            echo
            cat report.md
          } > body.md
          existing=$(gh issue list --label auto-update-blocked --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          # One issue per blocked version; later runs stay quiet until it's fixed.
          if [ -n "$existing" ]; then
            echo "Already reported in issue #$existing"
          else
            gh issue create --title "$title" --label auto-update-blocked --body-file body.md
          fi
          echo "::warning::$title (see issues)"

      - name: Commit to main
        id: commit
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/LIVE dist/LIVE data/gamedata
          if git diff --cached --quiet -- dist/LIVE; then
            # New inputs that don't change the packs (e.g. game data for an older patch): record, don't release.
            git commit -m "Auto-update: refresh game data (no pack changes)" || exit 0
            git push origin HEAD:main
            exit 0
          fi
          what="$(python scripts/version_info.py --channel LIVE title)"
          [ -s fetched.json ] || what="$what: blueprint rewards from matching game data"
          git commit -m "Auto-update LIVE to $what"
          git push origin HEAD:main
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          gh issue list --label auto-update-blocked --state open --json number \
            --jq '.[].number' | while read -r n; do
              gh issue close "$n" --comment "Resolved: released automatically in $(git rev-parse --short HEAD)."
            done || true

  release:
    needs: update
    if: needs.update.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    with:
      channels: LIVE
      ref: ${{ needs.update.outputs.sha }}
    permissions:
      contents: write
      issues: write

  pages:
    needs: [update, release]
    if: needs.update.outputs.released == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
