shubin_rockcracker_pvp_desc_01=CONTRACT: Mining Rights Transfer\nLOCATION: Nyx\n\nDETAILS: \nShubin Interstellar prospectors have recently discovered the location of an abandoned QV Planetary Service Breaker Station near the Keeger belt. These stations were originally used by the defunct company to harvest valuable resources from inside asteroids but knowledge of their exact locations has been lost over the years. \n\nWhile this particular station is offline, our scout team believes that it could be made functional again with the necessary repairs. Additionally, if it was brought back online, there's already a resource-heavy asteroid in place ready to be cracked by the station's mining laser. \n\nUnfortunately, with all the various challenges that come with operating in Nyx, Shubin doesn't currently have the available bandwidth to handle the aforementioned repairs ourselves. This however has created an opportunity for an interested independent mining operation such as yourself. \n\n<EM4>TERMS*:</EM4>\nWe are making available the <EM4>shared mining rights</EM4> to this QV Breaker Station. Upon purchase, we will provide the coordinates of the station to you and your crew. (Remember, any other interested parties who purchase the mining rights will get access to the station as well.) Your crew will then be free to head there with a <EM4>mining vessel</EM4>, restore the <EM4>station's mining laser</EM4> to an operational status, crack the asteroid, and <EM4>harvest the resources</EM4> inside. \n\nPlease note that since this is a shared contract we are able to offer these mining rights at a reduced prices, but the resources in the asteroid will be available on a <EM4>first come, first serve</EM4> basis with any other mining crews at the site. Also, there is also a chance that other interested parties, such as outlaws, may discover the station's location on their own. Caution is advised. \n\n*By accepting this contract you are assuming any and all risks associated with the work outlined herein and in no way can Shubin Interstellar be held accountable for any damages accrued during the duration of the contract.\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms Delta Camo\n- Monde Arms Hemlock Camo\n- Monde Core Delta Camo\n- Monde Core Hemlock Camo\n- Monde Helmet Delta Camo\n- Monde Helmet Hemlock Camo\n- Monde Legs Delta Camo\n- Monde Legs Hemlock Camo\n- R97 "Kismet" Shotgun\n- R97 "Righteous" Shotgun\n- R97 Shotgun Magazine (18 cap)
shubin_rockcracker_pvp_title_01=[BP] QV Breaker Station Mining Rights (Shared)
shubin_rockcracker_solo_desc_01=CONTRACT: Mining Rights Transfer\nLOCATION: Nyx\n\nDETAILS:\nShubin Interstellar prospectors have recently discovered the location of an abandoned QV Planetary Service Breaker Station near the Keeger belt. These stations were originally used by the defunct company to harvest valuable resources from inside asteroids but knowledge of their exact locations has been lost over the years. \n\nWhile this particular station is offline, our scout team believes that it could be made functional again with the necessary repairs. Additionally, if it was brought back online, there's already a resource-heavy asteroid in place ready to be cracked by the station's mining laser. \n\nUnfortunately, with all the various challenges that come with operating in Nyx, Shubin doesn't currently have the available bandwidth to handle the aforementioned repairs ourselves. This however has created an opportunity for an interested independent mining operation such as yourself. \n\n<EM4>TERMS*: </EM4>\nWe are making available the <EM4>exclusive mining rights</EM4> to this QV Breaker Station. Upon purchase, we will provide the coordinates of the station to only you and your crew. Your team will then be free to head there with a <EM4>mining vessel</EM4>, restore the <EM4>station's mining laser</EM4> to an operational status, crack the asteroid, and <EM4>harvest the resources</EM4> inside. \n\nPlease note that while we guarantee that these coordinates will be exclusive to you, we cannot assure that other interested parties, such as outlaws, may not discover the station's location on their own. Caution is advised. \n\n*By accepting this contract you are assuming any and all risks associated with the work outlined herein and in no way can Shubin Interstellar be held accountable for any damages accrued during the duration of the contract.\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms Delta Camo\n- Monde Arms Hemlock Camo\n- Monde Core Delta Camo\n- Monde Core Hemlock Camo\n- Monde Helmet Delta Camo\n- Monde Helmet Hemlock Camo\n- Monde Legs Delta Camo\n- Monde Legs Hemlock Camo\n- R97 "Kismet" Shotgun\n- R97 "Righteous" Shotgun\n- R97 Shotgun Magazine (18 cap)
shubin_rockcracker_solo_title_01=[BP] QV Breaker Station Mining Rights (Exclusive)
vaughn_assassination_FPS_UGF_illegal_boss_desc_001=I am not sure if you’re acquainted with ~mission(Location|Address), but ~mission(TargetName) is the one who calls the shots there. I need them eliminated.\n\nThat is easier said then done, I'm afraid. They are notoriously reluctant to see to matters personally, preferring their underlings to handle the dirty work. That said, eliminate enough of the underlings and they will have no choice but to deal with you themselves.\n\nEarnestly,\nVaughn\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Carnifex Armor Core\n- Carnifex Armor Legs\n- Citadel Arms Base\n- Citadel Core Base\n- Citadel Legs Base\n- Fortifier Helmet Base\n- Pulverizer LMG\n- Pulverizer LMG Magazine (120 Cap)\n- Tripledown Pistol\n- Tripledown Pistol Magazine (12 Cap)
vaughn_assassination_FPS_UGF_illegal_desc_001=They say there is no honor among thieves. Today, it seems, you're targeting one of your own. \n\nPlease head to ~mission(Location|Address) and kill ~mission(TargetName). What you do with the others there is entirely up to you.\n\nEarnestly,\nVaughn\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Badami Helmet\n- Deadrig Shotgun\n- Deadrig Shotgun Magazine (8 cap)\n- Killshot Rifle\n- Killshot Rifle Magazine (45 Cap)\n- Overlord Arms Supernova\n- Overlord Core Supernova\n- Overlord Helmet Supernova\n- Overlord Legs Supernova\n- Piecemeal Armor Arms\n- Piecemeal Armor Core\n- Piecemeal Armor Legs
vaughn_assassination_FPS_UGF_illegal_title_001=[BP] All Things Come To An End
vaughn_assassination_FPS_UGF_legal_boss_desc_001=A senior security official by the name of ~mission(TargetName) is about to have their long career come to a very violent and sudden end. While they are currently at ~mission(Location|Address), they will not be easy to get to. I fear that a bit of work will be required to draw them out.  \n\nI recommend killing enough of their underlings that they will be forced to face you personally. Of course, once they do decide to finally show their face, it should be a rather straightforward matter. \n\nEarnestly,\nVaughn\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Carnifex Armor Core\n- Carnifex Armor Legs\n- Citadel Arms Base\n- Citadel Core Base\n- Citadel Legs Base\n- Fortifier Helmet Base\n- Pulverizer LMG\n- Pulverizer LMG Magazine (120 Cap)\n- Tripledown Pistol\n- Tripledown Pistol Magazine (12 Cap)
vaughn_assassination_FPS_UGF_legal_title_001=[BP]* They Will Be Missed
