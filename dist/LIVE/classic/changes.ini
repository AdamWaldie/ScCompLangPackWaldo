Battaglia_RPT_Scan_01_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ore Scan Needed\n\nWORK BRIEF: \nGot a simple one for you today. I'm looking for some mining data so I need someone to scan some <EM4>~mission(Resources)</EM4>. The data will be helpful to plan future expeditions. ~mission(Rarity)\n\nAlso, if you're stuck of where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nThanks.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Lawson Mining Laser\n- Marlin\n- RN-7s\n- S00 Hofstede
