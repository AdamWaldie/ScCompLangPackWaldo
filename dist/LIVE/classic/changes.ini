Battaglia_RPT_BoardShip_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ship In Distress\n\nWORK BRIEF: \nGot an urgent distress call from one of the Miners Amalgamated crews I sent out, saying they’re under attack by a gang that ambushed their ship. \n\nI need you to rush down there, board the <EM4>~mission(Ship)</EM4> and help protect my people out there.\n\nPlease let me know ASAP if you can help.\n\nPAYMENT:\nStandard listed rate upon elimination of all targets.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Lawson Mining Laser\n- Marlin\n- RN-7s\n- S00 Hofstede
Battaglia_RPT_BoardShip_01_title=[BP] Ship In Distress
Battaglia_RPT_CreateUplink_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Moraine Movements\n\nWORK BRIEF: \nThis is a little outside our usual purview, but with the Moraine attacking more often, we’re hoping to find out where they’re operating and steer crews clear of those areas.\n\nWe need someone to <EM4>infiltrate a suspected Moraine facility and plug a small listening device into their server</EM4>. We’ve been told that the station is rarely occupied but <EM4>it’s possible that you will encounter Moraine there</EM4>, so be careful.\n\nWhile we don’t advocate violence, the potential benefits of this intel will be able to save many lives on both sides.\n\nPAYMENT:\nStandard listed rate upon successful installation.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Abrade Scraper Module\n- Arbor MH1 Mining Laser\n- CF-117 Bulldog "Hazard-Zone" Repeater\n- CF-227 Badger "Hazard-Zone" Repeater\n- CF-337 Panther "Hazard-Zone" Repeater\n- Cinch Scraper Module\n- Comer Scraper Module\n- Hart Scraper Module\n- Helix I Mining Laser\n- Hofstede-S1 Mining Laser\n- Impact I Mining Laser\n- Klein-S1 Mining Laser
Battaglia_RPT_CreateUplink_01_title=[BP] Moraine Movements
Battaglia_RPT_DataDownload_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Moraine Data Retrieval\n\nWORK BRIEF: \nThis is a little outside our usual purview, but with the Moraine attacking more often, we’re hoping to find out where they’re operating and steer crews clear of those areas.\n\nWe need someone to <EM4>infiltrate a suspected Moraine facility and make a copy of their server data</EM4>. We’ve been told that the station is rarely occupied but it’s possible that you will encounter Moraine there, so be careful.\n\nWhile we don’t advocate violence, the potential benefits of this intel will be able to save many lives on both sides.\n\nPAYMENT:\nStandard listed rate upon delivery\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Harkin\n- Lindstrom\n- Norfield\n- Pitman Mining Laser\n- S0 Helix\n- Strata Arms Levski Edition\n- Strata Backpack Levski Edition\n- Strata Core Levski Edition\n- Strata Helmet Levski Edition\n- Strata Legs Levski Edition
Battaglia_RPT_DataDownload_01_title=[BP] Moraine Data Retrieval
Battaglia_RPT_MissCrew_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Crew Hasn’t Checked In\n\nWORK BRIEF: \nJust got word that one of the mining teams is unaccounted for. They were supposed to be back hours ago, but no one’s heard from them. Family have tried to reach out but haven’t gotten a response from anyone on the crew.\n\nI can send you their last known location, so we’re looking for someone to go check in and see if they’re okay. If the worst happened, <EM4>please identify anyone you find</EM4>. I’m sure the families would appreciate some closure on what happened.\n\nThanks\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Harkin\n- Lindstrom\n- Norfield\n- Pitman Mining Laser\n- S0 Helix\n- Strata Arms Levski Edition\n- Strata Backpack Levski Edition\n- Strata Core Levski Edition\n- Strata Helmet Levski Edition\n- Strata Legs Levski Edition
Battaglia_RPT_MissCrew_01_title=[BP] Crew Hasn’t Checked In
Battaglia_RPT_MissCrew_02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Missing Mining Team\n\nWORK BRIEF: \nOne of our local crews set off for a dig and haven’t checked back in. With everything going on out there, people are starting to get a little worried, so <EM4>we’d like someone to try and get eyes on them</EM4>.\n\nI hate to say this, but if something happened to them, could you <EM4>please identify everyone you find</EM4> so we can let next of kin know?\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Harkin\n- Lindstrom\n- Norfield\n- Pitman Mining Laser\n- S0 Helix\n- Strata Arms Levski Edition\n- Strata Backpack Levski Edition\n- Strata Core Levski Edition\n- Strata Helmet Levski Edition\n- Strata Legs Levski Edition
Battaglia_RPT_MissCrew_02_title=[BP] Missing Mining Team
Battaglia_RPT_MissCrew_03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Missing Persons\n\nWORK BRIEF: \nA group of prospectors set out to look for some mining opportunities and haven’t been heard from since. We’re looking for someone to check in and see if they’re okay.\n\nI'll send you <EM4>their last known location</EM4>. Just head out there and see what happened.\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Abrade Scraper Module\n- Arbor MH1 Mining Laser\n- CF-117 Bulldog "Hazard-Zone" Repeater\n- CF-227 Badger "Hazard-Zone" Repeater\n- CF-337 Panther "Hazard-Zone" Repeater\n- Cinch Scraper Module\n- Comer Scraper Module\n- Hart Scraper Module\n- Helix I Mining Laser\n- Hofstede-S1 Mining Laser\n- Impact I Mining Laser\n- Klein-S1 Mining Laser
Battaglia_RPT_MissCrew_03_title=[BP] Missing Persons
Battaglia_RPT_RecoverItem_M_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Blackbox Retrieval w/Danger\n\nWORK BRIEF: \nWe had another ship attacked out near ~mission(Location) and received conflicting reports about who did the ambush, so we're looking to hire someone to fly out and <EM4>retrieve the blackbox</EM4>. Last thing we want to do is blame the wrong people. You should be able to carry it, but <EM4>you'll need a ship with some storage.</EM4>\n\nJust be careful, there's a real good chance <EM4>the ambushers are still there waiting</EM4> for someone to claim it.\n\nIf you're able to get it, <EM4>deliver the blackbox to ~mission(Destination)</EM4> and we'll get you paid.\n\nPAYMENT:\nStandard listed rate upon delivery\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Abrade Scraper Module\n- Arbor MH1 Mining Laser\n- CF-117 Bulldog "Hazard-Zone" Repeater\n- CF-227 Badger "Hazard-Zone" Repeater\n- CF-337 Panther "Hazard-Zone" Repeater\n- Cinch Scraper Module\n- Comer Scraper Module\n- Hart Scraper Module\n- Helix I Mining Laser\n- Hofstede-S1 Mining Laser\n- Impact I Mining Laser\n- Klein-S1 Mining Laser
Battaglia_RPT_RecoverItem_M_01_title=[BP] Blackbox Retrieval w/Danger
Battaglia_RPT_RecoverItem_VE_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Blackbox Retrieval\n\nWORK BRIEF: \nReceived a tip about <EM4>a ship that had been attacked at ~mission(Location)</EM4>.  Apparently it's been there for a little while, but the Governing Committee would like to know how it got there. \n\nWe're looking for someone to go out, <EM4>retrieve the blackbox and bring it to ~mission(Destination)</EM4> so we can figure out what happened. \n\nJust a reminder, the blackbox isn't small, so <EM4>you'll need a ship with some storage</EM4>.\n\nPAYMENT:\nStandard listed rate upon delivery\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Abrade Scraper Module\n- Arbor MH1 Mining Laser\n- CF-117 Bulldog "Hazard-Zone" Repeater\n- CF-227 Badger "Hazard-Zone" Repeater\n- CF-337 Panther "Hazard-Zone" Repeater\n- Cinch Scraper Module\n- Comer Scraper Module\n- Hart Scraper Module\n- Helix I Mining Laser\n- Hofstede-S1 Mining Laser\n- Impact I Mining Laser\n- Klein-S1 Mining Laser
Battaglia_RPT_RecoverItem_VE_01_title=[BP] Blackbox Retrieval
Battaglia_RPT_RecoverItem_VH_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Blackbox Retrieval Very Dangerous\n\nWORK BRIEF: \nThere's been another attack out at ~mission(Location). Whoever did it killed the entire crew in the ambush. The Governing Committee wants answers so we're looking for someone to head out there, <EM4>retrieve the blackbox and deliver it ~mission(Destination)</EM4>. Make sure you <EM4>bring a ship with some storage to hold the blackbox</EM4>.\n\nBe incredibly careful. They said it was a large group that attacked them, and I'd bet <EM4>they're still in the area</EM4>.\n\nPAYMENT:\nStandard listed rate upon delivery\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Abrade Scraper Module\n- Arbor MH1 Mining Laser\n- CF-117 Bulldog "Hazard-Zone" Repeater\n- CF-227 Badger "Hazard-Zone" Repeater\n- CF-337 Panther "Hazard-Zone" Repeater\n- CQ7 Rifle\n- Cinch Scraper Module\n- Comer Scraper Module\n- Hart Scraper Module\n- Helix I Mining Laser\n- Hofstede-S1 Mining Laser\n- Impact I Mining Laser\n- Klein-S1 Mining Laser
Battaglia_RPT_RecoverItem_VH_01_title=[BP] Blackbox Retrieval Very Dangerous
Battaglia_RPT_Salvage_E_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Salvage\n\nWORK BRIEF: \nGot a call about <EM4>a derelict ship out near ~mission(Location)</EM4>. Ran the regtag through the system to make sure we weren't taking someone's ride but it looks unclaimed, so I need someone with a salvage ship to head out and break it down. \n\nOnce you're done, <EM4>take the resources to ~mission(Destination)</EM4> and we'll get you paid.\n\nPAYMENT:\nStandard listed rate upon resource delivery\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Abrade Scraper Module\n- Arbor MH1 Mining Laser\n- CF-117 Bulldog "Hazard-Zone" Repeater\n- CF-227 Badger "Hazard-Zone" Repeater\n- CF-337 Panther "Hazard-Zone" Repeater\n- Cinch Scraper Module\n- Comer Scraper Module\n- Hart Scraper Module\n- Helix I Mining Laser\n- Hofstede-S1 Mining Laser\n- Impact I Mining Laser\n- Klein-S1 Mining Laser
Battaglia_RPT_Salvage_E_01_title=[BP] Salvage Job: Small
Battaglia_RPT_Salvage_H_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Large Ship Salvage\n\nWORK BRIEF: \nWord got passed over that <EM4>there's a large derelict ship out near ~mission(Location)</EM4>, so we're putting the word out for anyone who's got the ships and gear to break it down. \n\nIf you can chop it up, then <EM4>deliver the resources to ~mission(Destination)</EM4> and we'll pay you for your time.\n\nPAYMENT:\nStandard listed rate upon resource delivery\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Abrade Scraper Module\n- Arbor MH1 Mining Laser\n- CF-117 Bulldog "Hazard-Zone" Repeater\n- CF-227 Badger "Hazard-Zone" Repeater\n- CF-337 Panther "Hazard-Zone" Repeater\n- Cinch Scraper Module\n- Comer Scraper Module\n- Hart Scraper Module\n- Helix I Mining Laser\n- Hofstede-S1 Mining Laser\n- Impact I Mining Laser\n- Klein-S1 Mining Laser
Battaglia_RPT_Salvage_H_01_title=[BP] Salvage Job: Large
Battaglia_RPT_Salvage_M_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Medium Ship Salvage\n\nWORK BRIEF: \nGot word that a ship got destroyed out by ~mission(Location) after an ambush. Owner is willing to pay for someone to go salvage the parts and <EM4>bring them to ~mission(Destination)</EM4>.\n\nPAYMENT:\nStandard listed rate upon resource delivery\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Abrade Scraper Module\n- Arbor MH1 Mining Laser\n- CF-117 Bulldog "Hazard-Zone" Repeater\n- CF-227 Badger "Hazard-Zone" Repeater\n- CF-337 Panther "Hazard-Zone" Repeater\n- Cinch Scraper Module\n- Comer Scraper Module\n- Hart Scraper Module\n- Helix I Mining Laser\n- Hofstede-S1 Mining Laser\n- Impact I Mining Laser\n- Klein-S1 Mining Laser
Battaglia_RPT_Salvage_M_01_title=[BP] Salvage Job: Mid
Battaglia_RPT_ScanMine_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Minor Mining Job\n\nWORK BRIEF: \nIf you’ve got time, I’ve got a pretty basic mining job for you. I'm building a database of mineral types and their locations but I need some raw data, so I need someone to locate <EM4>~mission(Resources) ~mission(MineableType)</EM4>. You can keep what you find, I'll pull the data I need. ~mission(Rarity)\n\nAlso, if you're stuck on where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nThanks.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Lawson Mining Laser\n- Marlin\n- RN-7s\n- S00 Hofstede
Battaglia_RPT_ScanMine_01_title=[BP] Minor Mining Job
Battaglia_RPT_ScanMine_02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Need Some Ore Mined\n\nWORK BRIEF: \nGot a moment? Need someone to fly over to locate <EM4>~mission(Resources)</EM4> and mine at least <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4>. We're updating our database for future mining expeditions. You can keep what you find, we just need the data. ~mission(Rarity)\n\nAlso, if new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out in your mobi.</EM4>\n\nLet me know if you’re up for it.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Lawson Mining Laser\n- Marlin\n- RN-7s\n- S00 Hofstede
Battaglia_RPT_ScanMine_02_title=[BP] Need Some Ore Mined
Battaglia_RPT_ScanMine_03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Scan And Mining Needed\n\nWORK BRIEF: \nI have a job here that might interest you. I need people to go out and do some basic mining in order to pull some geological data for future prospecting. Need someone to scope out and mine <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4>. You'll be helping us out massively. ~mission(Rarity)\n\nAlso, if you're stuck or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nKeep me posted.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Harkin\n- Lindstrom\n- Norfield\n- Pitman Mining Laser\n- S0 Helix\n- Strata Arms Levski Edition\n- Strata Backpack Levski Edition\n- Strata Core Levski Edition\n- Strata Helmet Levski Edition\n- Strata Legs Levski Edition
Battaglia_RPT_ScanMine_03_title=[BP] Scan And Mining Needed
Battaglia_RPT_ScanMine_04_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ore Needs Gathering\n\nWORK BRIEF: \nGot a big mining job with your name on it. We're looking to update our records about mineral yields so we need someone to scan and extract about <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4> mined if possible. ~mission(Rarity)\n\nAlso, if you're stuck or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nLet me know.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Harkin\n- Lindstrom\n- Norfield\n- Pitman Mining Laser\n- S0 Helix\n- Strata Arms Levski Edition\n- Strata Backpack Levski Edition\n- Strata Core Levski Edition\n- Strata Helmet Levski Edition\n- Strata Legs Levski Edition
Battaglia_RPT_ScanMine_04_title=[BP] Ore Needs Gathering
Battaglia_RPT_ScanMine_05_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Efficient Miners Wanted\n\nWORK BRIEF: \nNeed your help with something. If you could harvest ~mission(Resources) ~mission(MineableType)</EM4>, that would really help out our understanding of the current mineral levels in the system. ~mission(Rarity)\n\nAlso, if you're stuck of where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nThanks in advance.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Abrade Scraper Module\n- Arbor MH1 Mining Laser\n- CF-117 Bulldog "Hazard-Zone" Repeater\n- CF-227 Badger "Hazard-Zone" Repeater\n- CF-337 Panther "Hazard-Zone" Repeater\n- Cinch Scraper Module\n- Comer Scraper Module\n- Hart Scraper Module\n- Helix I Mining Laser\n- Hofstede-S1 Mining Laser\n- Impact I Mining Laser\n- Klein-S1 Mining Laser
