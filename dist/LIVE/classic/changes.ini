Battaglia_RPT_Scan_02_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ore To Be Scanned\n\nWORK BRIEF: \nGot a job for you. Need someone to scan a deposit of <EM4>~mission(Resources)</EM4>. I'm looking into building a more extensive database on mineral locations, so your data will be helpful.~mission(Rarity)\n\nAlso, if you're stuck of where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nKeep me posted.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Lawson Mining Laser\n- Marlin\n- RN-7s\n- S00 Hofstede
