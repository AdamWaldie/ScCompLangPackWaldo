UWC_Refueling_easy_desc_001=Hey there,\n\nIf you're fitted for refueling, you might like this one. \n\nA beacon has just gone live at <EM4>~mission(Location|Address)</EM4>, from a client whose <EM4>~mission(Ship)</EM4> is in need of ~mission(FuelType), so make sure your pods are topped off.\n\nThe client vessel will pay you at the rate of ~mission(RefuelRequest), and as a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nLooks like a zero-drama one and done, but it never hurts to keep your scanners live.\nLet me know if you're interested and let's get these good people on their way.\n\nWaiting to hear from you,\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"\n\nBlueprints this contract can award (as of 4.10.1):\n- Bendix\n- Ezra\n- Harkin\n- Lindstrom\n- Marlin\n- Norfield\n- RN-7s\n- Torrez
UWC_Refueling_easy_title_001=[BP] REFUEL REQUEST: ~mission(Ship)
UWC_Refueling_high_desc_001=Hi,\n\nAnother day another beacon. There's a <EM4>~mission(Ship)</EM4> looking to be topped up with ~mission(FuelType) at <EM4>~mission(Location|Address)</EM4>.  The client vessel will pay you at the rate of ~mission(RefuelRequest), and as a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nI can't lie: it's a nasty place to get stuck and a worse place to get caught by surprise. We've lost good people out there - even the ones who got lucky made it home with pieces missing.\n\nIf you decide to take the job, do me a favor and keep everything peeled. If you've got a buddy with time to spare, maybe reach out for a little back-up.\n\nMaybe I'm being paranoid, but that doesn't mean they're not out to get you, as Momma Deloit used to say. \n\nActually she never said that - but I'm pretty sure she would if she did this for a living.\n\nJust do the job and get home safe, okay?\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"\n\nBlueprints this contract can award (as of 4.10.1):\n- Bendix\n- Ezra\n- Harkin\n- Lindstrom\n- Marlin\n- Norfield\n- RN-7s\n- Torrez
UWC_Refueling_high_title_001=[BP]  CRITICAL REFUEL REQUEST: ~mission(Ship)
UWC_Refueling_moderate_desc_001=Hey, you!\n\nI've got a beacon at <EM4>~mission(Location|Address)</EM4>. They say their tanks are running dry and they could use ~mission(FuelType). If you're interested, I get the feeling they'll be really pleased to see you.\n\nThe client vessel will pay you at the rate of ~mission(RefuelRequest), and as a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nThey're stuck out in an area with a bad reputation, though things have been a bit more quiet recently. Still worth staying alert I'd say, just in case there's still trouble lurking out there. \n\nEither way, the sooner everyone's able to get flying again - and that includes you - the better.\n\nHappy trails,\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"\n\nBlueprints this contract can award (as of 4.10.1):\n- Bendix\n- Ezra\n- Harkin\n- Lindstrom\n- Marlin\n- Norfield\n- RN-7s\n- Torrez
UWC_Refueling_moderate_title_001=[BP] URGENT REFUEL REQUEST: ~mission(Ship)
UWC_Refueling_multiple_hard_desc_001=Heyo,\n\nOver at <EM4>~mission(Location|Address)</EM4> we just got a refueling job for an entire small fleet of ships who all together need ~mission(FuelType). Talk about when it rains it pours!\n\nThe client will pay you at the rate of ~mission(RefuelRequest), and as a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nUnfortunately, where they're held up isn't the nicest of sectors so I'd be alert for any tomfoolery while you're doing the run. \n\nIt'll be best to try get them all back on their way as soon as you can.\n\nHappy trails,\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"\n\nBlueprints this contract can award (as of 4.10.1):\n- Bendix\n- Ezra\n- Harkin\n- Lindstrom\n- Marlin\n- Norfield\n- RN-7s\n- Torrez
UWC_Refueling_multiple_hard_title_001=[BP] CRITICAL FLEET REFUEL
UWC_Refueling_multiple_med_desc_001,P=Hey again,\n\nI've got a beacon at <EM4>~mission(Location|Address)</EM4> and this one's a bit more complicated than usual. Got small convoy of ships requesting ~mission(FuelType). Impressive coordination and lack of planning to all need refueling at the same time. \n\nThe client will pay you at the rate of ~mission(RefuelRequest), and as a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nHopefully since the area they're in is pretty safe, there shouldn't be too much trouble lurking, but these days you never know. Wouldn't hurt to get them back flying again as quick as you're able.\n\nHappy trails,\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"\n\nBlueprints this contract can award (as of 4.10.1):\n- Bendix\n- Ezra\n- Harkin\n- Lindstrom\n- Marlin\n- Norfield\n- RN-7s\n- Torrez
UWC_Refueling_multiple_med_title_001=[BP] URGENT CONVOY REFUEL
UWC_Refuelling_BespokeCapital_Desc=DD here - I've got something special for you,\n\nI just received a ping from <EM4>~mission(Location|Address)</EM4>. A strike force led by a ~mission(Ship) just dropped into the system and are looking for a fast refuel before heading back out. \n\nThey  need ~mission(FuelType) asap and will pay ~mission(RefuelRequest) for it. As a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nI won't lie - I'm more than a little jealous. Getting up close and personal to a ship that big? Should be one to tell the grandkids about.\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Bendix\n- Ezra\n- Harkin\n- Lindstrom\n- Marlin\n- Norfield\n- RN-7s\n- Torrez
UWC_Refuelling_BespokeCapital_Title=[BP] URGENT CAPITAL FLEET REFUEL
Vaughn_EliminateSpecific_FPS_Rockcracker_Maintenance_desc_001=I've been having a hard time tracking this target down. They're part of a gang known as the Claw Salamanders who tend to be quite itinerate. However, it seems the group has been trying to get an old QV Breaker Station operational again and I think this just may be the chance to take out ~mission(TargetName) once and for all. \n\nStart your search at ~mission(Location|Address).  These stations can apparently be quiet cavernous at  times so it may take a bit of effort to locate the target once you're on site.\n\nHowever, I have all the confidence in your abilities,\nVaughn\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
Vaughn_EliminateSpecific_FPS_Rockcracker_Power_desc_001=A request has made its way to my desk regarding the untimely end of one ~mission(TargetName), a member of the Claw Salamander who is currently scuttling around an old QV Breaker Station. \n\nIt is highly likely that you will find them at ~mission(Location|Address).  Be mindful though that with a station this large it may take a bit of searching to track them down. \n\nHope you enjoy your time in Nyx,\nVaughn\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
Vaughn_EliminateSpecific_FPS_Rockcracker_Warehouse_desc_001=There is a member of the Nyx gang the Claw Salamanders, ~mission(TargetName), who has made it on to my naughty list. They had been on the run for quite awhile, but just recently popped back up at an old mining station in the Keeger Belt. Our lucky day shall be their last.  \n\nWord is that you can find them at ~mission(Location|Address).  Unfortunately, there is a strong chance you may have to do some repairs to the station itself before you can gain access to that particular area.\n\nBut I'm sure you're more than up to the challenge.\n\nSincerely,\nVaughn\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
Vaughn_EliminateSpecific_FPS_Rockcracker_title_001=[BP] A Well Deserved Break
bhg_bounty_desc_ASD_Engineering_001=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: Stanton\nRISK ASSESSMENT: Medium\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: <None>\nNOTES: We have tracked this bounty target to the <EM4>Engineering wing</EM4> of an abandoned Associated Science and Development research facility. While shuttered, various scavengers and other unsavory types are known to frequent the area.\n\nThe facility itself might also pose a risk as the nature of the research being conducted there is unknown. Be on the lookout for potential environmental hazards while in pursuit of the target.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\nBlueprints this contract can award (as of 4.10.1):\n- Palatino Arms Sunstone\n- Palatino Core Sunstone\n- Palatino Helmet Sunstone\n- Palatino Legs Sunstone
bhg_bounty_desc_ASD_Research_001=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: Stanton\nRISK ASSESSMENT: Medium\nLAST KNOWN LOCATION:  ~mission(Location|Address)\nKNOWN AFFILIATIONS: <None>\nNOTES: We have tracked this bounty target to the <EM4>Research wing</EM4> of an abandoned Associated Science and Development facility. While shuttered, various scavengers and other unsavory types are known to frequent the area.\n\nThe facility itself might also pose a risk as the nature of the research being conducted there is unknown. Be on the lookout for potential environmental hazards while in pursuit of the target.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.\n\nBlueprints this contract can award (as of 4.10.1):\n- Palatino Arms Daystar\n- Palatino Arms Metropolis\n- Palatino Core Daystar\n- Palatino Core Metropolis\n- Palatino Helmet Daystar\n- Palatino Helmet Metropolis\n- Palatino Legs Daystar\n- Palatino Legs Metropolis
