eckhart_defendship_LRT_desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Defend Ship\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nOne of our clients got the brilliant idea to test their dogfighting skills in a real world scenario. Doesn’t sound like it’s going well, because they comm’d us asking for some support. \n\nHead to <EM4>~mission(Location|Address)</EM4> and help clean up the mess they created.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
eckhart_defendship_LRT_title_001=[BP] Support Client Under Attack
eckhart_defendship_MRT_desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Defend Ship\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA high-profile client decided to tour Nyx system but got jumped by hostile ships around <EM4>~mission(Location|Address)</EM4>. \n\nSounds like they’re overwhelmed. Any chance you could head to their location and provide support? \n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
eckhart_defendship_MRT_title_001=[BP] Stop Attack on High-Profile Client
eckhart_defendship_VLRT_desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Defend Ship\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA client is reporting trouble near <EM4>~mission(Location|Address)</EM4>. Based on their comms, it doesn’t sound like an organized, professional attack. Still, we’re paid to provide protection and it’s been requested. \n\nNeed a contractor to fly there and secure the situation.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
eckhart_defendship_VLRT_title_001=[BP] Save Ship
eckhart_defendship_multi_HRT_desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Defend Ship\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nRecently, we recommended that a client use a specific route to cross Nyx safely. Turns out it wasn’t as secure as we assumed, because a group ambushed our client’s ship. We need to get this cleaned up ASAP. Are you available to help? \n\nIntel from the client indicates a well-organized attack, so you better be equipped to deal with experienced hostiles on this one. Hurry to <EM4>~mission(Location|Address)</EM4>, help them survive this, and we’ll pay you well for your trouble.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
eckhart_defendship_multi_HRT_title_001=[BP] High-Risk Ship Encounter
eckhart_defendship_multi_SRT_desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Defend Ship\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nWe have a client currently under attack at <EM4>~mission(Location|Address)</EM4>. We have a long history with this client and know that they’re a skilled dogfighter. If they’re struggling to survive, then this situation must be dire.\n \nWe’re looking for a top-tier dogfighter to head out there and provide support. If you’re available, then this client could really use your help. \n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
eckhart_defendship_multi_SRT_title_001=[BP] Extremely Dangerous Defense
eckhart_defendship_multi_VHRT_desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Defend Ship\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nDespite our warnings, a client decided to fly to <EM4>~mission(Location|Address)</EM4>. Unsurprisingly, they just dropped a rescue beacon in the area, so we’re looking for a contractor to get on site, assess the situation, and hopefully rescue the client.\n\nWe warned them that extremely dangerous and well-equipped outlaws often strike ships there. That’s exactly what I assume happened here, so make sure you plan accordingly.  \n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
eckhart_defendship_multi_VHRT_title_001=[BP] Stop Deadly Ship Attack
foxwell_DefendShip_E_desc_001=Foxwell is looking for an available combat pilot to provide immediate assistance to a ~mission(Ship) under attack over by ~mission(Location|Address). We have not identified the perpetrators in the attack, but have been assured it is a small force.\n\nPlease dispatch quickly and clear out all hostiles. We need the client to make it through this as they haven't paid us yet.\n\nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
foxwell_DefendShip_E_title_001=[BP] Yellow Level Contract: Ship Under Attack
foxwell_DefendShip_H_desc_001=An emergency contract just came in about a fight near ~mission(Location|Address). Apparently a group of ships were ambushed by outlaws led by ~mission(TargetName), who's been wanted on multiple planets for murder and ship theft. Foxwell's looking for top tier combat pilots to go and protect the clients against them.\n\nThis one's been flagged as a red level contract so it's really dangerous. If you have people you could bring, you probably should. If you do, you should also let them know about Foxwell's hiring policies. \n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
foxwell_DefendShip_H_title_001=[BP] Red Level Contract: Ship Under Attack
foxwell_DefendShip_M_desc_001=Got an orange level contract for any available combat pilots. A ~mission(Ship) is under attack around ~mission(Location|Address) and is in desperate need for assistance. We're not sure how many perpetrators there are, but they seem motivated and dangerous so exercise caution.\n\nOnce on site, engage and destroy any hostiles you encounter and protect the client. Once they've transferred the credits, we'll route you your payment.\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
foxwell_DefendShip_M_title_001=[BP] Orange Level Contract: ~mission(Ship) Needs Assistance
headhunters_ChainElimAll_1C_AttackCFP_E_desc_001=Been getting word that CFP security have been getting a little more aggressive and started pushing people out of the homes they've built out of the scrap in the system and they want payback, so they came to us.\n\nHead out to ~mission(Location|Address) and clear out the CFP there. Should be pretty cut and dry with a nice payday.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
headhunters_ChainElimAll_1C_AttackCFP_E_title_001=[BP] A little retaliation
headhunters_ChainElimAll_1C_AttackXT_M_desc_001=Just got clearance from my Judge to start banging back against XenoThreat. Been eyeballing some spots under their control near ~mission(Location|Address).\n\nI'll give you the targets to hit, you kill everyone you find. Hell, I'd love to go myself, sounds like fun.\n\n-Stows\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
headhunters_ChainElimAll_1C_AttackXT_M_title_001=[BP] Taking out some XenoThreat trash
headhunters_ChainElimAll_1C_ElimSpec_AttackCFP_M_desc_001=We've been trying to play nice with these Citizens for Prosperity people, but they've made it abundantly clear that we don't have a place in their 'safe system.' Their use of mercs for security have been causing all kinds of unreasonable violence like when this asshole ~mission(TargetName) opened fire on a group of settlers to drive them away from an outpost they'd been eyeing. So now the gloves are coming off.\n\nI need some hard workers to go hit ~mission(Location|Address) and take out ~mission(TargetName|Last). Odds are, they'll stay hidden until you prove you're enough of a threat, so make sure you do some damage.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
headhunters_ChainElimAll_1C_ElimSpec_AttackCFP_M_title_001=[BP] Driving CFP out
headhunters_ChainElimAll_2C_ElimSpec_AttackCFP_H_desc_001=Got word from my Judge that we're to take back some of the outposts that CFP have taken over. They're a little pissed that CFP's getting as much of a foothold in the system as they are and think it's making the Headhunters look weak.\n\nFound a couple candidates near ~mission(Location|Address) that could use a sweep. Icing on the cake is that the head of security there is ~mission(TargetName). Not sure if you've heard of 'em, but they shot up a handful of Clips last month, so it's a win-win. Get some territory back and punch out someone who could really stand to get got.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
headhunters_ChainElimAll_2C_ElimSpec_AttackCFP_H_title_001=[BP] Sweep and clear some CFP haunts
headhunters_ChainElimAll_2C_ElimSpec_AttackXT_H_desc_001=Need some good soldiers with a taste for violence to hit some XenoThreat hideouts located around ~mission(Location|Address). I'll get you the specifics if you're down, but you'll have to wipe out two separate clusters of hideouts. \n\nWe've also gotten word that ~mission(TargetName) is lurking around down there. If you take out enough XenoThreat dirtbags, they'll pop they're head up. \n\nWhen they do, put a round in it.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
headhunters_ChainElimAll_2C_ElimSpec_AttackXT_H_title_001=[BP] Taking XenoThreat Turf
headhunters_ChainElimAll_3C_ElimSpec_AttackCFP_VH_desc_001=Got a big one here. We need a team to head out to ~mission(Location|Address). Word is CFP are dug in at three different clusters in the area. Our judge wants them all cleared out. Seems one of their mercs, a real mean skag named ~mission(TargetName), is holed up at one of them. We want you to go there, clear them all out and take out ~mission(TargetName|Last).\n\nGet yourself a nice little payday in the process.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
headhunters_ChainElimAll_3C_ElimSpec_AttackCFP_VH_title_001=[BP] Hit a CFP Complex
headhunters_ChainElimAll_3C_ElimSpec_AttackXT_VH_desc_001=Got a juicy assignment for any big-time enforcers who want to clear a big payday. Over at ~mission(Location|Address) we got some XenoThreat turf run by a real bastard named ~mission(TargetName). Now if you've been in the system long enough, you've probably either heard of ~mission(TargetName|Last) or at least seen their work. Skag has a tendency to leaves bodies wherever they go.\n\nAnyway, Judge wants this area swept clean, that means you gotta hit all three clusters and kill every XenoThreat dirt you find. Kill enough and ~mission(TargetName|Last) won't be able to hide.\n\nTake them all out and have one on us.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
headhunters_ChainElimAll_3C_ElimSpec_AttackXT_VH_title_001=[BP] Taking down a XenoThreat Hideout
headhunters_ChainElimAll_AttackCFP_E_desc_001=Looking for anyone with an itchy trigger finger. We're looking to move against some CFP at  ~mission(Location|Address) and take it for ourselves. You gotta play this smart though. There are a bunch of satellite outposts around the main one and all of 'em got security, so you should take out each of these before you take the main base.\n\nBut hey, if you wanna jump right in the deep end and fight off all the reinforcements, that's on you. As long as you get it done.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)
headhunters_ChainElimAll_AttackCFP_E_title_001=[BP] Time to roll on CFP
headhunters_ChainElimAll_AttackGen_E_desc_001=Looking for some hitters to go drop some violence on some local dipshits who've been pulling jobs in the system against Headhunters. We tried reaching out to explain the error of their ways, but they shot our messenger, so now we go with option B.\n\nYou'll find them holed up near ~mission(Location|Address). Go there and repaint the walls with their blood.\n\nHave fun.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)
headhunters_ChainElimAll_AttackGen_E_title_001=[BP] Go on the warpath
headhunters_ChainElimAll_Boss_XenoThreat_VH_desc_001=These XenoThreat assholes are like aloprats. Every time you thing you wipe them out, they just pop back up again. They seem to be back to their usual shit and trying to put together something big. No idea what, but we've been cleared to stop it before it starts.\n\nA group of XenoThreat biggies are supposedly meeting at ~mission(Location|Address) to plan or just rage or whatever it is they do, but we're gonna bust it up. Or you are.\n\nHead over there and wipe out everyone you find. Sure enough I'm sure the biggies will jump into the fight. That's what they always do.\n\nThis'll be a tough one. As much as I hate XenoThreat, they're damn good in a fight, so watch yourself and bring help if you can.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)
headhunters_ChainElimAll_Boss_XenoThreat_VH_title_001=[BP] Hit on XenoThreat command
headhunters_EliminateAll_XenoThreat_H_desc_001=One of our people stumbled across a group of XenoThreat hiding out over near ~mission(Location|Address). Not sure if they're dug in or just passing through, but we want to hit them before they move.\n\nMaybe bring some people if you got 'em because XenoThreat don't tend to go down easy. Get there and remind them who the power is in this system.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
headhunters_EliminateAll_XenoThreat_H_title_001=[BP] Hit XenoThreat at ~mission(Location)
headhunters_EliminateSpecific_Asteroid_Generic_M_desc_001=Need someone taken care of. They're holed up near ~mission(Location|Address). Not sure if you care who they are, but their name's ~mission(TargetName). Not much to tell, local thug who killed someone who was connected.\n\nThey've been on the run, so they're gonna be skittish. I'd approach with caution.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Deadrig Shotgun Magazine (8 cap)\n- Dust Devil Armor Arms\n- Dust Devil Armor Core\n- Dust Devil Armor Legs\n- Manticore Helmet\n- Ravager-212 Twin Shotgun\n- Ravager-212 Twin Shotgun Magazine (16 cap)\n- Ripper "Sunblock" SMG
headhunters_EliminateSpecific_Asteroid_Generic_M_title_001=[BP] Need a death at ~mission(Location)
headhunters_EliminateSpecific_Asteroid_Generic_VE_desc_001=Got word of crew that's been pulling jobs and building a rep for themselves. Since they've said they don't want anything to do with Headhunters, we're looking to break 'em apart before they become a problem. Their leader is some punk named ~mission(TargetName) and we figure if they met the wrong end of a bullet, the rest of them would break apart.\n\nWe're told you can find ~mission(TargetName|Last) around ~mission(Location|Address). Head over and take care of it.\n\nThey shouldn't pose much of a problem to a pro like you.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Devastator "Midnight" Shotgun\n- Devastator "Warhawk" Shotgun\n- Devastator Shotgun\n- Devastator Shotgun Battery (12 cap)\n- Morozov-SH Arms\n- Morozov-SH Arms Thule\n- Morozov-SH Core\n- Morozov-SH Core Thule\n- Morozov-SH Helmet\n- Morozov-SH Helmet Thule\n- Morozov-SH Legs\n- Morozov-SH Legs Thule\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)
headhunters_EliminateSpecific_Asteroid_Generic_VE_title_001=[BP] Deep space hit
headhunters_EliminateSpecific_CFP_E_desc_001=My boss is looking for an available hitter. Headhunters are looking to retake ~mission(Location|Address). The CFP Mercs there have been digging in for a long fight. Look, we don't want to kill anyone we don't have to, so we're looking into other options.\n\nSecurity there's being run by ~mission(TargetName) and my Judge thinks that if they're taken out, the rest'll scatter. Shedding a little blood's better than a lot, right?\n\n-Stows\n\nBlueprints this contract can award (as of 4.10.1):\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)
headhunters_EliminateSpecific_CFP_E_title_001=[BP] Shot in the chaos
headhunters_EliminateSpecific_CFP_H_desc_001=Headhunters are launching an attack near ~mission(Location|Address). This ex-Marine asshole named ~mission(TargetName) has been sending their mercs to clear out nearby encampments if they don't surrender their weapons.\n\nWhile all the security have been greenlit, ~mission(TargetName|Last) has been singled out. In their last raid, they beat a squatter to death for talking back. Turns out that squatter was the cousin of one of our Clips, so they're paying extra to make sure justice is done.\n\nWatch yourself though, ~mission(TargetName|Last) may be a scumbag who has this coming, they're still ex-military so they won't be easy to take down.\n\n-Stows\n\nBlueprints this contract can award (as of 4.10.1):\n- Devastator "Midnight" Shotgun\n- Devastator "Warhawk" Shotgun\n- Devastator Shotgun\n- Devastator Shotgun Battery (12 cap)\n- Morozov-SH Arms Thule\n- Morozov-SH Core Thule\n- Morozov-SH Helmet Thule\n- Morozov-SH Legs Thule
headhunters_EliminateSpecific_CFP_H_title_001=[BP] Paid Target in CFP
headhunters_EliminateSpecific_CFP_M_desc_001=Need an available trigger to take down a target in a CFP outpost. They're a real piece of work named ~mission(TargetName). Old school merc filled with lead-pipe cruelty. \n\nHeard they're posted over at ~mission(Location|Address). Swing by and take them out. Try not to cause too much damage. They're the target, not anyone else.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Devastator "Midnight" Shotgun\n- Devastator "Warhawk" Shotgun\n- Devastator Shotgun\n- Devastator Shotgun Battery (12 cap)\n- Morozov-SH Arms\n- Morozov-SH Arms Thule\n- Morozov-SH Core\n- Morozov-SH Core Thule\n- Morozov-SH Helmet\n- Morozov-SH Helmet Thule\n- Morozov-SH Legs\n- Morozov-SH Legs Thule\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)
headhunters_EliminateSpecific_CFP_M_title_001=[BP] Need a CFP taken down
headhunters_EliminateSpecific_Defector_desc_001=This shit saddens me. Not sure if you've ever crossed paths with ~mission(TargetName) in your dealings with us. Thought they were a real good one. Been with the Headhunters for years, but something must have happened because they went running to CFP for protection. Sold out some of our brothers and sisters along the way.\n\nAll the Judges are furious and wants blood. That's where you come in. Go to ~mission(Location|Address), find ~mission(TargetName|Last), and kill them.\n\nDoesn't have to be anything fancy. Just want the result.\n\nDamn shame.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Devastator "Midnight" Shotgun\n- Devastator "Warhawk" Shotgun\n- Devastator Shotgun\n- Devastator Shotgun Battery (12 cap)\n- Morozov-SH Arms Thule\n- Morozov-SH Core Thule\n- Morozov-SH Helmet Thule\n- Morozov-SH Legs Thule
headhunters_EliminateSpecific_Defector_title_001=[BP] Plug a traitor
headhunters_EliminateSpecific_Generic_E_desc_001=Looking for any hitters available for a quick gig. Over at ~mission(Location|Address), they're getting hit by some geniuses led by ~mission(TargetName). We've tussled against ~mission(TargetName|Last) in the past so it's no surprise they haven't wised up. \n\nWe want you to head there and take them down. Kill whoever you like, but ~mission(TargetName|Last) should be your focus.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Devastator "Midnight" Shotgun\n- Devastator "Warhawk" Shotgun\n- Devastator Shotgun\n- Devastator Shotgun Battery (12 cap)\n- Morozov-SH Arms Thule\n- Morozov-SH Core Thule\n- Morozov-SH Helmet Thule\n- Morozov-SH Legs Thule
headhunters_EliminateSpecific_Generic_E_title_001=[BP] Kill the king
headhunters_EliminateSpecific_Generic_M_desc_001=Got a crew that's been hitting Headhunter ships lately. Their leader's a real piece of work named ~mission(TargetName). We've tracked them to  ~mission(Location|Address), so we're looking for someone to put them down for good.\n\nThis group likes to fight, but shouldn't be a problem for someone like you. \n\nGet over there and get it done.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)
headhunters_EliminateSpecific_Generic_M_title_001=[BP] Need someone taken out
headhunters_EliminateSpecific_Generic_VH_desc_001=Word's come down through my bosses that we're settling old debts. I've got an open line on this old-time hitter named ~mission(TargetName) who's racked up a hefty kill list. We caught wind that they were hiding out with some people over at ~mission(Location|Address) who aren't the biggest fans of us, so they probably won't take kindly to you. ~mission(TargetName|Last) is the target here, but you might have to mix it up with them.\n\nAgain, whenever we've tried to take out ~mission(TargetName|Last), they've killed their killer. I feel like you'll fare better, but I'd bring backup if you got it.\n\nGood luck.\n\n-Stows\n\nBlueprints this contract can award (as of 4.10.1):\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)
headhunters_EliminateSpecific_Generic_VH_title_001=[BP] Green light on ~mission(TargetName|Last)
headhunters_EliminateSpecific_XenoThreat_H_desc_001=Headhunters just rallied up a crew to go hit ~mission(Location|Address) and wipe out the XenoThreat there, but I'm looking to add some extra insurance. \n\nSee there's this heavy hitter there named ~mission(TargetName) who's up in the XenoThreat command structure and we want them taken out. Every other one you kill is gravy, but they're your prime target.\n\n-Stows\n\nBlueprints this contract can award (as of 4.10.1):\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)
headhunters_EliminateSpecific_XenoThreat_H_title_001=[BP] XenoThreat Lieutenant needs some killing
headhunters_EliminateSpecific_XenoThreat_VH_desc_001=Here's the deal, we just got word that a XenoThreat power player named ~mission(TargetName) just came out of hiding and was spotted at ~mission(Location|Address). \n\nHeadhunters have been hungry to put this asshole in the ground for months, so we launched an assault against the outpost, but the Judge wants to make sure ~mission(TargetName|Last) doesn't slip away, so they want to use you as insurance.\n\nThis'll be a tough kill in the middle of a warzone, but we'll pay out if you pull it off.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Coda "Big Boss" Pistol\n- Coda "Nighthawk" Pistol\n- Coda Pistol\n- Coda Pistol Magazine (6 cap)\n- Morozov-SH Arms\n- Morozov-SH Core\n- Morozov-SH Helmet\n- Morozov-SH Legs\n- Scalpel Sniper Rifle\n- Scalpel Sniper Rifle Magazine (12 cap)
headhunters_EliminateSpecific_XenoThreat_VH_title_001=[BP] Wanted: ~mission(TargetName)
headhunters_EliminateSpecific_XenoThreat_desc_001=Got a line on a XenoThreat that's been a pain in the ass. Not sure if you've heard the name, but ~mission(TargetName) is a scumbag even by XenoThreat standards. Vicious, sadistic, and a prick to boot. We want someone to punch their number. You up for it?\n\nLast word was that they were somewhere around ~mission(Location|Address). Head there and take 'em out. Pretty simple.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Devastator "Midnight" Shotgun\n- Devastator "Warhawk" Shotgun\n- Devastator Shotgun\n- Devastator Shotgun Battery (12 cap)\n- Morozov-SH Arms Thule\n- Morozov-SH Core Thule\n- Morozov-SH Helmet Thule\n- Morozov-SH Legs Thule
headhunters_EliminateSpecific_XenoThreat_title_001=[BP] Drop a XenoThreat
headhunters_defend_xt_desc_001=Those XenoThreat punks launched an attack against ~mission(Location|Address) so we're looking for people to go fend them off. \n\nGet out there and waste every XenoThreat you see.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)
headhunters_defend_xt_title_001=[BP] Back up needed at outpost
headhunters_eliminateall_XT_derelicts_desc_01=One of our Judges caught wind of XenoThreat trying to move in on our territory. Seems like they’re trying to take over ~mission(Location|Address). We don’t want to let those psychos get any more of a foothold in system than they already have, so we’re putting some creds on the line to get ‘em to back off.\n\nWe want you to come down on them hard. Don’t let up till the whole place is a graveyard. We’ll send your payment once the bodies are ready to bury.\n\n- Stows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
headhunters_eliminateall_XT_derelicts_title_01=[BP] Turf War
headhunters_eliminateall_base_Generic_E_desc_001=So here's the deal, we got some small time dirtbags who think they're hotshots running out of a base near ~mission(Location|Address). I don't know what toxic shit they're drinking but they thought it'd be a good idea to step to some Headhunter Clips. Killed one, injured three more. So I'm looking to send someone there to blast their ambition right out of their skulls.\n\nHead over and get it done. You'll get a nice bump of creds for it.\n\n- Stows\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)
headhunters_eliminateall_base_Generic_E_title_001=[BP] Need a hitter
headhunters_eliminateall_cfp_E_desc_001=Need someone to sweep ~mission(Location|Address). CFP security forces seized the outpost from a group of locals that'd been there for years. Beat the hell out of 'em from what I heard, so they came to Headhunters asking for revenge. \n\nNeed it done fast and clean. \n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
headhunters_eliminateall_cfp_E_title_001=[BP] Hitting a CFP site
headhunters_eliminateall_cfp_M_desc_001=Word came down from the Judge that we're to hit ~mission(Location|Address). It's owned by CFP and security there have been less than hospitable to some of the locals, so they gotta go.\n\nThey may talk a big game about bringing security, but they got guns and are more than happy to use 'em.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
headhunters_eliminateall_cfp_M_title_001=[BP] ~mission(Location) has been greenlit
headhunters_eliminateall_cfp_desc_001=Here's the deal. Some of those mercs that CFP hired as security went and shot up some Headhunters that were just moving through the system. They weren't even doing anything, just flying.\n\nAnyway, we tracked them back to ~mission(Location|Address) and want to dish out some payback. Grab your gear and be our weapon, we'll make it worth your while.\n\n- Stows\n\nBlueprints this contract can award (as of 4.10.1):\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)
headhunters_eliminateall_cfp_title_001=[BP] Looking for a little revenge
headhunters_eliminateall_outpost_desc_01=Some assholes are refusing to pay us what we’re owed. Problem is, these idiots are bragging about it. Had they kept it quiet, we could’ve taken care of this more surgically, but now we need to send a message.\n\nThe fools are operating from ~mission(Location|Address). We need them all gone. Make it as loud as you can. We’ll send your payment once everyone’s taken care of.\n\n- Stows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)
headhunters_eliminateall_outpost_title_01=[BP] Reputation Management
headhunters_eliminateall_retrievestolen_base_Generic_M_desc_001=Local crew decided to hit one of our convoys and steal our shit. They got away, but we aren't gonna let them celebrate for long. I want you to head out to ~mission(Location|Address) where they got a base, blast them into ash, and get our stuff back. \n\nOnce you got the cargo, take it over to ~mission(Destination|Address) and we can all forget these assholes ever existed.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)
headhunters_eliminateall_retrievestolen_base_Generic_M_title_001=[BP] Death and cargo
headhunters_eliminateall_xt_desc_001=It's sad to say but we lost one of our outposts to XenoThreat. Appalling if you ask me, but that's why we're looking for someone who's got the time and ammunition to take it back.\n\nIf that's you, head over to ~mission(Location|Address) and take it back.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)
headhunters_eliminateall_xt_title_001=[BP] Green light on ~mission(Location)
headhunters_killship_asteroid_rank0_desc_001=So here's the deal, Headhunters are looking to expand their talent pool and have a few openings for anyone who's got the stones.\n\nThere's a real piece of work named ~mission(TargetName) who thinks they've been really clever pinching cargo off of haulers moving through the system. We asked for a cut of their profits as a licensing tax to continue operating. When ~mission(TargetName|Last) responded, they were very disrespectful.\n\nWe've tracked their ship to ~mission(Location|Address) and need them taken out. You should know, they're being smart and sticking close to some allies so they won't be alone.\n\nDo this and we'll consider you for future Headhunter work.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
headhunters_killship_asteroid_rank0_title_001=[BP] Target takedown for a fast track in
headhunters_killship_asteroid_rank1_desc_001=There's a nest that needs to be taken out around ~mission(Location|Address) that has been taken over by some squatters. We don't care about most of them, but word's gotten back to us that they're sheltering ~mission(TargetName) who has a long history of stealing Headhunter loot. Time's come to take them out.\n\nWord is that ~mission(TargetName|Last) is in a ship, but may rely on the base's defenses to protect them, so be careful. You kill 'em, you get paid. \n\nYou know, the usual.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
headhunters_killship_asteroid_rank1_title_001=[BP] Target at ~mission(Location) 
headhunters_killship_cfp_hrt_desc_001=Need another CFP ship taken out. It belongs to ~mission(TargetName), who's been  driving locals out of their homes if they don't accept Citizens for Prosperity help. They're a real piece of work and we've been given the go-ahead to take them down.\n\nTheir ship was spotted around ~mission(Location|Address), so head out there and do the deed.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
headhunters_killship_cfp_hrt_title_001=[BP] Kill Order
headhunters_killship_cfp_mrt_desc_001=CFP Security forces have been attacking locals and we're looking to balance the scales. Caught wind of one in particular named ~mission(TargetName|Last) who's been causing some damage and we need them taken out.\n\nYou can find them flying around ~mission(Location|Address). Go introduce yourself.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
headhunters_killship_cfp_mrt_title_001=[BP] Hit a CFP Ship
headhunters_killship_cfp_vhrt_desc_001=Got a platinum target that needs to get taken down. ~mission(TargetName) is a heavy hitter who's one of the people running security for Citizens for Prosperity. Although ~mission(TargetName|Last) might have forgotten, the Headhunters remember their work with a merc company a few years ago that lead to the deaths of five brothers and sisters. We want blood for blood.\n\nThey've been spotted poking around ~mission(Location|Address), so you should still be able to find them there.\n\nThey're a mean bastard, so bring some friends but make sure they end up dead.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
headhunters_killship_cfp_vhrt_title_001=[BP] Primo Target
headhunters_killship_gen_hrt_desc_001=We got a greenlight to finally take out ~mission(TargetName). They've been a pain in our ass ever since they came to the system a few years ago and it's finally time to take them out once and for all. \n\nWe've gotten word that ~mission(TargetName|Last) was spotted flying near ~mission(Location|Address) and the Judge wants this handled now.\n\nTake 'em out.\n\n- Stows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
headhunters_killship_gen_hrt_title_001=[BP] Wanted: ~mission(TargetName)
headhunters_killship_gen_lrt_desc_001=Got another scumbag who needs their ticket punched. ~mission(TargetName) is just a low level thug who doesn't seem to learn. We've warned them to either throw in with us or move system, but they don't seem to be listening so we're out of patience.\n\nHead to ~mission(Location|Address) and you should find ~mission(TargetName|Last) flying around. \n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
headhunters_killship_gen_lrt_title_001=[BP] Simple Hit
headhunters_killship_gen_mrt_desc_001=Another gang tried to make a move and carve out some territory for themselves. They failed but Headhunters don't forget. We've taken out most of them but one of the last members named ~mission(TargetName) has been spotted flying around ~mission(Location|Address).\n\nOdds are they're getting desperate, so don't underestimate them in the fight.\n\nYou'll get paid when it's done.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
headhunters_killship_gen_mrt_title_001=[BP] Treat yourself to a fight
headhunters_killship_gen_vlrt_desc_001=Got a small fry who thinks they can hit the Headhunters and get away with it. So ~mission(TargetName) tried to knock over one of our stashes and think they can get away with it. \n\nLast we heard they were spotted around ~mission(Location|Address). We need someone to head over and send a very clear message who is the reigning power in the system.\n\nDo it quick and clean.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
headhunters_killship_gen_vlrt_rank0_desc_001=You know us. You know what we do. System’s getting a little crowded, so we’re looking for some good soldiers to help keep our place here.\n\nIf you’re up for it and don’t mind getting your hands dirty, we’ve got something to prove you’ve got the stuff we’re looking for.\n\n~mission(TargetName) was a former member who sold us out to XenoThreat and got some of their brothers and sisters killed. Now they think they can just live their life without consequence.\n\nYou take them out. You get boosted in. Sounds like a fair trade.\n\nThey’ve been spotted around ~mission(Location|Address), so get there and take care of it.\n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
headhunters_killship_gen_vlrt_rank0_title_001=[BP] Wanna be a Headhunter?
headhunters_killship_gen_vlrt_title_001=[BP] ~mission(TargetName) needs stomping
headhunters_killship_xenothreat_ert_desc_001=Need you to move quick on this one. There's a XenoThreat lieutenant named ~mission(TargetName) who's popped up for air. Judge thinks this is a big chance to mess with XenoThreat's command by taking them out. I heard ~mission(TargetName|Last) was spotted flying around ~mission(Location|Address), so get there quick before they disappear again.\n\nI'd bring some support, I doubt they'll go down without a fight. \n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
headhunters_killship_xenothreat_ert_title_001=[BP] Ghost some XenoTrash
headhunters_multikillship_base_Generic_M_desc_001=A lotta wannabe gangs have stepped to the Headhunters over the years thinking that they could force their way into the system. We're still here. They aren't. But it seems the survivors of these groups have decided to band together and try again. Guess some people never learn.\n\nLatest group hit a couple of our convoys while on supply runs. Shouldn't be a surprise that the Judge wants to stomp them out quick. We've learned they're out near ~mission(Location|Address) and likely rearming for another attack. \n\nWe want you to go there and make them wish they died with their old gang.\n\nStows out\n\nBlueprints this contract can award (as of 4.10.1):\n- 10-Series Greatsword Cannon\n- 11-Series Broadsword Cannon\n- 9-Series Longsword Cannon\n- Dominance-1 Scattergun\n- Dominance-2 Scattergun\n- Dominance-3 Scattergun\n- HeatSafe\n- HeatSink\n- IceBox\n- M6A Cannon\n- M7A Cannon\n- M8A Cannon\n- NN-13 Cannon\n- NN-14 Cannon\n- NN-15 Cannon\n- NightFall\n- Singe Cannon (S1)\n- Singe Cannon (S2)\n- Singe Cannon (S3)\n- Sledge I Mass Driver Cannon\n- Sledge II Mass Driver Cannon\n- Sledge III Mass Driver Cannon\n- SnowBlind\n- Strife Mass Driver Cannon\n- VaporBlock
