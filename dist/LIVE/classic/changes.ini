ORS_Construct_Large_Desc=Alright,\n\nThe damage reports are still rolling in from the Nine Tails' attack on Orison and the folks at Crusader are saying they might have to repair a significant proportion of the propulsors on those platforms. That's why this one's a massive order.\n\nLarger quantity, but same as before otherwise. Either manufacturer them yourself using an Item Fabricator or source them some other way.\n\nWhen you're done, drop the propulsors off at <EM4>~mission(Destination|Target|Address)</EM4>. Be a big payout with this one.\n\nTa very much,\nHal Grimsby\nContracts Manager\n\nCORNERSTONE DEVELOPMENTS\n"Building on the Foundations of our Past."\n\nBlueprints this contract can award (as of 4.10.1):\n- TH-01 Propulsor
ORS_Construct_Large_Title=[BP] Orison Relief: Large Fabrication Order
ORS_Construct_Medium_Desc=Hullo,\n\nCrusader have been in touch to say that the scale of the damage to their platforms is greater than they initially thought and they'll need more propulsors than they originally estimated for.\n\nWe're contracting out their request to anyone with an available Item Fabricator standing by. Though I guess you could source the propulsors some other way, but that's on you.\n\nOnce ready, deliver them to <EM4>~mission(Destination|Target|Address)</EM4>. Payment sent on completion.\n\nTa very much,\nHal Grimsby\nContracts Manager\n\nCORNERSTONE DEVELOPMENTS\n"Building on the Foundations of our Past."\n\nBlueprints this contract can award (as of 4.10.1):\n- TH-01 Propulsor
ORS_Construct_Medium_Title=[BP] Orison Relief: Medium Fabrication Order
ORS_Construct_Small_Desc=Now then,\n \nAfter the Nine Tails attack, the folks at Crusader could do with more than just a helping hand. What they need are proper propulsors to help replace the ones damaged in the attacks.\n \nWe've attached a blueprint for the TH-01 Propulsor that you can access at an <EM4>Item Fabricator.</EM4> Just search for it on the fabricator's terminal and you'll be able to see what materials are needed. Up to you whether you go out and find those materials yourself or buy them from a trader. (And if you don't have a fabricator yet, you'll have to purchase one at a shop, unload it at a freight elevator, and then set it up in a hangar or ship's cargo bay.) \n \nOnce you're done bring them to <EM4>~mission(Destination|Target|Address)</EM4> and one of the team will sort out the rest.\n \nTa very much,\nHal Grimsby\nContracts Manager\n\nCORNERSTONE DEVELOPMENTS\n"Building on the Foundations of our Past."\n\n\nBlueprints this contract can award (as of 4.10.1):\n- TH-01 Propulsor
ORS_Construct_Small_Title=[BP] Orison Relief: Small Fabrication Order
RAIN_collectresources_multiple_GEN_desc_01=To all available contractors,\n\nRayari scientists are hard at work trying to solve the issues with failing regen tech. Currently, their efforts are hindered by a lack of materials which they believe could be essential for their experiments.  \n\nIn particular, our scientists at <EM4>~mission(Destination|Address)</EM4> have had to put their work on hold after running out of those resources. With a restock from our normal provider not possible for months owing to short supply, we’ll pay a premium to anyone who can assist with restocking the materials.\n\nFor more information on the animals in question, refer to "Explorer's Guide to Harvestables" in your Journal.\n\nTogether we can make the universe better for all.\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing\n\nBlueprints (only some versions of this contract award these, as of 4.10.1):\n- P8-AR Rifle\n- P8-AR Rifle Magazine (15 Cap)\n- Palatino Arms\n- Palatino Arms Moonfall\n- Palatino Core\n- Palatino Core Moonfall\n- Palatino Helmet\n- Palatino Helmet Moonfall\n- Palatino Legs\n- Palatino Legs Moonfall\n- Prism "Bonedust" Laser Shotgun\n- Prism "Deep Sea" Laser Shotgun\n- Prism "Firesteel" Laser Shotgun\n- Prism Laser Shotgun\n- Prism Laser Shotgun Battery (20 cap)\n- Siebe Helmet\n- Stirling Exploration Suit
RAIN_collectresources_multiple_GEN_name_01=[BP]* Additional Resources For Research
RAIN_collectresources_multiple_OLP_desc_01=To all available contractors,\n\nRayari scientists are hard at work trying to solve the issues with failing regen tech. Currently, their efforts are hindered by a lack of three resources essential for their experiments: <EM4>saldynium, jaclium, and carinite</EM4>.  \n\nIn particular, our scientists at <EM4>~mission(Destination|Address)</EM4> have had to put their work on hold after running out of those resources. With a restock from our normal provider not possible for months owing to short supply, we’ll pay a premium to anyone who can assist with restocking the materials.\n\nThough we haven’t been able to do thorough scans, there’s a strong belief among our teams that Hathor’s defunct Orbital Laser Platforms were built above areas with a high concentration of these resources. Reactivating these OLP could be your best hope of acquiring what we need.\n\nTogether we can make the universe better for all.\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Pulse "Blacklist" Pistol\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Quartz "Black Op" Energy SMG\n- Quartz "Deadfall" Energy SMG\n- Quartz "Lumen" Energy SMG\n- Quartz Energy SMG\n- Quartz Energy SMG Battery (45 cap)
RAIN_collectresources_multiple_OLP_name_01=[BP] Vital Resources Needed For Research
RAIN_collectresources_single_OLP_desc_01=To all available contractors,\n\nOur research team at at <EM4>~mission(Destination|Address)</EM4> is working tirelessly on solving the current ‘Regen Crisis’ and addressing the issue of unstable imprints. Their work has produced promising results, but a lack of a key resource is impeding their ability to run further experiments. \n\nWe’ve received word from our supplier that increased demand combined with lower mining yields means that we won’t receive our scheduled shipment for another few months. Our research team can’t wait that long, and we’re hoping you can help.      \n\nThe resource is hard to come by, but we have it on good authority that the old Hathor mining facilities were built in areas with a high concentration of the ore. Since Hathor went defunct not long after establishing their operations in- system, there’s a good chance that activating one of these mining lasers could provide you with what we need.\n\nTogether we can make the universe better for all.\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Pulse "Blacklist" Pistol\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Quartz "Black Op" Energy SMG\n- Quartz "Deadfall" Energy SMG\n- Quartz "Lumen" Energy SMG\n- Quartz Energy SMG\n- Quartz Energy SMG Battery (45 cap)
RAIN_collectresources_single_OLP_name_01=[BP] Need Resource for Research\n
Shubin_Industrial_HandMining_Intro_Local_Desc_001,P=POSTING: Purchase Order\nLOCATION: <EM4>~mission(System) </EM4>\n\nTECH PREVIEW TESTING:\nComplete this mission to get blueprints for Volt weapons. For this test, these blueprints have some slots that accepting different materials for varying stat adjustments.\n\n~mission(Hint_Location) For a comprehensive list of where to find these minerals, consult <EM4>Mining Fundamentals #2: Where to Mine</EM4> in your mobiGlas Journal. While you're there, feel free to read the first part <EM4>Mining Fundamentals #1: Basic Overview</EM4> if you want a refresher on how to get the materials.\n\nSince this is a purchase order and not a mining contract, you are expected to provide your own equipment, such as a <EM4>~mission(Hint_Tool)</EM4>.\n\nOnce you’re ready to sell us the required materials, deposit them in the freight elevator located at <EM4>~mission(Destination|Address)</EM4>.\n\n*By accepting this contract you are assuming any and all risks associated with the work outlined herein and in no way can Shubin Interstellar be held accountable for any damages accrued during the duration of the contract."\n\nBlueprints this contract can award (as of 4.10.1):\n- Arclight "Desert Shadow" Pistol\n- Arclight "Herrero" Pistol\n- Arclight "Midnight" Pistol\n- Arclight Pistol Battery (30 cap)\n- Novikov Exploration Suit\n- Novikov Helmet\n- Pembroke Exploration Suit\n- Pembroke Helmet\n- Strata Arms\n- Strata Core\n- Strata Helmet Shooting Star\n- Strata Legs
Shubin_Industrial_HandMining_Intro_Local_Title_001=[BP] Small Purchase Order: Hand Mined Materials
