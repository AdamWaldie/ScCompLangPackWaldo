cfp_ChainElimAll_1C_ElimSpec_GenAttack_E_desc_001=We need any available security personnel to report to ~mission(Location|Address). A group of armed individuals have attacked one of our outpost clusters and we're in desperate need of help. Although the group seems to be unaffiliated with any of the known gangs, we've received word that their leader is ~mission(TargetName), a local outlaw with a vicious reputation.\n\nPlease head out as soon as you can and secure the area by taking out the outlaws and ~mission(TargetName|Last).\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms Lodestone\n- Artimex Core Lodestone\n- Artimex Helmet Lodestone\n- Artimex Legs Lodestone\n- Karna "Brimstone" Rifle\n- Karna Rifle Battery (35 cap)
cfp_ChainElimAll_1C_ElimSpec_GenAttack_E_title_001=[BP] Alert: ~mission(Location) under attack
cfp_ChainElimAll_1C_ElimSpec_HHAttack_M_desc_001=We are currently looking for any qualified and available security operatives to head out to ~mission(Location|Address) and reclaim a CFP installation that had been taken by Headhunters. \n\nThe group that's currently occupying the outpost is being led by ~mission(TargetName), a Headhunter of some note who's had a history of aggression against locals and CFP volunteers.\n\nWe need all Headhunters secured and ~mission(TargetName|Last) taken out.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms Lodestone\n- Artimex Core Lodestone\n- Artimex Helmet Lodestone\n- Artimex Legs Lodestone\n- Karna "Brimstone" Rifle\n- Karna Rifle Battery (35 cap)
cfp_ChainElimAll_1C_ElimSpec_HHAttack_M_title_001=[BP] Taking back from the Headhunters
cfp_ChainElimAll_1C_HHAttack_M_desc_001=We just received a frantic comm from ~mission(Location|Address) and are looking for any available combat specialists to help repel a Headhunter attack. There are still hostiles on site and there are reports of several casualties so we need this handled quickly.\n\nI will provide all relevant data upon acceptance. Thank you for your assistance.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)
cfp_ChainElimAll_1C_HHAttack_M_title_001=[BP] Help defend ~mission(Location) from Headhunters
cfp_ChainElimAll_2C_ElimSpec_GenAttack_M_desc_001=Several CFP clusters near ~mission(Location|Address) just got hit by a group of outlaws led by ~mission(TargetName). We're looking for any available combat specialists to help retake the outposts.\n\nI can provide the locations upon acceptance but we need to clear out the main outpost and satellite installations from all hostile forces and take out ~mission(TargetName|Last) as it's unlikely that they will not cease their hostilities if they escape.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms Lodestone\n- Artimex Core Lodestone\n- Artimex Helmet Lodestone\n- Artimex Legs Lodestone\n- Karna "Brimstone" Rifle\n- Karna Rifle Battery (35 cap)
cfp_ChainElimAll_2C_ElimSpec_GenAttack_M_title_001=[BP] Outlaw attack at ~mission(Location)
cfp_ChainElimAll_2C_ElimSpec_HHAttack_H_desc_001=Citizens for Prosperity is looking for any available security operatives to retake several former CFP installations near ~mission(Location|Address) from Headhunter control. These clusters were violently taken from us by ~mission(TargetName) and resulted in the deaths of many volunteers.\n\nBringing these outposts back under our control will help provide more stability to the system. Reports indicate that ~mission(TargetName|Last) tends to hide behind their rank and file, so they will likely appear once you've cleared out most of the hostiles.\n\nXenoThreat are trained and motivated so they will not give up easily.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms Lodestone\n- Artimex Core Lodestone\n- Artimex Helmet Lodestone\n- Artimex Legs Lodestone\n- Karna "Brimstone" Rifle\n- Karna Rifle Battery (35 cap)
cfp_ChainElimAll_2C_ElimSpec_HHAttack_H_title_001=[BP] Retaking Outposts from Headhunters
cfp_ChainElimAll_2C_ElimSpec_XTAttack_H_desc_001=Looking for any available security personnel to reclaim several clusters previously lost to XenoThreat aggressors. Located near ~mission(Location|Address), they had been seized in brutal attacks led by ~mission(TargetName), a notorious XenoThreat lieutenant.\n\nWe're looking to take these clusters back so we can reestablish operations and continue our good work. You'll need to clear all the hostiles still on-site as well as ~mission(TargetName|Last).\n\nJust a reminder, that XenoThreat are highly trained and quick to fight, so prepare accordingly.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms Lodestone\n- Artimex Core Lodestone\n- Artimex Helmet Lodestone\n- Artimex Legs Lodestone\n- Karna "Brimstone" Rifle\n- Karna Rifle Battery (35 cap)
cfp_ChainElimAll_2C_ElimSpec_XTAttack_H_title_001=[BP] Reclaiming Outposts from XenoThreat
cfp_ChainElimAll_3C_ElimSpec_GenAttack_M_desc_001=The outlaw presence here has become much bolder of late and a lot of people are getting hurt. We've recently lost several clusters around ~mission(Location|Address). While we don't like to have to resort to violence, the board has acknowledged that these locations are crucial to establishing stability in the system and authorized the use of a security detail to retake them.\n\nWe're also aware that the embedded hostiles are being led by ~mission(TargetName) who's had a history of attacking CFP interests. The board would like ~mission(TargetName|Last) dealt with to prevent future attacks.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)
cfp_ChainElimAll_3C_ElimSpec_GenAttack_M_title_001=[BP] Need multiple CFP outposts retaken
cfp_ChainElimAll_3C_ElimSpec_HHAttack_VH_desc_001=Citizens for Prosperity's board just authorized funds to hire security personnel to retake several clusters near ~mission(Location|Address) that have since fallen into the hands of the Headhunters. While we tried to just accept the loss, it's become apparent that they are crucial to our ongoing operations in the system.\n\nYou'll need to clear out each of the locations that will be provided but more importantly, you'll also need to take out ~mission(TargetName), who's in charge of the hostiles on site.\n\nThese Headhunters are heavily embedded and have a history of violence, so you should prepare accordingly. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)
cfp_ChainElimAll_3C_ElimSpec_HHAttack_VH_title_001=[BP] Reclaiming Clusters from Headhunters
cfp_ChainElimAll_3C_ElimSpec_XTAttack_VH_desc_001=Although Citizens for Prosperity is committed to change through non-violent means, it's become apparent that exceptions might have to be made. CFP safe zones near ~mission(Location|Address) were recently and violently taken by XenoThreat forces under the command of ~mission(TargetName).\n\nWe're looking for any available combat operatives to help take these outposts back. This will undoubtedly be a difficult endeavor as XenoThreat are highly trained and eager to fight, so you should prepare accordingly.\n\nAside from clearing each cluster of XenoThreat forces, you will need to take out ~mission(TargetName|Last), who's loss will certainly make the system safer.\n\nGood luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)
cfp_ChainElimAll_3C_ElimSpec_XTAttack_VH_title_001=[BP] Campaign to reclaim XenoThreat outposts 
cfp_bombingrun_E_desc_001=We've been having escalating issues with the outlaws at ~mission(Location|Address) and can no longer stand by and watch as their aggressive actions hurt our community. \n\nWe are wary of launching a full scale assault, but believe that if their fuel stores are wiped out, it would deter them from further hostile actions. \n\nIf you're able, I'd appreciate you handling the destruction of the fuel personally. A ship capable of launching missiles would probably make the most sense, but I leave that up to you.\n\nThanks,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- A03 Sniper Rifle\n- A03 Sniper Rifle Magazine (15 cap)\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- Argus Helmet\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- CBH-3 Helmet Base\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n- P6-LR Magazine (8 cap)\n- P6-LR Sniper Rifle\n- PAB-1 Arms\n- PAB-1 Core\n- PAB-1 Legs\n- TrueDef-Pro Arms\n- TrueDef-Pro Core Base\n- TrueDef-Pro Legs
cfp_bombingrun_E_title_001=[BP] Eliminate Fuel Stores
cfp_bombingrun_sabotage_generators_desc_001=There is a group of outlaws at ~mission(Location|Address) that have become increasingly brazen in their attacks on Citizens for Prosperity assets in the system. \n\nTo minimize loss of life, we want to first try convincing them to move on to somewhere else by disabling their generators and destroying their fuel reserves. \n\nHopefully, that should be enough to convince them to move on to greener pastures.\n\nThanks,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- A03 Sniper Rifle\n- A03 Sniper Rifle Magazine (15 cap)\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- Argus Helmet\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- CBH-3 Helmet Base\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n- P6-LR Magazine (8 cap)\n- P6-LR Sniper Rifle\n- PAB-1 Arms\n- PAB-1 Core\n- PAB-1 Legs\n- TrueDef-Pro Arms\n- TrueDef-Pro Core Base\n- TrueDef-Pro Legs
cfp_bombingrun_sabotage_generators_title_001=[BP] Reduce Outlaw's Operational Readiness
cfp_defend-criminals_desc_001=We learned that ~mission(Location|Address) is under threat of attack by outlaws and has asked for assistance. We need someone to protect them and drive away the outlaws. \n\nMake sure you stay close after their initial attack. Too often, outlaws win fights just by sending more bodies than anyone can reasonably defend against, so make sure you fight off any reinforcements before leaving the area. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms\n- Artimex Arms (Modified)\n- Artimex Core\n- Artimex Core (Modified)\n- Artimex Helmet\n- Artimex Legs\n- Karna "Fate" Rifle\n- Karna Rifle\n- Karna Rifle Battery (35 cap)
cfp_defend-criminals_title_001=[BP] Defend ~mission(Location) from Outlaws
cfp_defend-xenothreat_desc_001=We’ve learned that XenoThreat is about to launch an attack on ~mission(Location|Address). If they are successful, the number of casualties is expected to be high. I’m hoping that with your aid in defending them, we can make sure that doesn’t happen.\n \nWe know from past encounters that XenoThreat sends several raiding parties to carry out their attacks, so make sure you don’t leave the outpost until you’ve fought off all the reinforcements. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)
cfp_defend-xenothreat_desc_002=Urgent!\n\nXenoThreat is targeting ~mission(Location|Address) to send a message to other settlers about what happens if they accept our support. \n\nIf you’re able to fend off the attackers, I’m sure they’ll send additional forces, so you’ll need to dig in for multiple assaults. Since XenoThreat has a lot of resources at their disposal, you should think about recruiting others to help you keep everyone safe.\n\nWe’re all counting on you.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)
cfp_defend-xenothreat_desc_003=Urgent!\n\nXenoThreat is mobilizing for a massive incursion to wipe ~mission(Location|Address) off the map. You’re their only hope of enduring this assault and protecting them from XenoThreat’s cruelty.\n\nI know I’m asking you to put yourself in the line of fire, but this system won’t change unless people like you are brave enough to take on these dangers. No amount of credits could measure up to how much good you’d be doing by stepping in.\n\nIf you’re willing and able to take on this mission, make sure to take some allies with you. XenoThreat will certainly send in stronger reinforcements once they realize they’re taking losses.\n\nWe believe in you.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)
cfp_defend-xenothreat_title_001=[BP] Protect ~mission(Location) from XenoThreat Attack
cfp_defend-xenothreat_title_002=[BP] Protect ~mission(Location) from XenoThreat Raid
cfp_defend-xenothreat_title_003=[BP] Protect ~mission(Location) from XenoThreat Incursion
cfp_defend_boss_Generic_desc_001=We just received reports of a massive attack against ~mission(Location) by a large group of armed individuals led by ~mission(TargetName), a notorious outlaw who has been threatening Citizens for Prosperity personnel for months. Details are still yet to be confirmed but we know there have been multiple casualties.\n\nCitizens for Prosperity is looking for any qualified security personnel to go and retake the outposts from these hostile elements. Our understanding is that ~mission(TargetName|Last) tends to hide behind their soldiers, but will emerge if you take enough of the rank-and-file out.\n\nWhile we don't like to resort to violence, management can see no other way of resolving this situation and continuing our good work in the system.\n\nGood luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms Canuto\n- Artimex Core Canuto\n- Artimex Helmet Canuto\n- Artimex Legs Canuto\n- Karna "Valor" Rifle\n- Karna Rifle Battery (35 cap)
cfp_defend_boss_Generic_title_001=[BP] ~mission(Location|Address) needs help
cfp_defend_cave_Generic_desc_001=We received a distress call from ~mission(Location|Address) saying that they're being robbed by a small group of outlaws. ~mission(Location|CaveSize) Though remote, this outpost is a crucial piece of CFP's infrastructure in the area so we need to take it back.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)
cfp_defend_cave_Generic_title_001=[BP] Assistance needed at ~mission(Location)
cfp_defend_headhunters_H_desc_001=A distress call just came in from ~mission(Location|Address) claiming that a large Headhunter force has just attacked our outpost there. There have been multiple deaths and injuries from those who managed to flee the scene. We're looking for any available security personnel to head there and retake the outpost.\n\nWitness accounts identified the attackers as elite Headhunter enforcers, so watch yourself out there and bring help if you can. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)
cfp_defend_headhunters_H_title_001=[BP] Headhunter attack on ~mission(Location)
cfp_defend_headhunters_M_desc_001=Headhunters have launched an unprovoked attack against ~mission(Location|Address). Although we don't support the use of violence, Citizens for Prosperity won't let innocent people die. We need qualified security personnel to retake the outpost.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)
cfp_defend_headhunters_M_title_001=[BP] ~mission(Location) needs assistance
cfp_defend_regionshift_desc_001=We've received a distress call from ~mission(Location|Address). A group of unknown assailants have launched an attack. There have been multiple deaths reported and we need to reclaim the outpost.\n\nI know this is far from your current position, but we're desperate to secure the area and get the outpost back and running again.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms\n- Artimex Arms Canuto\n- Artimex Arms Lodestone\n- Artimex Core\n- Artimex Core Canuto\n- Artimex Core Lodestone\n- Artimex Helmet\n- Artimex Helmet Canuto\n- Artimex Helmet Lodestone\n- Artimex Legs\n- Artimex Legs Canuto\n- Artimex Legs Lodestone\n- Karna "Brimstone" Rifle\n- Karna "Valor" Rifle\n- Karna Rifle\n- Karna Rifle Battery (35 cap)
cfp_defend_regionshift_title_001=[BP] Call for Help: ~mission(Location)
cfp_defendship_LRT_desc_001=One of our pilots had just picked up a shipment of supplies near ~mission(Location|Address) when they were attacked by some vicious shipjackers. \n\nWe just received their distress beacon and I'm hoping you can go provide them combat support.\n\nAny assistance you could give would make all the difference.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints (only some versions of this contract award these, as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
cfp_defendship_LRT_title_001=[BP]* Pilot Seeking Combat Support
cfp_defendship_MRT_desc_001=A Citizens for Prosperity affiliated ship was attempting to deliver some supplies to ~mission(Location|Address) when they were attacked by the recipients who didn't want to pay for their purchase and chose violence instead.\n\nI'll instruct our traders to be more careful about who they deal with in the future, but for now, I would really appreciate you lending them a hand in fighting off these attackers. \n\nAppreciated,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints (only some versions of this contract award these, as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
cfp_defendship_MRT_title_001=[BP]* Ship Needs Emergency Assistance
cfp_defendship_VLRT_desc_001=It seems one of the routes that we had thought relatively safe has proven otherwise. Outlaws have attacked one of our pilots over at ~mission(Location|Address) and they won't make it much longer without support. \n\nI'd appreciate it if you could fly there as quickly as possible and help them deal with these attackers.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints (only some versions of this contract award these, as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
cfp_defendship_VLRT_title_001=[BP]* Pilot in Distress
cfp_defendship_multi_HRT_desc_001=We just received word that a convoy of Citizen for Prosperity affiliated ships have been targeted by outlaws and that our people are in dire need of assistance. \n\nIf you are available, we need combat ready pilots at ~mission(Location|Address) to defend our people. Note that at this dire time, we cannot afford even a single lost ship and expect with your assistance for all of our people make it out alive.\n\nGood luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
cfp_defendship_multi_HRT_title_001=[BP] Convoy Caught in Brutal Attack
cfp_defendship_multi_SRT_desc_001=I’m getting reports that a Citizens for Prosperity convoy carrying vital supplies is currently under attack at <EM4>~mission(Location|Address)</EM4>. It’d be a big blow to our operations if we lost that cargo. \n\nIf you’ve got the combat skills to go up against highly aggressive hostiles, we’re more than willing to pay for your help. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
cfp_defendship_multi_SRT_title_001=[BP] Come to Aid of Convoy
cfp_defendship_multi_VHRT_desc_001=A Citizens for Prosperity convoy on a resupply run dropped a distress beacon near <EM4>~mission(Location|Address)</EM4>. They’re not answering any comms, so I assume the situation is serious. That convoy has some skilled pilots, so if they’re not responding then they definitely need the help.\n\nWe’ll compensate you to support that convoy.  \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
cfp_defendship_multi_VHRT_title_001=[BP] Respond to Distress Beacon
cfp_eliminateall_XT_E_desc_001=Despite our efforts to promote non-violence, local outlaw groups continue to attack our organization. XenoThreat recently assaulted ~mission(Location|Address) and chased out our volunteers that had been working there.\n\nWe're looking to enlist combat personnel to retake the outpost. Ideally we could work something out to encourage them to move on, but XenoThreat quickly resorts to violence to solve all their issues so there will undoubtedly be a fight.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms Canuto\n- Artimex Core Canuto\n- Artimex Helmet Canuto\n- Artimex Legs Canuto\n- Karna "Valor" Rifle\n- Karna Rifle Battery (35 cap)
cfp_eliminateall_XT_E_title_001=[BP] Reclaim XenoThreat Outpost
cfp_eliminateall_fromCFP_Gen_E_desc_001=Citizens for Prosperity is looking for any available combat operators to ~mission(Location|Address). A group of outlaws have launched an unprovoked attack and our security personnel are desperately in need of support.\n\nPlease dispatch to ~mission(Location) with all urgency and good luck.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms Canuto\n- Artimex Core Canuto\n- Artimex Helmet Canuto\n- Artimex Legs Canuto\n- Karna "Valor" Rifle\n- Karna Rifle Battery (35 cap)
cfp_eliminateall_fromCFP_Gen_E_title_001=[BP] Attack on CFP outpost
cfp_eliminateall_fromCFP_XT_M_desc_001=XenoThreat forces launched an unprovoked attack near ~mission(Location|Address). We're looking for any available combat operators to go and provide support. \n\nIf you haven't dealt with them before, it's important to know that XenoThreat are trained fighters so this will not be an easy fight, but it's a necessary one.\n\nGood luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints (only some versions of this contract award these, as of 4.10.1):\n- Artimex Arms Canuto\n- Artimex Core Canuto\n- Artimex Helmet Canuto\n- Artimex Legs Canuto\n- Karna "Valor" Rifle\n- Karna Rifle Battery (35 cap)
cfp_eliminateall_fromCFP_XT_M_title_001=[BP]* Protecting outpost from XenoThreat
cfp_eliminateall_fromCFP_hh_M_desc_001=We received an emergency comm from ~mission(Location|Address) reporting that they are currently under attack by a group of Headhunters. We know our presence in the system has upset the Headhunters, but it hardly excuses this unprovoked attack.\n\nIf available, please gather your gear and head out. Just understand that Headhunters are experienced fighters and will not back down easily.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms Canuto\n- Artimex Arms Wildwood\n- Artimex Core Canuto\n- Artimex Core Wildwood\n- Artimex Helmet Canuto\n- Artimex Helmet Wildwood\n- Artimex Legs Canuto\n- Artimex Legs Wildwood\n- Karna "Rager" Rifle\n- Karna "Valor" Rifle\n- Karna Rifle Battery (35 cap)
cfp_eliminateall_fromCFP_hh_M_title_001=[BP] Defenders needed against Headhunters
cfp_eliminateall_hh_E_desc_001=Citizens for Prosperity is looking for security personnel to take a former CFP outpost that's currently serving as a hideout for Headhunters to launch attacks throughout the system. \n\nLocated near ~mission(Location|Address), reclaiming this outpost will allow CFP to provide greater support to local efforts to build stability.\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)
cfp_eliminateall_hh_E_title_001=[BP] Reclaim Headhunter Outpost
cfp_sabotage_VH_desc_001=Citizens for Prosperity have been monitoring a very dangerous outlaw group at ~mission(Location|Address) and we believe that they are in midst of planning a major attack which could throw the whole system into upheaval.\n\nIn order to protect all the progress we've made here, we would like you to raid their compound and destroy all the servers housing their plans. \n\nThis should at least provide us with enough of a reprieve for them to reconsider their offensive.\n\nThank you,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)
cfp_sabotage_VH_title_001=[BP] Destroy Outlaw Data Servers
cfp_sabotage_generators_M_desc_001=We have gotten word that the outlaws at ~mission(Location|Address) have begun recruiting with the hopes of launching a raid against Citizens for Prosperity. \n\nIn order to deescalate the situation before it gets out of hand, we would like you to disable their power generators and halt their expansion. \n\nPull this off and it could save a lot of lives.\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)
cfp_sabotage_generators_M_title_001=[BP] Take Outlaws at ~mission(Location) Offline
cfp_sabotage_generators_VE_desc_001=Following a series of raids against Citizens for Prosperity aligned settlements, we believe we have traced those responsible back to ~mission(Location|Address).\n\nAttacking them directly will pose too great of a risk and most likely encourage aggressive reprisals. Instead, we believe that if their power generators were to be disable it could force them to settle somewhere else.\n\nDo you think you could handle it for us?\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- A03 Sniper Rifle\n- A03 Sniper Rifle Magazine (15 cap)\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- Argus Helmet\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- CBH-3 Helmet Base\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n- P6-LR Magazine (8 cap)\n- P6-LR Sniper Rifle\n- PAB-1 Arms\n- PAB-1 Core\n- PAB-1 Legs\n- TrueDef-Pro Arms\n- TrueDef-Pro Core Base\n- TrueDef-Pro Legs
cfp_sabotage_generators_VE_title_001=[BP] Disable Outlaw Stronghold at ~mission(Location)
cfp_sabotage_server_elimiatespecific_HH_desc_001=We're just putting the full picture together now, but so far we've learned that a Headhunter by the name of ~mission(TargetName) recently stole some sensitive data that if exposed will be detrimental to Citizens for Prosperity's cause. \n\nWe need to ensure that all traces of the stolen data are eradicated. This means taking out all the Headhunter servers at ~mission(Location|Address) as well as tracking down ~mission(TargetName|Last) to stop them from further disseminating the information.\n\nYour help is much appreciated,\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- A03 Sniper Rifle\n- A03 Sniper Rifle Magazine (15 cap)\n- Argus Helmet\n- CBH-3 Helmet Base\n- P6-LR Magazine (8 cap)\n- P6-LR Sniper Rifle\n- PAB-1 Arms\n- PAB-1 Core\n- PAB-1 Legs\n- TrueDef-Pro Arms\n- TrueDef-Pro Core Base\n- TrueDef-Pro Legs
cfp_sabotage_server_elimiatespecific_HH_title_001=[BP] Eradicate All Traces of Headhunter Data
cfp_sabotage_servers_H_XT_desc_001=We got a bit of a problem that I'm hoping you can solve for me. One of our informers has revealed that XenoThreat has been amassing data on Citizens for Prosperity operations throughout the system. \n\nThis information, if used correctly, could put our people at serious risk. The best solution is for you to completely destroy the servers where the data is being stored at ~mission(Location|Address).\n\nWith their trove of information wiped out, it should give our people a fighting chance.\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- A03 Sniper Rifle\n- A03 Sniper Rifle Magazine (15 cap)\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- Argus Helmet\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- CBH-3 Helmet Base\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n- P6-LR Magazine (8 cap)\n- P6-LR Sniper Rifle\n- PAB-1 Arms\n- PAB-1 Core\n- PAB-1 Legs\n- TrueDef-Pro Arms\n- TrueDef-Pro Core Base\n- TrueDef-Pro Legs
cfp_sabotage_servers_H_XT_title_001=[BP] Destroy XenoThreat Logistic Data
cfp_sabotage_servers_M_HH_desc_001=The Headhunters recently attacked one of our transports and were sadly able to get their hands on some secure data. Although the encryption on it is strong, its only a matter of time before they'll be able to access it.\n\nBefore that happens, we need you to go to ~mission(Location|Address) and destroy all traces of the information from their servers.\n\nYou'd really be helping Citizens for Prosperity out if you can pull this off.\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- A03 Sniper Rifle\n- A03 Sniper Rifle Magazine (15 cap)\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- Argus Helmet\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- CBH-3 Helmet Base\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)\n- P6-LR Magazine (8 cap)\n- P6-LR Sniper Rifle\n- PAB-1 Arms\n- PAB-1 Core\n- PAB-1 Legs\n- TrueDef-Pro Arms\n- TrueDef-Pro Core Base\n- TrueDef-Pro Legs
cfp_sabotage_servers_M_HH_title_001=[BP] Destroy Headhunter Stolen Data
cfp_sabotage_servers_VH_XT_desc_001=One of the Citizens for Prosperity members who have been serving as a XenoThreat informer has let us know that the data servers located at ~mission(Location|Address) our housing a trove of information vital to the gang's operation. \n\nIf you were able to destroy these servers on our behalf it would be a huge win for the security of the entire system.\n \nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- ADP Arms Woodland\n- ADP Core\n- ADP Legs Woodland\n- ADP-mk4 Arms Woodland\n- ADP-mk4 Core Woodland\n- ADP-mk4 Helmet Woodland\n- ADP-mk4 Legs Woodland\n- BR-2 Shotgun\n- BR-2 Shotgun Magazine (12 cap)\n- Balor HCH Helmet\n- FS-9 LMG\n- FS-9 Magazine (75 cap)\n- Gallant Rifle\n- Gallant Rifle Battery (45 cap)
