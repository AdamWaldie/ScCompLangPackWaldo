Intersec_TSG_Assist_Solo_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Vanduul\nEquipment Specs: Combat Ready\nBriefing: \nAn Idris-class People's Alliance security vessel named Tranquility is currently engaged with a <EM>Vanduul capital ship</EM4> near an old <EM4>QV Extraction station</EM4> and Intersec is looking for combat pilots to lend some support.\n\nScramble to the AO and <EM4>engage Vanduul fighters so the Tranquility can focus on the capital ship</EM4>. \n\nGood luck,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- CoverAll\n- Deadbolt I Cannon\n- Deadbolt II Cannon\n- Deadbolt III Cannon\n- ForceWall\n- FullBlock\n- Tailwind Flight Helmet Blackbolt\n- Tailwind Flight Helmet Green Streak\n- Tailwind Flight Suit
Intersec_TSG_Assist_Solo_Title_001=[BP] Assist People's Alliance Vessel Tranquility
Intersec_TSG_BombRun_Solo_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Shattered Blade\nEquipment Specs: Combat Ships w/Ordnance\nBriefing: \nLocal assets have indicated that Shattered Blade elements are attempting to rebuild one of their stations and Intersec is looking for a pilot to make sure that doesn't happen.\n\nThey've managed to get basic turret defenses back online but currently only have <EM4>two power relays activated</EM4>. These will be your targets as they <EM4>cannot be destroyed by energy weapons, you will need to bring ballistic or ordnance to be effective</EM4>. \n\nReactivation of this station will allow the Shattered Blade to try and reclaim a foothold in this system and we can't let that happen.\n\nGood luck,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- Deadbolt IV Cannon\n- Deadbolt V Cannon\n- Deadbolt VI Cannon\n- Permafrost\n- Polar\n- Tailwind Flight Helmet Adrenaline\n- Tailwind Flight Helmet Big Bite\n- Tailwind Flight Suit\n- Tempest
Intersec_TSG_BombRun_Solo_Title_001=[BP] Strategic Bombing
Intersec_TSG_Group_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Shattered Blade\nEquipment Specs: Strike Group\nBriefing: \nWe've received word that a People's Alliance security ship called Tranquility stumbled across  Shattered Blade hiding out in an old QV Extraction station. Details are sketchy but will connect you with local assets once on site. \n\nIntersec is looking for a team to intervene and protect the Tranquility and their personnel. Based on discussions with the Tranquility's captain, you will <EM4>need  ballistic and ordnance to break down the defenses of the station</EM4> and ultimately <EM4>get boots on the ground to save their pilot</EM4>.\n\n<EM4>Recruiting additional ships</EM4> to support you in this mission is absolutely critical. You will <EM4>need a variety of ship types</EM4> to balance multiple combat zones in space and on the ground.\n\nRespectfully,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- JS-300\n- JS-400\n- JS-500\n- Neutrino Racing Flight Suit BlackFire\n- Neutrino Racing Flight Suit BlueFlame\n- Neutrino Racing Flight Suit WhiteHot\n- Neutrino Racing Helmet BlackFire\n- Neutrino Racing Helmet BlueFlame\n- Neutrino Racing Helmet WhiteHot\n- Novian "Ghostmaker" Crossbow\n- Novian "Nighthunter" Crossbow\n- Novian "Wildshot" Crossbow\n- Novian Crossbow\n- Omnisky III Cannon\n- Omnisky IX Cannon\n- Omnisky VI Cannon\n- Omnisky XII Cannon\n- Omnisky XV Cannon\n- Omnisky XVIII Cannon\n- QuadraCell MX\n- Tailwind Flight Helmet Airwolf\n- Tailwind Flight Helmet Blue Skies\n- Tailwind Flight Helmet Frostshock\n- Tailwind Flight Helmet Thunderstruck
Intersec_TSG_Group_Title_001=[BP] Tactical Strike Group Needed
