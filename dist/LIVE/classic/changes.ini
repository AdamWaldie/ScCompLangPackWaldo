FTL_Courier_Stanton_Easy_Desc_001=AVAILABLE FTL CONTRACT\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS** \nA reliable and hardworking entry-level courier is needed to ferry a delivery in Stanton.\nYou will be responsible for providing your own transportation.\nInterested contractors need the <EM4>ability to lift up to .25 SCU boxes</EM4>.\nContractors are employed on an independent basis and therefore not covered by FTL's company insurance.\n\n~mission(Contractor|SignOff)\n\nBlueprints this contract can award (as of 4.10.1):\n- Agni\n- Colossus\n- Defiant\n- Endurance\n- Huracan\n- Sedulity
FTL_Courier_Stanton_Easy_Title_001=[BP] ENTRY LVL. COURIER NEEDED IN STANTON
FTL_Courier_Stanton_Medium_Desc_001=AVAILABLE FTL CONTRACT\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS**\nJunior-level courier needed for deliveries across the Stanton System.\nTransportation must be provided by courier.\nYou will be <EM4>required to lift up to .25 SCU</EM4> in weight.\nCouriers are responsible for the correct handling and safety of all packages charged to their care.\n\n~mission(Contractor|SignOff)\n\nBlueprints this contract can award (as of 4.10.1):\n- Agni\n- Colossus\n- Defiant\n- Endurance\n- Huracan\n- Sedulity
