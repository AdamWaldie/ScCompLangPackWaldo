Battaglia_RPT_Scan_04_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Full Area Scan For Ore\n\nWORK BRIEF: \nI need you to check something out for me if you’re not busy. I'm looking to build on our mineral database and need some scans of <EM4>~mission(Resources)</EM4>. I can handle the mining if you want to leave it. ~mission(Rarity)\n\nAlso, if you're stuck on where to look or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nLet me know.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Harkin\n- Lindstrom\n- Norfield\n- Pitman Mining Laser\n- S0 Helix\n- Strata Arms Levski Edition\n- Strata Backpack Levski Edition\n- Strata Core Levski Edition\n- Strata Helmet Levski Edition\n- Strata Legs Levski Edition
