Battaglia_RPT_Scan_03_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ore Deposit Needs Scanning\n\nWORK BRIEF: \nI'm looking for an available miner to go out and scan for <EM4>~mission(Resources)</EM4>. Just need confirmation that it’s there and worth sending someone to collect. ~mission(Rarity)\n\nAlso, if you're stuck or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nLet me know if you’ve got the time.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Harkin\n- Lindstrom\n- Norfield\n- Pitman Mining Laser\n- S0 Helix\n- Strata Arms Levski Edition\n- Strata Backpack Levski Edition\n- Strata Core Levski Edition\n- Strata Helmet Levski Edition\n- Strata Legs Levski Edition
