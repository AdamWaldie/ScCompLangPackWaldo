Foxwell_DefendEntitesAndEscort_VE_Desc,P=For any pilots in the area – a group of bandits is targeting one of our clients at <EM4>~mission(Location|Address)</EM4>, specifically their <EM4>~mission(Objects)</EM4> and the maintenance ships that manage them. From our intel, it's only a few outlaws trying to make some quick credits, but they're also the type to cause some real damage if you get in their way.\n\nIf you take care of them and relocate the client's ship and crew safely, we’re offering <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor. \n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- 7CA 'Nargun'\n- 7MA 'Lorica'\n- 7SA 'Concord'\n- ArcticStorm\n- Aufeis\n- Berian\n- Celestial\n- ColdSnap\n- Draug\n- Elsen\n- Fridan\n- Frost-Star\n- Frost-Star EX\n- Frost-Star SL\n- Frost-Star XL\n- FrostBurn\n- FullForce\n- FullForce Pro\n- Gelid\n- Graupel\n- HAVEN\n- INK\n- IonBurst\n- IonSurge\n- IonSurge Pro\n- IonWave\n- Kragen\n- LightBlossom\n- MagnaBloom\n- NewDawn\n- PowerBolt\n- RPEL\n- Radiance\n- Radix\n- Tepilo
Foxwell_DefendEntitesAndEscort_VE_Title,P=[BP] Yellow Lvl. Contract: Defend ~mission(Objects) and Escort Employees
Foxwell_DefendEntitesAndEscort_VH_Desc,P=Urgent ship aid needed at <EM4>~mission(Location|Address)</EM4>. A band of destructive criminal outlaws that have been trying to make a name for themselves recently has struck hard against one of our high priority clients, <EM4>attacking their ships and targeting the client's ~mission(Objects)</EM4>. It will be your job to keep everyone and everything safe – though it won't be an easy feat.\n\nI cannot stress enough how dangerous these attackers are, so be sure to <EM>bring backup</EM> to deal with them. If you, the crew, and the infrastructures make it out intact, we’re offering a generous sum of <EM4>~mission(ScripAmount)  MG Scrip</EM4> to the main contractor. \n\nBest of luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- 7CA 'Nargun'\n- 7MA 'Lorica'\n- 7SA 'Concord'\n- ArcticStorm\n- Attrition-4 Repeater\n- Attrition-5 Repeater\n- Attrition-6 Repeater\n- Aufeis\n- Avalanche\n- Berian\n- Blizzard\n- CF-117 Bulldog Repeater\n- CF-227 Badger Repeater\n- CF-337 Panther Repeater\n- CF-447 Rhino Repeater\n- CF-557 Galdereen Repeater\n- CF-667 Mammoth Repeater\n- Celestial\n- ColdSnap\n- DR Model-XJ1 Repeater\n- DR Model-XJ2 Repeater\n- DR Model-XJ3 Repeater\n- Draug\n- Elsen\n- FR-86\n- Fridan\n- Frost-Star\n- Frost-Star EX\n- Frost-Star SL\n- Frost-Star XL\n- FrostBurn\n- FullForce\n- FullForce Pro\n- Gelid\n- Glacier\n- Graupel\n- HAVEN\n- INK\n- IonBurst\n- IonSurge\n- IonSurge Pro\n- IonWave\n- Kragen\n- LightBlossom\n- MagnaBloom\n- NewDawn\n- PowerBolt\n- RPEL\n- Radiance\n- Radix\n- Sens\n- Tepilo\n- Tige\n- V60-26
Foxwell_DefendEntitesAndEscort_VH_Title,P=[BP] Red Lvl. Contract: Defend ~mission(Objects) and Escort Employees
Foxwell_DefendLocation_E_Desc_001=Ships coming and going from <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> are being targeted by hostile forces. The folks there have hired us to deal with this problem immediately.\n\nNeed someone to get there pronto and start fighting off these ships. The situation appears to be constantly evolving, so I’ll keep you updated on where you’re needed most. \n\nFor the hustle and effort, we’ll also be paying a bonus of <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor for dealing with this.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_DefendLocation_E_Title_001=[BP] Yellow Level Contract: Defend ~mission(DefendLocationWrapperLocation)
Foxwell_DefendLocation_H_Desc_001=The folks at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> are under attack and need our support. Their ships in the wider area are being targeted and there’s a growing concern that this is only a precursor to something bigger.  \n\nThe situation is evolving, but I’m being fed constant updates on what’s going on and will keep you informed as the contract progresses. \n\nAre you available to come to their aid? Would be smart to recruit some friends to help. These are important clients and we can’t afford to fail them. The main contractor will earn a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> if you get the job done.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_DefendLocation_H_Title_001=[BP] Orange Level Contract: Protect Our Client’s Interests
Foxwell_DefendLocation_M_Desc_001=We’ve got clients reporting outlaw attacks on ships around <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4>. They got locked down tight and anybody heading in or out is a target. Any attempts to solve the issue have just been met with more outlaw reinforcements appearing. \n\nThe client is desperate for a solution, so we’re hiring a contractor to go and restore peace in the area. If any other issues flare up once you're there, I’ll comm you directions on how to help.  \n\nReally need someone on this fast. So to sweeten the pot, the main contractor will also get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_DefendLocation_M_Title_001=[BP] Orange Level Contract: Ship Protection Needed
Foxwell_DefendLocation_S_Desc_001=Looking for a consummate professional to handle a high-stakes job. We’ve got VIP clients at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> who are facing extremely aggressive and motivated outlaws targeting ships around their location. Exact details on the attack are still rolling in, but it appears to be a wide ranging, multi-pronged operation. \n\nIf you’re available, I highly recommend that you bring additional combat support ships, plenty of supplies, and your A-game. Get this right, and we’ll reward the main contractor with a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_DefendLocation_S_Title_001=[BP] Red Level Contract: Support VIP Clients 
Foxwell_DefendLocation_VE_Desc_001=Outlaw ships are harassing anyone attempting to land or leave our client’s operations at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4>. Need someone to fly there to defend the site and protect our client’s ships before the situation gets out of control. Get there, get after those aggressors, and I'll keep you updated on the situation. \n\nHelp take care of this and we'll pass along a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_DefendLocation_VE_Title_001=[BP] Yellow Level Contract: Stand Up to Aggressors
Foxwell_DefendLocation_VH_Desc_001=Ship support is needed at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> immediately. Our client’s interests in the area are under fierce attack by outlaw forces. Looking for someone who can grab their gear, a few support ships they can trust, and deploy before it’s too late. Once you arrive, I’ll send any sitrep updates your way.  \n\nDon’t mess this up. These clients are paying for and expecting top tier protection. If anything goes wrong, we could lose this contract. That’s why we’ll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> if all goes down without a hitch.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Storm\n- Antium Core Storm\n- Antium Helmet Storm\n- Antium Legs Storm\n- Parallax "Shock Trooper" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_DefendLocation_VH_Title_001=[BP] Red Level Contract: Save Ships at ~mission(DefendLocationWrapperLocation)
Foxwell_EliminateAll_Allies_desc_001=Got word that outlaws are attempting to overrun <EM4>~mission(Location|Address)</EM4>. There’s local security forces there, but they’re struggling to stop that attack.\n\nNeed a contractor to hustle there and help take care of the aggressors. Bring plenty of gear, and be careful when engaging targets. Don’t want to hear about any security team members getting caught in your crossfire.    \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_EliminateAll_Allies_title_001=[BP] Help Protect Site
Foxwell_EliminateAll_NonHostiles_desc_001=We’ve been contracted to take care of a delicate situation. A gang has settled into <EM4>~mission(Location|Address)</EM4> that we need to get cleared out. Only issue is that there’s still some civilians there too. \n\nLooking for someone with the skills and good trigger sense to get rid of those outlaws without harming any innocent people. If that’s you, grab your gear and get over there. \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_EliminateAll_NonHostiles_title_001=[BP] Carefully Clear Site
Foxwell_EliminateAll_OLP_M_desc_001=We’ve been following a group of outlaws on behalf of a client, and it looks like they’ve taken a permanent pit stop on an old orbital platform. \n\nWe’re looking for a contractor who can head over to <EM4>~mission(Location|Address)</EM4> and neutralize the targets. The platform is crawling with a bunch of armed and dangerous thugs, so we’ve designated this a yellow level contract.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_EliminateAll_OLP_M_title_001=[BP] Yellow Level Contract: Merc Work
Foxwell_EliminateAll_PAF_M_desc_001=We’ve been tracking a group of outlaws who’ve been causing trouble for one of our clients. Seems they’ve taken up residence at an old Hathor facility. Don’t know what their plans with that old facility are but our client is eager to have them taken care of.\n\nLooking for someone to go to <EM4>~mission(Location|Address)</EM4> and neutralize these targets.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_EliminateAll_PAF_M_title_001=[BP] Yellow Level Contract: Clear Out PAF
Foxwell_EliminateAll_desc_001=Looking for someone willing to take out the trash at <EM4>~mission(Location|Address)</EM4>. Guess a gang has settled in without the permission of the owners. So they’ve hired us to get them out whatever way we see fit. \n\nI’d bring plenty of ammo, if I were you. Doubt they’ll want to leave willingly. \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_EliminateAll_title_001=[BP] Sweep and Clear Location
Foxwell_EliminateSpecific_NonHostiles_desc_001=Got a line on a bounty named <EM4>~mission(TargetName)</EM4>. Someone spotted them along with known criminal accomplices at <EM4>~mission(Location|Address)</EM4>. Need you to get there before they get going. \n\n<EM4>~mission(TargetName|Last)</EM4> has a reputation for only showing their face in places with civs. Really need you to take down this bounty without there being any civilian collateral damage. Foxwell can’t afford to be caught in the shitstorm that would erupt over the loss of innocent life. \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_EliminateSpecific_NonHostiles_title_001=[BP] Precision Strike on ~mission(TargetName)
Foxwell_EliminateSpecific_desc_001=Looking to execute a bounty on <EM4>~mission(TargetName)</EM4>. We’ve learned that they’re currently hiding out with some confederates at <EM4>~mission(Location|Address)</EM4>. \n\nI’d be prepared to deal with the lowlifes hanging around <EM4>~mission(TargetName|Last)</EM4>, but our only real concern is that you land the target. \n    \n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_EliminateSpecific_title_001=[BP] Track Down ~mission(TargetName)
Foxwell_HaulCargo_AToB_OLP_desc_01=Looking for a contractor with the right skills and ship for an important mission. Outlaws ambushed a Hull C carrying a <EM4>~mission(CargoGradeToken)</EM4> load of cargo and took it to <EM4>~mission(Location|Address)</EM4>. We’ve been hired to get it all back.  \n\nThe cargo is being stored somewhere at a defunct Hathor facility. The place is big and crawling with outlaws. Need someone to retrieve the goods from the freight elevator there and deliver it all back to the <EM4>freight elevator at ~mission(Destination|Address)</EM4>. Don’t think this will be a walk in the park. Bring lots of ammo and a ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>. \n\nIt also wouldn't hurt to bring a <EM4>handheld tractor beam</EM4> with you.   \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_HaulCargo_AToB_OLP_title_01=[BP] Red Level Contract: Retrieve Cargo Haul
Foxwell_HaulCargo_AToB_PAF_desc_01=A crew recently raided a distribution center and made off with <EM4>~mission(CargoGradeToken) load of cargo</EM4>. Foxwell has been hired to get all those goods back. We’re getting reports of these outlaws using old Hathor facilities as stash houses and we believe the stolen items are currently at <EM4>~mission(Location|Address)</EM4>.\n\nIf interested, you’ll need a ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>. Doubt you’ll be able to slip in and out of that PAF without being noticed either, so best be prepared to clear the location. Once safe, grab the goods from the freight elevator and deliver them to the <EM4>freight elevator at ~mission(Destination|Address)</EM4>. \n\nIt also wouldn't hurt to bring a <EM4>handheld tractor beam</EM4> with you.   \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_HaulCargo_AToB_PAF_title_01=[BP] Red Level Contract: Recoup Stolen Cargo Haul
Foxwell_HaulCargo_MultiToSingle_desc_01=Something weird is going on at the old Hathor mining facilities. Both the platform alignment facilities and orbital laser platforms have been abandoned and gathering dust for decades, but outlaws have started using them as a base of operations.\n\nWe’ve been hired by a concerned party who’s recently lost a lot of important cargo to one such gang. Currently, their stuff is stashed at <EM4>~mission(Location1|Address)</EM4> and <EM4>~mission(Location2|Address)</EM4>, but there’s a growing fear that the gang may be offloading their goods soon. That’s why we’ve been hired to hit both of those Hathor facilities, retrieve the cargo from the freight elevators, and bring it to the freight elevator at <EM4>~mission(Destination|Address)</EM4>. \n\nHere’s the specifics on what to grab from each location. Doesn’t matter in what order you do this, as long as it all gets collected and delivered. Just be sure to bring a ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.  It also wouldn't hurt to bring a <EM4>handheld tractor beam</EM4> with you.   \n\n~mission(MultiToSingleToken)\n\nFoxwell hasn’t been able to scout these locations, but if I were you, I’d expect to face some serious armed resistance. Best bring a bunch of gear and some friends.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_HaulCargo_MultiToSingle_title_01=[BP] Red Level Contract: Clear PAFs, Recover Cargo, and Deliver to OLP
Foxwell_Mercenary_Rehire_desc_001=Due to a corporate restructuring, Foxwell has some new vacancies that need to be filled immediately. Foxwell knows you’ve previously expressed interest in this line of work, and we’re wondering if you would want to take another crack at a contract.\n\nOne of our clients needs support at <EM4>~mission(Location|Address)</EM4> where their security forces are struggling to handle an outlaw incursion. Head there and help the local forces get rid of the problem before it’s too late. \n\nSuccessfully complete this contract, and Foxwell would be happy to send more work your way.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_Mercenary_Rehire_title_001=[BP] Still Looking for Work?
Foxwell_SecurityPatrol_E_Desc_001=Need someone to knock out a security patrol. You’ll need to go to the <EM4>location marker</EM4> on your HUD and then scan several designated waypoints ensuring that they’re safe and secure. \n\nSatellites in that region have been acting up recently. Not exactly sure what’s going on out there, but best be prepared in case there’s any trouble.\n\nComplete this contract and the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_SecurityPatrol_E_Title_001=[BP] Yellow Level Contract: Security Sweep
Foxwell_SecurityPatrol_H_Desc_001=Several unknown ships have been spotted in areas frequented by haulers delivering goods for our client. They’re worried these ships are monitoring their haulers in preparation for an ambush, so they’ve hired us to patrol the area. \n\nStart by going to the <EM4>location marker</EM4> on your HUD and scan it to ensure it’s clear. After that, we’ll send you to some other areas to scan for potential threats. We recommend that you bring a <EM4>wingman</EM4> and plenty of supplies to be ready to handle whatever might come your way.     \n\nAlso know that successfully completing this contract will earn the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_SecurityPatrol_H_Title_001=[BP] Orange Level Contract: Potential Security Threat
Foxwell_SecurityPatrol_M_Desc_001=A client is concerned about activity near some of their interests. We’ve been contracted to patrol the area and run scans at several locations. Interested? If so, head to the <EM4>location marker</EM4> on your HUD to start the patrol.\n\nThe client wasn’t specific about the threats, but they don’t think everything’s on the level out there. Hopefully we’ll be able to bring them some peace of mind.\n\nAdditionally, the client arranged for us to offer a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor.\n\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_SecurityPatrol_M_Title_001=[BP] Orange Level Contract: Security Patrol
Foxwell_SecurityPatrol_S_Desc_001=Need a battle-hardened pilot for an important patrol. A prominent client is fed up with outlaws targeting their ships and satellites. We’ve been hired to scan the areas in question and deal with any hostile forces. The patrol begins at the <EM4>location marker</EM4> on your HUD before moving to a number of other locations we’ll expect you to clear.\n\nNot sure what you’ll run into out there, but based on intel shared by the client, they’re frequently seeing fighter groups of five to seven ships roaming the region. Some even have larger ships leading the charge. That means you better be ready for a serious fight. If you can, try to recruit at least <EM4>three friends</EM4> to the cause. Even a seasoned pilot will need all the help they can get against this crew.   \n\nSince this is going to be a tough one, the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> at the end of the patrol.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_SecurityPatrol_S_Title_001=[BP] Red Level Contract: Secure Threatened Space
Foxwell_SecurityPatrol_VE_Desc_001=Time to knock out a routine patrol for one of our long-term clients. The route is a series of waypoints that need to be visited and scanned to confirm everything’s as expected. Should be simple enough.  \n\nIf interested, please accept and head to the <EM4>location marker</EM4> on your HUD to start. Pull this off and the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_SecurityPatrol_VE_Title_001=[BP] Yellow Level Contract: Routine Patrol
Foxwell_SecurityPatrol_VH_Desc_001=A client needs our help. Outlaws are roaming certain sectors where they do business and attacking anyone they come across. Our client has already lost several ships and can’t afford to lose anymore. \n\nWe need someone to patrol those areas and draw out any hostile forces. The job begins with you heading to the <EM4>location marker</EM4> on your HUD and scanning. Then we’ll share a handful of other patrol points for you to scan. \n\nFrom the sound of it, these packs of ships feature skilled and aggressive pilots. Best be ready to rumble if you run into any of them. Would be good to have at least <EM4>two trusted pilots</EM4> by your side for this one.\n\nAt the end of a successful patrol, the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\nStay chilly,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Sand\n- Antium Core Sand\n- Antium Helmet Sand\n- Antium Legs Sand\n- Parallax "Sanguine" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_SecurityPatrol_VH_Title_001=[BP] Red Level Contract: High-Risk Security Patrol
Foxwell_ShipAmbush_E_desc_001=An outlaw who’s been on the run finally returned to the system. Seems like they hoped that disappearing for a bit would make us forget about them. They’re not even trying to hide their identity or vary their routine which means we know exactly where they’re going to be.\n\nLatest intel indicates that they’re flying a <EM4>~mission(AmbushTarget)</EM4> and will be passing by <EM4>~mission(Location|Address)</EM4> soon. I’ve already scoped out an emission cloud that’s a perfect place for you to find cover, power down your ship, and wait. Only real variable is if they’ll be alone or not. We’ve heard they sometimes roll with friends that all fly single-seaters. Landing that first surprise strike will be important as this crew is battle-tested, but we’ll have reinforcements at the ready to provide support if you need them.\n\nGet this done and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_ShipAmbush_E_title_001=[BP] Yellow Level Contract: Surprise Strike
Foxwell_ShipAmbush_H_desc_001=Recently, a <EM4>~mission(AmbushTarget)</EM4> baited Foxwell forces with a bogus rescue beacon. By the time our forces realized what was happening, a squad of ships unleashed a devastating attack and only one Foxwell contractor survived. Their scan logs identified the bait ship, and we’ve had scouts monitoring them ever since.\n\nOur surveillance has revealed the squad has a regular flight pattern that we think we can exploit. There’s a sizable emission cloud at <EM4>~mission(Location|Address)</EM4> that makes it an ideal spot to post up. Think you have what it takes to handle this for us? \n\nIt’ll be you against the <EM4>~mission(AmbushTarget)</EM4>, other large craft, and a sizable escort. Wish I could be more specific than that but this crew regularly rotates ships in and out of the squad. Would be smart to bring some support, so you don’t get overwhelmed by their numbers.   \n\nComplete the job and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_ShipAmbush_H_title_001=[BP] Orange Level Contract: Return the Favor
Foxwell_ShipAmbush_M_desc_001=Foxwell has been tracking a <EM4>~mission(AmbushTarget)</EM4> used by outlaws and discovered a pattern to its movements. The ship should be passing by <EM4>~mission(Location|Address)</EM4> soon.\n\nLooking for a contractor willing to hustle there, hide in the emission cloud, and then spring the trap when the time is right. There’s usually escort ships with the <EM4>~mission(AmbushTarget)</EM4>. Careful not to jump the gun and blow your cover. The element of surprise is crucial from what I’ve read.\n\nPull this off and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_ShipAmbush_M_title_001=[BP] Orange Level Contract: Spring a Trap
Foxwell_ShipAmbush_S_desc_001=We’ve received a handful of comms about recent attacks undertaken by an <EM4>~mission(AmbushTarget)</EM4> and its escort ships. After opening a file, we started tracking the ship’s movements and noticed that it frequently passes an emission cloud near <EM4>~mission(Location|Address)</EM4>. We want to use that to our advantage to launch a surprise attack. \n\nOnce on site, you should hide in the emission cloud to cloak your signature enough to allow you to make the first strike. Unfortunately, Foxwell can’t provide additional reinforcements for this operation, so you’ll be responsible for bringing any support forces. You might need the help too. The crew of the ~mission(AmbushTarget) is aggressive and battle hardened.        \n\nYou get this taken care of for us and there's a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> in it for the main contractor.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_ShipAmbush_S_title_001=[BP] Red Level Contract: Surprise Attack
Foxwell_ShipAmbush_VE_desc_001=Care to help us ghost a bad guy? \n\nWe’ve been hired to hunt down an outlaw flying a <EM4>~mission(AmbushTarget)</EM4>. Shouldn’t be too hard since they take the same flightpath each day. That makes them a prime target for an ambush if I ever saw one. I’ve analyzed the route and determined that <EM4>~mission(Location|Address)</EM4> is the ideal spot to strike. There’s an emission cloud there that’ll be perfect to hide your ship’s signature while you wait.   \n\nJob is simple if you’re interested. Head to the location, hide out, power down, and then wait for them to fly by. Sometimes they roll alone but they often have other single-seat ships with them. Shouldn’t be too hard to handle for a pro. Plus, we’ll still have reinforcements nearby and ready to deploy once it pops off.\n\nPull this off and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_ShipAmbush_VE_title_001=[BP] Yellow Level Contract: Ambush An Amateur
Foxwell_ShipAmbush_VH_desc_001=Foxwell got word from an important client that outlaws have put together a squad that’s been stalking the system with sub-capital ships and escort fighters. Our client is concerned that if left unchecked, outlaws will create more of these attack squads and destabilize system security. We’ve been hired to wipe out this group before that happens. \n\nWe need a confident and skilled contractor for this task. Good news is that we have a plan in place. One of the ships used by this squad, a <EM4>~mission(AmbushTarget)</EM4>, was stolen from our client, who’s still able to track its movements. They’ve shared the location data with us and we’ve discovered that this squad often goes by <EM4>~mission(Location|Address)</EM4>. We’ve scouted the location and discovered a large emission cloud makes an ideal spot for an ambush.  \n\nNot going to lie, this isn’t going to be easy. We don’t have any additional forces available to deploy, so it would be good to bring your own support. \n\nYou manage to pull this off, I've arranged for a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> for the main contractor.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Jet\n- Antium Core Jet\n- Antium Helmet Jet\n- Antium Legs Jet\n- Parallax "Sunstone" Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_ShipAmbush_VH_title_001=[BP] Red Level Contract: Ambush Attack Squad
Foxwell_ShipWaveAttack_ClearHostiles_Desc_E_001=Okay, this might be a bit of stretch to do on your own, so if you got any favors to call in, it could be good to cash those chits now. There's a group of desperados striking delivery ships up and down this sector and we've been tasked with cleaning them up. \n\nOnce your crew is ready, head over to ~mission(Location|Address) and take the hostiles there down. Now, these bastards are a bit clever so they tend to split up into smaller packs. Make sure you wait around to clear every last one of them out.\n \nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives."\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms\n- Antium Core\n- Antium Helmet\n- Antium Legs\n- Parallax Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_ShipWaveAttack_ClearHostiles_Desc_H_001=It seems that a couple of different small-time gangs have decided to pool their resources and start doing coordinated attacks. Alone, they weren't much, but all together they're proving to be a serious threat that has to be dealt with.\n\nRecruit some backup you can rely on and the fly over to ~mission(Location|Address). Once you attack the initial gang members you find there, the other groups will arrive to support them. Make sure you wait around to take out all of them.\n \nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms\n- Antium Core\n- Antium Helmet\n- Antium Legs\n- Parallax Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_ShipWaveAttack_ClearHostiles_Desc_M_001=A splinter group of outlaws have broken off from one of the main gangs in the system and have been trying to strike out on their own. With the amount of trouble they've been causing its clear they're looking to establish a name for themselves as quickly as they can. It's going to be up to you and your support crew to put a stop to them.\n\nOnce your crew is ready, head over to ~mission(Location|Address) and engage with the gang. Not all of them will just be waiting there on site. Expect reinforcements to arrive once you begin your assault. Just be sure to stay until every last one of them has been take care of.\n \nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives."\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms\n- Antium Core\n- Antium Helmet\n- Antium Legs\n- Parallax Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_ShipWaveAttack_ClearHostiles_Desc_VE_001=There's a small group of criminals that have been marking their territory, striking out any freighters that get close enough. They got a little too greedy though, because now someone's paying us to go deal with them.\n\nOnce you and whoever you're bringing are ready, go to ~mission(Location|Address) and engage with these criminals. Since they like to fly in separate packs, be sure you wait around to clear every last one of them out.\n \nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms\n- Antium Core\n- Antium Helmet\n- Antium Legs\n- Parallax Energy Assault Rifle\n- Parallax Rifle Battery (80 Cap)
Foxwell_ShipWaveAttack_ClearHostiles_Title_E_001=[BP] Yellow Level Contract: Neutralize Shipjacking Gang
Foxwell_ShipWaveAttack_ClearHostiles_Title_H_001=[BP] Orange Level Contract: Take Out Criminal Fleet
Foxwell_ShipWaveAttack_ClearHostiles_Title_M_001=[BP] Orange Level Contract: Destroy Outlaw Threat
Foxwell_ShipWaveAttack_ClearHostiles_Title_VE_001=[BP] Yellow Level Contract: Clear Shipjacking Group
Foxwell_bombingrun_E_desc_001,P=We've just received the location of an outlaw outpost where some up-and-coming criminals have been hanging out. Now, our client says there's no reason to engage these folks directly. Instead you will be targeting their supply lines.\n\nFly on over to <EM4>~mission(Location|Address)</EM4> and take out their fuel stores while dealing with any minimal resistance they may put up. It will be your call on how much you engage with the hostile forces, just don't forget that your main objective is ensuring those fuel tanks are out of action.\n\nThis is a yellow level contract so pay will be proportionate.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_bombingrun_E_title_001=[BP] Yellow Level Contract: Disrupt Operations
Foxwell_bombingrun_H_desc_001,P=An opportunity has presented itself for a client to take action against a group of criminals who have been harassing their business.\n\nAccording to reports, this group of outlaws are currently laying low at <EM4>~mission(Location|Address)</EM4>. The client thinks this is a good time to catch them off guard and bring them to justice. The job is to take out their fuel tanks and putting an end to their smuggling operations once and for all.\n\nThese folks are not to be underestimated. You better bring some backup and fly low to avoid the turrets. Priority as always is the fuel tanks.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_bombingrun_H_title_001=[BP] Orange Level Contract: Destroy Outlaw Infrastructure
Foxwell_bombingrun_M_desc_001,P=We're in need of a sharp contractor for a hit and run operation. Client says some local thugs have been congregating in concerning numbers and we have been tasked with disrupting their base of operations.\n\nGet on over to <EM4>~mission(Location|Address)</EM4> and take out their fuel tanks. If you're successful we can set these folks plans back a while, and most importantly, without having to deal with them directly.\n\nReports are showing there's a couple of ships buzzing around the area and some defense turrets. Just focus on the fuel tanks and you should be alright.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_bombingrun_M_title_001=[BP] Orange Level Contract: Take Out Fuel Supplies
Foxwell_bombingrun_S_desc_001,P=We are looking for a highly competent mercenary team to assist with a challenging demolition for a VIP client.\n\nThe outlaws operating at <EM4>~mission(Location|Address)</EM4> has been identified as a threat of growing concern in the area and to help deal with this situation your team is being tasked with taking out the fuel tanks at the location. \n\nHowever, it won't be as easy as just slipping in and out - expect to deal with multiple hostiles and turrets that will be expecting you. The stronger your crew the better your chances at completing this operation successfully.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_bombingrun_S_title_001=[BP] Red Level Contract: Destroy Outlaw Infrastructure
Foxwell_bombingrun_VE_desc_001,P=A bunch of outlaws have been harassing our client and recently things have taken a turn for the worse. They've taken over their property and we've exhausted all other options.\n\nWe need a decent pilot to head to <EM4>~mission(Location|Address)</EM4> and take out their fuel tanks. If you can cut off their supplies, you can pave the way for the client to take back their property.\n\nThis shouldn't be a tough one. You might run into a ship or two and maybe a few turrets, but you've been authorized to use lethal force. All we need for you to do is get in there, get the fuel tanks, and get out.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_bombingrun_VE_title_001=[BP] Yellow Level Contract: Limiting Potential Threat
Foxwell_bombingrun_VH_desc_001,P=Foxwell have been hired by a client to take part in a multi-stage operation on a known outlaw base at <EM4>~mission(Location|Address)</EM4> and need a strong pilot to play their part in this.\n\nYou, and whatever additional support ships you arrange, will be tasked with taking out the fuel tanks located there to set the stage for the rest of the operation to follow. \n\nUnfortunately, this place is swarming with ships and anti-air turrets. So make sure you and your people are ready, and remember, the fuel tanks are your priority. No need to be a hero.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n\nBlueprints this contract can award (as of 4.10.1):\n- Antium Arms Maroon\n- Antium Arms Moss Camo\n- Antium Core Maroon\n- Antium Core Moss Camo\n- Antium Helmet Maroon\n- Antium Helmet Moss Camo\n- Antium Legs Maroon\n- Antium Legs Moss Camo
Foxwell_bombingrun_VH_title_001=[BP] Red Level Contract: Fuel Container Demolition
HeadHunters_DefendEntitesAndEscort_E_Desc=I was having a shite day, and it just got worse. Our interests over at <EM4>~mission(Location|Address)</EM4> comm'd to let me know that their  <EM>~mission(Objects)</EM4> are under attack by these no-name hoods looking to stake a claim.\n\nYou're gonna go there for me and protect the place, including any <EM4>friendly ships</EM4> unfortunate enough to be caught in the crossfire. Don't think putting these wannabees in their place will be too tricky for someone like you. \n\nAlso, I’ll sweeten the pot by giving the main contractor <EM4>~mission(ScripAmount) Council Scrip</EM4> just to show my appreciation. \n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 5CA 'Akura'\n- 5MA 'Chimalli'\n- 5SA 'Rhada'\n- 6CA 'Bila'\n- 6MA 'Kozane'\n- 6SA 'Arbiter'\n- ARMOR\n- BLOC\n- BlastChill\n- ColdSurge\n- Cryo-Star\n- Cryo-Star EX\n- Cryo-Star SL\n- Cryo-Star XL\n- DuraJet\n- Endo\n- FlashFreeze\n- FrostBite\n- FullFrost\n- GUARD\n- HEX\n- Kelvid\n- Lotus\n- PIN\n- STOP\n- SparkJet\n- SparkJet Pro\n- Taiga\n- TigerLilly\n- WEB\n- WhiteOut\n- WhiteRose\n- Winter-Star\n- Winter-Star EX\n- Winter-Star SL\n- Winter-Star XL\n- ZapJet
HeadHunters_DefendEntitesAndEscort_E_Title=[BP] Provide Protection at ~mission(Location)
HeadHunters_DefendEntitesAndEscort_H_Desc=There's this small gang that continues to be a thorn in our side, and the bastards have just ambushed some friends over at <EM4>~mission(Location|Address)</EM4>. Seems like they're doing their best to destroy the <EM4>~mission(Objects)</EM4> there.\n\nI need you and whatever <EM4>crew you can muster</EM4> on site stopping these mungers from blowing everything up and protecting any <EM4>friendly ships</EM4> that need a hand.\n\nHandle this right and I’ll give the main contractor  <EM4>~mission(ScripAmount) Council Scrip</EM4>.\n\n- Stows\n\nBlueprints this contract can award (as of 4.10.1):\n- 5CA 'Akura'\n- 5MA 'Chimalli'\n- 5SA 'Rhada'\n- 6CA 'Bila'\n- 6MA 'Kozane'\n- 6SA 'Arbiter'\n- AD4B Ballistic Gatling\n- AD5B Ballistic Gatling\n- AD6B Ballistic Gatling\n- ARMOR\n- BLOC\n- BlastChill\n- ColdSurge\n- Cryo-Star\n- Cryo-Star EX\n- Cryo-Star SL\n- Cryo-Star XL\n- Devoue\n- DuraJet\n- Endo\n- FlashFreeze\n- FrostBite\n- FullFrost\n- GUARD\n- HEX\n- Kelvid\n- Lotus\n- Mantis GT-220 Gatling\n- PIN\n- STOP\n- SW16BR1 “Buzzsaw” Repeater\n- SW16BR2 “Sawbuck” Repeater\n- SW16BR3 “Shredder” Repeater\n- Scorpion GT-215 Gatling\n- SparkJet\n- SparkJet Pro\n- Taiga\n- Tarantula GT-870 Mark 1 Cannon\n- Tarantula GT-870 Mark 2 Cannon\n- Tarantula GT-870 Mark 3 Cannon\n- Tige\n- TigerLilly\n- V801-11\n- V801-12\n- V880\n- Vigilance\n- WEB\n- WhiteOut\n- WhiteRose\n- Winter-Star\n- Winter-Star EX\n- Winter-Star SL\n- Winter-Star XL\n- YellowJacket GT-210 Gatling\n- ZapJet
HeadHunters_DefendEntitesAndEscort_H_Title=[BP] Stop Rival Attack at ~mission(Location)
HeadHunters_DefendEntitesAndEscort_M_Desc=A new gang who is proving to be a real pain in the ass for the Headhunters just upped the stakes by attacking the <EM4>~mission(Objects)</EM4> at <EM4>~mission(Location|Address)</EM4>. Never a good thing since we got interest in the welfare of the folks there, but doubly so because if they do too much damage it might royally screw an upcoming operation.\n\nHead over there as soon as you're able and stop the attack before they can do any lasting damage. And if any <EM4>friendly ships</EM4> need a hand, I want you to look out for them too. Don't expect this gang to be pushovers but you should still be able to deal with them if you keep your head on.\n \nIf you need any extra motivation, I’m adding <EM4>~mission(ScripAmount) Council Scrip</EM4> for the main contractor.\n\n- Stows\n\nBlueprints this contract can award (as of 4.10.1):\n- 5CA 'Akura'\n- 5MA 'Chimalli'\n- 5SA 'Rhada'\n- 6CA 'Bila'\n- 6MA 'Kozane'\n- 6SA 'Arbiter'\n- ARMOR\n- BLOC\n- BlastChill\n- ColdSurge\n- Cryo-Star\n- Cryo-Star EX\n- Cryo-Star SL\n- Cryo-Star XL\n- DuraJet\n- Endo\n- FlashFreeze\n- FrostBite\n- FullFrost\n- GUARD\n- HEX\n- Kelvid\n- Lotus\n- PIN\n- STOP\n- SparkJet\n- SparkJet Pro\n- Taiga\n- TigerLilly\n- WEB\n- WhiteOut\n- WhiteRose\n- Winter-Star\n- Winter-Star EX\n- Winter-Star SL\n- Winter-Star XL\n- ZapJet
HeadHunters_DefendEntitesAndEscort_M_Title=[BP] Secure ~mission(Location) from Upstarts
HeadHunters_DefendEntitesAndEscort_S_Desc=The maintenance and reliable function of <EM4>~mission(Location|Address)</EM4> is pretty darn important to the Headhunters, but this rival crew seems determined knock it out of contention. They're on site now, targeting <EM4>~mission(Objects)</EM4> there. \n\nProtecting the site, and any <EM4>friendly ships</EM4>, in the area is important enough that I want you to bring some <EM4>reliable backup along</EM4> when you go and terminate these nullbrains. \n\nTo prove just how serious we are about getting this done right, the main contractor will earn <EM4>~mission(ScripAmount) Council Scrip</EM4> for making sure absolutely nothing goes wrong.\n\n- Stow\n\nBlueprints this contract can award (as of 4.10.1):\n- 5CA 'Akura'\n- 5MA 'Chimalli'\n- 5SA 'Rhada'\n- 6CA 'Bila'\n- 6MA 'Kozane'\n- 6SA 'Arbiter'\n- AD4B Ballistic Gatling\n- AD5B Ballistic Gatling\n- AD6B Ballistic Gatling\n- ARMOR\n- BLOC\n- BlastChill\n- ColdSurge\n- Cryo-Star\n- Cryo-Star EX\n- Cryo-Star SL\n- Cryo-Star XL\n- Devoue\n- DuraJet\n- Endo\n- FlashFreeze\n- FrostBite\n- FullFrost\n- GUARD\n- HEX\n- Kelvid\n- Lotus\n- Mantis GT-220 Gatling\n- PIN\n- STOP\n- SW16BR1 “Buzzsaw” Repeater\n- SW16BR2 “Sawbuck” Repeater\n- SW16BR3 “Shredder” Repeater\n- Scorpion GT-215 Gatling\n- SparkJet\n- SparkJet Pro\n- Taiga\n- Tarantula GT-870 Mark 1 Cannon\n- Tarantula GT-870 Mark 2 Cannon\n- Tarantula GT-870 Mark 3 Cannon\n- Tige\n- TigerLilly\n- V801-11\n- V801-12\n- V880\n- Vigilance\n- WEB\n- WhiteOut\n- WhiteRose\n- Winter-Star\n- Winter-Star EX\n- Winter-Star SL\n- Winter-Star XL\n- YellowJacket GT-210 Gatling\n- ZapJet
HeadHunters_DefendEntitesAndEscort_S_Title=[BP] Guard ~mission(Location) From Rivals
HeadHunters_DefendEntitesAndEscort_VE_Desc=I won't bore you with the nitty gritty, but trust me when I say that <EM4>~mission(Location|Address)</EM4> is important to the Headhunters. So imagine how pissed I am to learn that they're being harassed by some aggressive upstarts who are hellbent on taking out their <EM>~mission(Objects)</EM4>. It won't stand.   \n\nGet there and provide some protection before everything gets destroyed, including <EM4>any friendly ships</EM4> in the area. Nullbrains like these hopefully won't pose too much of a challenge to a rising star like yourself.\n\nClear ‘em all out I’ll throw <EM4>~mission(ScripAmount) Council Scrip</EM4> to whoever accepted this gig.\n\n- Stows\n\nBlueprints this contract can award (as of 4.10.1):\n- 5CA 'Akura'\n- 5MA 'Chimalli'\n- 5SA 'Rhada'\n- 6CA 'Bila'\n- 6MA 'Kozane'\n- 6SA 'Arbiter'\n- ARMOR\n- BLOC\n- BlastChill\n- ColdSurge\n- Cryo-Star\n- Cryo-Star EX\n- Cryo-Star SL\n- Cryo-Star XL\n- DuraJet\n- Endo\n- FlashFreeze\n- FrostBite\n- FullFrost\n- GUARD\n- HEX\n- Kelvid\n- Lotus\n- PIN\n- STOP\n- SparkJet\n- SparkJet Pro\n- Taiga\n- TigerLilly\n- WEB\n- WhiteOut\n- WhiteRose\n- Winter-Star\n- Winter-Star EX\n- Winter-Star SL\n- Winter-Star XL\n- ZapJet
HeadHunters_DefendEntitesAndEscort_VE_Title=[BP] Keep ~mission(Location) Safe
HeadHunters_DefendEntitesAndEscort_VH_Desc=So, I thought we had done a good job of keeping things on the quiet side, but looks like the fact <EM4>~mission(Location|Address)</EM4> has Headhunters ties has gotten out. Now there are some heavy operators causing major problems there, targeting the <EM>~mission(Objects)</EM4> and generally causing me a massive headache.\n\nWith the amount of firepower these interlopers are packing, you're gonna need to bring along a <EM4>crew of your own</EM4> to pull this off. Especially since I need you to be protecting any <EM4>friendly ships</EM4> that need help.\n\nThis op needs to go off without a hitch, so I’m offering the main contractor <EM4>~mission(ScripAmount) Council Scrip</EM4> for a job well done. \n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- 5CA 'Akura'\n- 5MA 'Chimalli'\n- 5SA 'Rhada'\n- 6CA 'Bila'\n- 6MA 'Kozane'\n- 6SA 'Arbiter'\n- AD4B Ballistic Gatling\n- AD5B Ballistic Gatling\n- AD6B Ballistic Gatling\n- ARMOR\n- BLOC\n- BlastChill\n- ColdSurge\n- Cryo-Star\n- Cryo-Star EX\n- Cryo-Star SL\n- Cryo-Star XL\n- Devoue\n- DuraJet\n- Endo\n- FlashFreeze\n- FrostBite\n- FullFrost\n- GUARD\n- HEX\n- Kelvid\n- Lotus\n- Mantis GT-220 Gatling\n- PIN\n- STOP\n- SW16BR1 “Buzzsaw” Repeater\n- SW16BR2 “Sawbuck” Repeater\n- SW16BR3 “Shredder” Repeater\n- Scorpion GT-215 Gatling\n- SparkJet\n- SparkJet Pro\n- Taiga\n- Tarantula GT-870 Mark 1 Cannon\n- Tarantula GT-870 Mark 2 Cannon\n- Tarantula GT-870 Mark 3 Cannon\n- Tige\n- TigerLilly\n- V801-11\n- V801-12\n- V880\n- Vigilance\n- WEB\n- WhiteOut\n- WhiteRose\n- Winter-Star\n- Winter-Star EX\n- Winter-Star SL\n- Winter-Star XL\n- YellowJacket GT-210 Gatling\n- ZapJet
HeadHunters_DefendEntitesAndEscort_VH_Title=[BP] Defend ~mission(Location) From Mercs
Headhunters_defend_XT_VH_desc_001=XenoThreat are on the warpath right now. They’ve launched simultaneous attacks on several Headhunters sites and stretched our fighters thin. Got word they’re planning to storm ~mission(Location|Address) next, and we can’t get anyone there to defend it. \n\nI’m looking to pay someone to pull together a crew, gather supplies, and mount a strong defense for us. Gonna be honest with you, this is shaping up to be a hell of a fight. Xenos are sending some of their most experienced forces there. Not much else I can say except that they’ll probably stagger the arrival of their forces, wipe them all out and you’ll be paid handsomely. \n\nThink you can rise to the occasion?  \n\n-Stows\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
Headhunters_defend_XT_VH_title_001=[BP] Block XenoThreat Expansion
Headhunters_eliminateall_caves_desc_01=Hey,\n\nSome two-bit thugs are holed up in ~mission(Location|Address). Wouldn’t pay them any mind, except the arrogant skags tried to hit an outpost under our protection.\n\nWe chased 'em off with little trouble, but we can't let that kind of disrespect go unpunished. Our Clips are busy with some bigger fish, so we'd like you to take care of this for us. \n\nStows out.\n\nBlueprints this contract can award (as of 4.10.1):\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical
Headhunters_eliminateall_caves_title_01=[BP] A Swift Reprisal
Highpoint_KillAnimals_rockcracker_desc_E_001=If you have any work that's going to be bringing you to one of those old QV Breaker Stations in the Keeger Belt, we have something else that we could use your help on while you're there.\n \nWe've recently been contacted by the People's Alliance to assist with an initiative to help prepare these abandoned stations for repairs. Unfortunately, a Valakkar infestation is creating serious problems for not only the stations' infrastructure, but also for the chances of them being brought back online one day. Due to Valakkar's status as an invasive species, we have decided that culling them is the only viable option.\n \nReduce the Valakkar numbers at any of the old QV Breaker Stations and we will offer you payment.\n \nBest,\n \nWanda Werkheiser\n\nContract Manager\n\nHighpoint Wilderness Specialists\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
Highpoint_KillAnimals_rockcracker_title_E_001=[BP] Reduce Valakkar Breaker Station Population
Hockrow_FacilityDelve_P2M1_Repeat_desc=Hockrow Agency \nCase File #JD10285\nLead Investigator: Arken Mallor\n\nCase Update: \nIt would be helpful to have the most recent energy anomaly data so that we can compare it to what you delivered last time. Any difference between the two data sets could prove useful.\n\nContract Investigator Actions:\nExplore the <EM4>Engineering</EM4> wing and <EM4>retrieve the Energy Anomaly data</EM4> and deliver it to <EM4>~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nBe wary of possible hostile forces on site. \n\nTravel to Onyx in a vehicle that can be stored in a large hangar.\n\nOnce you hand off this data, I'll send you a <EM4>ASD Secure Drive</EM4> that you can collect at your home location.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Corbel Arms Mire\n- Corbel Arms Smolder\n- Corbel Core Mire\n- Corbel Core Smolder\n- Corbel Helmet Mire\n- Corbel Helmet Smolder\n- Corbel Legs Mire\n- Corbel Legs Smolder\n- Fresnel "Icebox" Energy LMG\n- Fresnel Energy LMG\n- Fresnel Energy LMG Battery (165 Cap)\n- Geist Armor Arms Forest\n- Geist Armor Arms Rogue\n- Geist Armor Arms Whiteout\n- Geist Armor Core Forest\n- Geist Armor Core Rogue\n- Geist Armor Core Whiteout\n- Geist Armor Helmet Forest\n- Geist Armor Helmet Rogue\n- Geist Armor Helmet Whiteout\n- Geist Armor Legs Forest\n- Geist Armor Legs Rogue\n- Geist Armor Legs Whiteout\n- Novikov Backpack Mire\n- Novikov Backpack Smolder\n- Zenith Laser Sniper Rifle
Hockrow_FacilityDelve_P2M1_Repeat_title=[BP] Jorrit Dossier: Updated Energy Anomaly Data
Hockrow_FacilityDelve_P2M2_Repeat_desc=Hockrow Agency \nCase File #JD10285\nLead Investigator: Arken Mallor\n\nCase Update: \nOut of an over-abundance of caution, it would be good to see if the security systems have picked up anything new since the last batch of data you delivered. That way we can make sure we’re up-to-date on what’s been happening down there.\n\nContract Investigator Actions:\nExplore the <EM4>Research</EM4> wing and <EM4>retrieve the Security data</EM4> and deliver it to <EM4>~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nBe wary of possible hostile forces on site. \n\nTravel to Onyx in a vehicle that can be stored in a large hangar.\n\nOnce you hand off this data, I'll send you a <EM4>ASD Secure Drive</EM4> that you can collect at your home location.\n\nBlueprints this contract can award (as of 4.10.1):\n- Corbel Arms Patina\n- Corbel Core Patina\n- Corbel Helmet Patina\n- Corbel Legs Patina\n- Fresnel "Rockfall" Energy LMG\n- Fresnel Energy LMG Battery (165 Cap)\n- Geist Armor Arms\n- Geist Armor Core\n- Geist Armor Helmet\n- Geist Armor Legs\n- Novikov Backpack Patina\n- Zenith "Landslide" Laser Sniper Rifle
Hockrow_FacilityDelve_P2M2_Repeat_title=[BP] Jorrit Dossier: Updated Security Data
Hockrow_FacilityDelve_P2M3_Repeat_desc=Hockrow Agency \nCase File #JD10285\nLead Investigator: Arken Mallor\n\nCase Update: \nOne of the biggest issue when it comes to ongoing investigations is intel growing stale. To help alleviate that, I’m going to have you head back into Onyx and grab the latest seismic sensor data. Would be good to see what the latest readings say.\n\nContract Investigator Actions:\nExplore the <EM4>Research</EM4> wing and <EM4>retrieve the Seismic data</EM4> and deliver it to <EM4>~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nBe wary of possible hostile forces on site.\n \nTravel to Onyx in a vehicle that can be stored in a large hangar.\n\nOnce you hand off this data, I'll send you a <EM4>ASD Secure Drive</EM4> that you can collect at your home location.\n\nBlueprints this contract can award (as of 4.10.1):\n- Corbel Arms Halcyon\n- Corbel Core Halcyon\n- Corbel Helmet Halcyon\n- Corbel Legs Halcyon\n- Geist Armor Arms Desert\n- Geist Armor Arms Whiteout\n- Geist Armor Core Desert\n- Geist Armor Core Whiteout\n- Geist Armor Helmet Desert\n- Geist Armor Helmet Whiteout\n- Geist Armor Legs Desert\n- Geist Armor Legs Whiteout\n- Novikov Backpack Halcyon\n- Zenith "Thunderstrike" Laser Sniper Rifle\n- Zenith Laser Sniper Rifle Battery (22 Cap)
Hockrow_FacilityDelve_P2M3_Repeat_title=[BP] Jorrit Dossier: Updated Seismic Data
Hockrow_FacilityDelve_P2M4_Repeat_title=[BP] Jorrit Dossier: Updated Power Usage Data
Hockrow_FacilityDelve_P3M1_desc,P=Hockrow Agency \nCase File #JD10285\nLead Investigator: Arken Mallor\n\nCase Update: \nAll your digging around Onyx has paid off. I’ve been able to confirm that Jorrit has been operating an off-the-record lab in the facility’s Site-B in order to conduct an experiment he calls “Project Hyperion.” I’ll send his <EM4>lab notes to your mobiGlas journal</EM4> once you’re underway, but the long and short of it is the bastard is trying to make Humans evolve or some nonsense like that.\n\nThe client wants the experimental data, so you’re going back to Onyx and do everything needed to get Project Hyperion up and running. \n\nContract Investigator Actions:\nPrep the experiment by collecting a <EM4>Reagent code from the Engineering wing</EM4> and a <EM4>Catalyst code from the Research wing</EM4>.\n\nOnce you have those, head down to the <EM4>Lab in Site-B</EM4> and <EM4>run the experiment</EM4> so you can <EM4>upload the results</EM4>.\n\nAdditional Notes:\nSince this is an active lab, there might be ASD security on-site.\n \nTravel to Onyx in a vehicle that can be stored in a large hangar.\n\n\nBlueprints (only some versions of this contract award these, as of 4.10.1):\n- Bolide\n- DynaFlux\n- Fresnel "Molten" Energy LMG\n- Fulgur\n- Geist Armor Arms ASD Edition\n- Geist Armor Core ASD Edition\n- Geist Armor Helmet ASD Edition\n- Geist Armor Legs ASD Edition\n- Zenith "Darkwave" Laser Sniper Rifle\n- Zenith Laser Sniper Rifle Battery (22 Cap)
Hockrow_FacilityDelve_P3M1_title,P=[BP]* Jorrit Dossier: Project Hyperion
InterSec_KillShip_Vanduul_Desc_Super_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Vanduul\nEquipment Specs: Combat-rated Ship\nBriefing: InterSec requires the services of a skilled pilot who’s prepared to assist in taking down a dangerous Vanduul target that has been involved in numerous attacks.\n\nVanduul incursions have been on the rise recently, posing not only a threat to the system of Nyx, but the UEE as a whole. It is imperative that these sightings are responded to in a swift and efficient manner. \n\nWe require you to fly to the last known sighting of the Vanduul ship at <EM4>~mission(Location|Address)</EM4> and eliminate them immediately.  \n\nVanduul pilots are highly skilled and extremely dangerous. Engage the enemy immediately and do not hesitate – they will not show the same mercy.\n\nCompensation proportionate to the risk of the contract will be awarded.\n\n\nRespectfully,\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- Monde Arms\n- Monde Arms Hiro\n- Monde Core\n- Monde Core Hiro\n- Monde Helmet\n- Monde Helmet Hiro\n- Monde Legs\n- Monde Legs Hiro\n- R97 Shotgun\n- R97 Shotgun Magazine (18 cap)
InterSec_KillShip_Vanduul_Title_Super_001=[BP] Eliminate Vanduul Ship
InterSec_ResourceGathering_Cryopods_Desc=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws present and armed\nEquipment Specs: <EM4>Cargo Capable Ship</EM4>, Personal Arms, <EM4>Heavy-Duty Tractor Beam</EM4>\nBriefing: \nOur latest intel shows that the Shattered Blade have replenished their stock of Vanduul corpses and will shortly be transferring them from the old <EM4>QV Logistics station</EM4>they're operating from to an interested buyer. The UEE can't have another incident like what happened with ASD so they're eager for us to <EM4>recover the cryopods</EM4> and deliver them to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>.\n\nWhile the Shattered Blade members present at the site might offer resistance, they are not the focus of you mission. Deal with them as needed and get the cryopods. \n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- Pulse Laser Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Earthshake\n- Testudo Backpack Earthshake\n- Testudo Core Earthshake\n- Testudo Helmet Earthshake\n- Testudo Legs Earthshake
InterSec_ResourceGathering_Cryopods_Title=[BP] Recover Vanduul Corpses
InterSec_ResourceGathering_Tech_Desc=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws present and armed\nEquipment Specs: Combat-rated Ship, Personal Arms\nBriefing: \nTo prevent the Shattered Blade from flooding the black market with xeno-contraband, the UEE has charged InterSec with <EM4>recovering a stash of Vanduul Plating and Metal.</EM4> from the old <EM4>QV Logistics station</EM4> the gang has been occupying. Once you have the materials in your posession, deliver them to the freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nFollowing from your previous experience, it would not be surprising if the Shattered Blade offer resistance, but ensure that your focus is on recovering the materials.\n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- Pulse Laser Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Earthshake\n- Testudo Backpack Earthshake\n- Testudo Core Earthshake\n- Testudo Helmet Earthshake\n- Testudo Legs Earthshake
InterSec_ResourceGathering_Tech_Title=[BP] Recover Vanduul Tech
InterSec_SecurityPatrol_H_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: InterSec has received intelligence that outlaws are planning to launch an attack on a target within the UEE. In an effort to prevent this from happening, we need a contractor to patrol a sector we believe these outlaws are using to prepare for their attack.\n\nOutlaw activity in this sector is higher than normal, so InterSec recommends that you <EM4>bring backup</EM4>. When ready, dispatch to the <EM4>location marker</EM4> on your HUD and scan the waypoints along the route. Once you've confirmed that the entire sector is clear, the main contractor will receive a bonus of <EM4>~mission(ScripAmount) MG Scrip.</EM4> \n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- Quartz "Deadfall" Energy SMG\n- Quartz "Lumen" Energy SMG\n- Quartz Energy SMG Battery (45 cap)\n- Testudo Arms Nightveil\n- Testudo Arms Turfwar\n- Testudo Backpack Nightveil\n- Testudo Backpack Turfwar\n- Testudo Core Nightveil\n- Testudo Core Turfwar\n- Testudo Helmet Nightveil\n- Testudo Helmet Turfwar\n- Testudo Legs Nightveil\n- Testudo Legs Turfwar
InterSec_SecurityPatrol_H_Title_001=[BP] Patrol Dangerous Sector
InterSec_SecurityPatrol_S_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Vanduul\nEquipment Specs: Combat-rated Ships\nBriefing: There's a growing concern that Vanduul hunting parties are pushing further into Nyx. The first line of defense against this encroachment is increased patrols. InterSec has identified a sector that has seen an uptick in Vanduul activity and are looking for someone to patrol the region and provide an update on it.\n\nYou'll begin your patrol at a <EM4>location marker</EM4> sent to your HUD and then scan a series of waypoints along a designated route. The Vanduul ships in this sector are highly skilled and aggressive, so InterSec highly recommends that you <EM4>bring several combat-ready ships along as backup</EM4>.\n\nInterSec understands the immense danger you'll be under on this patrol, so we'll send a special bonus of <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor once the sector is clear.      \n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- Quartz "Deadfall" Energy SMG\n- Quartz "Lumen" Energy SMG\n- Quartz Energy SMG Battery (45 cap)\n- Testudo Arms Nightveil\n- Testudo Arms Turfwar\n- Testudo Backpack Nightveil\n- Testudo Backpack Turfwar\n- Testudo Core Nightveil\n- Testudo Core Turfwar\n- Testudo Helmet Nightveil\n- Testudo Helmet Turfwar\n- Testudo Legs Nightveil\n- Testudo Legs Turfwar
InterSec_SecurityPatrol_S_Title_001=[BP] Patrol Vanduul Hunting Ground
InterSec_SecurityPatrol_VH_Title_001=[BP] Patrol to Prevent Possible Attack
InterSec_SecurityPatrol_VH_desc_001=MISSION SPECS\n\nArea of Operation: Nyx System\nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: InterSec has been tracking increased outlaw activity in certain sectors of the system. This activity in conjunction with other intelligence leads us to believe that outlaws are planning an attack on elements traveling from the UEE. We're aiming to patrol these sectors and disrupt any plans before they can be put into action.\n\nCurrently, we need someone who can help patrol a highly dangerous sector. Once you've accepted the mission, you can proceed to the <EM4>location marker</EM4> on your HUD. From there, we'll send you along a specific route with additional waypoints to scan. Complete the patrol and we'll send the main contractor a bonus of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\nDue to the high probability of attack and general threat level of local outlaws, we recommend <EM4>recruiting trusted wingmen</EM4> to provide combat support.\n\nRespectfully,\n\nDeacon Tobin\nOperations Manager\nInterSec Defense Solutions\n\nThis communication consists of a non-binding offer that upon acceptance may be immediately terminated by either party without any given notice. All operations are conducted at the contractor’s own personal risk and must adhere to system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- Quartz "Deadfall" Energy SMG\n- Quartz "Lumen" Energy SMG\n- Quartz Energy SMG Battery (45 cap)\n- Testudo Arms Nightveil\n- Testudo Arms Turfwar\n- Testudo Backpack Nightveil\n- Testudo Backpack Turfwar\n- Testudo Core Nightveil\n- Testudo Core Turfwar\n- Testudo Helmet Nightveil\n- Testudo Helmet Turfwar\n- Testudo Legs Nightveil\n- Testudo Legs Turfwar
Intersec_DefendShip_Desc_Easy_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ship \nBriefing: Require urgent assistance for an InterSec operative who is currently under fire at <EM4>~mission(Location|Address)</EM4>.\n\nA group of outlaws had previously taken our operative captive with the intention of extracting sensitive information from them, but miraculously they were able to escape. Unfortunately, the pursuing outlaws now have them pinned down.\n\nDue to the number of the ships assaulting them, we're offering additional compensation to accommodate the added danger. <EM4>Recruiting additional ships</EM4> to support you in this mission is highly advised.\n\nRespectfully,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Combustion\n- Testudo Backpack Combustion\n- Testudo Core Combustion\n- Testudo Helmet Combustion\n- Testudo Legs Combustion
Intersec_DefendShip_Desc_Hard_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: One of our pilots is under attack at <EM4>~mission(Location|Address)</EM4> and is in need of assistance.\n\nThis operative is carrying key information regarding a coordinated attack on key UEE infrastructure and it is vital that they are able to deliver it to us. You and any <EM4>dependable pilots you can recruit</EM4> are charged with protecting them from the outlaws in pursuit long enough for them to QT away.\n\nRespectfully,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Combustion\n- Testudo Backpack Combustion\n- Testudo Core Combustion\n- Testudo Helmet Combustion\n- Testudo Legs Combustion
Intersec_DefendShip_Desc_Medium_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Outlaws\nEquipment Specs: Combat-rated Ships\nBriefing: An undercover agent of ours was compromised and is now being pursued by the outlaw pack they had infiltrated. As such, they are in need of immediate extraction at <EM4>~mission(Location|Address)</EM4>. \n\nOnce on site, engage with all hostiles in order to provide cover so our operative can QT away.\n\n<EM4>Bring additional backup</EM4> and don't underestimate these outlaws. They are violent and motivated so they are unlikely to give up anytime soon.\n\nRespectfully,\n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.\n\nBlueprints this contract can award (as of 4.10.1):\n- Pulse "Rouge" Pistol\n- Pulse Laser Pistol Battery (60 Cap)\n- Testudo Arms Combustion\n- Testudo Backpack Combustion\n- Testudo Core Combustion\n- Testudo Helmet Combustion\n- Testudo Legs Combustion
