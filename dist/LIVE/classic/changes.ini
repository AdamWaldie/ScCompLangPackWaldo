northrock_SOO_repeat_desc_001=Glad to have you undertaking this operation for Northrock. Here is the full brief:\n\nYour priority is to <EM4>disable all three Identify Friend or Foe Inverters</EM4> that are blocking Crusader Security from accessing the airspace around these platforms. Once the inverters are offline, Crusader Security will be able to fly their ships in and resecure the platforms. In the meanwhile, the platforms are connected by a series of shuttles unaffected by the inverters and will serve as your main form of transport between them.\n\nBe aware that you will meet heavy resistance as you progress. Crusader has tried multiple times to deal with this incursion themselves but have thus far been unsuccessful. However, we believe a small strike team will prove more effective in dealing with the Nine Tails forces. \n\nAdditionally, in the spirit of full cooperation, Crusader has given you carte blanche to utilize any of the resources you discover that may prove helpful to the mission. \n\nBest of luck,\nAdrienne Du-Buisson\nLogistics Officer - Stanton Branch\nNorthrock Service Group\n\nBlueprints this contract can award (as of 4.10.1):\n- BUL-H4 Armor\n- BUL-H4 Helmet\n- H4-PBF Ammo Carrier
northrock_SOO_repeat_title_001=[BP] Retake Platforms From Nine Tails
northrock_bounty_fps_UGF_boss_desc_001=Hey, \n\nHave an interesting bounty for you. A high level criminal by the name ~mission(TargetName) has been located at ~mission(Location|Address). \n\nBased on our intel, its highly unlikely that the target’s going to be sitting and waiting out in the open. You most likely will have to infiltrate the facility and draw them out. \n\nSomething like a large firefight should be enough to do the trick. \n\nBest of luck,\n\nBraden Corchado\nLogistics Officer - Stanton Branch\nNorthrock Service Group\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Bellator Jacket\n- Bellator Shirt and Waistcoat\n- Bellator Trousers\n- Defiance Arms Tactical\n- Defiance Core Tactical\n- Defiance Helmet Tactical\n- Defiance Legs Tactical\n- F55 LMG\n- F55 LMG Magazine (150 cap)\n- LH86 Pistol\n- Lynx Arms\n- Lynx Core\n- Lynx Legs\n- Oracle Helmet\n- Spettro Shoes
northrock_bounty_fps_UGF_boss_nocivs_desc_001=Hey, \n\nGot a contract for you that requires a bit more tactics than usual. A high-level criminal by the name ~mission(TargetName) is hiding with a large contingent of outlaws at ~mission(Location|Address). \n\nOur intel suggests that ~mission(TargetName|Last)’s forces most likely will act as defensive line in order to protect their boss. My best guess is that you will have to deal with them before you gain access to ~mission(TargetName|Last).\n\nThat said, I don’t want you shooting indiscriminately. Sometimes these outlaws keep civilians around and they should be treated like non-combatants.\n\nBest of luck,\n\nBraden Corchado\nLogistics Officer - Stanton Branch\nNorthrock Service Group\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Bellator Jacket\n- Bellator Shirt and Waistcoat\n- Bellator Trousers\n- Defiance Arms Tactical\n- Defiance Core Tactical\n- Defiance Helmet Tactical\n- Defiance Legs Tactical\n- F55 LMG\n- F55 LMG Magazine (150 cap)\n- LH86 Pistol\n- Lynx Arms\n- Lynx Core\n- Lynx Legs\n- Oracle Helmet\n- Spettro Shoes
northrock_bounty_fps_title_001=[BP] Bounty Assignment: ~mission(TargetName) (HRT)
