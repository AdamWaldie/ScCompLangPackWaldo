Battaglia_Story01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Welcome to the System\n\nWORK BRIEF: \nHello, the People's Alliance is committed to providing opportunities to miners, prospectors, and salvagers in the system and have an exciting opportunity to offer you as a welcome to the system.\n\nIf you're interested <EM4>just accept the mission and come by to see me</EM4>.\n\nPAYMENT:\nStandard listed rate upon completion of tasks.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Clearcut Module
Battaglia_Story01_title=[BP] Welcome to the System
Battaglia_Story02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Blinding Hope in trouble\n\nWORK BRIEF: \nWe received a distress call from the Blinding Hope that said they were under attack from the Moraine again before they were cut off. I just want to know if they're okay. <EM4>Head to their last known location and report what you find</EM4>.\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Deluge Module\n- Overrun Module
Battaglia_Story02_title=[BP] Emergency: Blinding Hope in Trouble
Battaglia_Story03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Idea for Isaac\n\nWORK BRIEF: \nI need your help with a plan I've come up with for Isaac. <EM4>I'll give you the details in person</EM4>, but it will involve heading back into Moraine territory, so you'll need to be prepared.\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- GOLEM MC-4 Ore Pod\n- MISC Enhanced Ore Pod
Battaglia_Story03_title=[BP] Idea for Isaac
CFP_RecoverCargo_Easy_Description=Life is tough on the frontier, and every delivery to our settlers is important. We really can't afford to lose any more this year.\n\nOne of our key suppliers has been hit by a group of outlaws over at <EM4>~mission(Location|Address)</EM4> and gone silent on us. I fear the worst, but if we can still recover the supplies they were transporting, it could make a huge difference.\n\nChances are the outlaws who attacked them are still lurking around there so be on your guard. Once you've dealt with them, grab the cargo and take it to the freight elevator at <EM4>~mission(Destination|Address)</EM4>. Make sure you're flying a ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and bring a <EM4>heavy-duty tractor beam</EM4> too.\n\nFly safe out there,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- C54 SMG\n- C54 SMG Magazine (50 cap)\n- G-2 Helmet Woodland\n- ORC-mkV Arms\n- ORC-mkV Core\n- ORC-mkV Legs\n- ORC-mkX Arms Woodland\n- ORC-mkX Core Woodland\n- ORC-mkX Helmet Woodland\n- ORC-mkX Legs Woodland\n- P8-SC SMG\n- P8-SC SMG Magazine (45 cap)\n- S71 Rifle\n- S71 Rifle Magazine (30 cap)
CFP_RecoverCargo_Easy_Title=[BP] Intercepted Supply Run
CFP_RecoverCargo_Hard_Description=We were in the process of delivering an urgent shipment to the folks over at <EM4>~mission(Destination|Address)</EM4> when our pilot ran into a group of outlaws. They tried to run, but it was already too late.\n\nThere is silver lining though. The trackers are showing the cargo is still intact, located at <EM4>~mission(Location|Address)</EM4>. There's a good chance the outlaws are guarding it while they locate a ship big enough to transport everything. While I don't want to risk losing another pilot, the need of the cargo aboard is desperate enough that it justifies the decision to send someone to recover it.\n\nThis won't be easy, these outlaws showed our pilot no mercy. You'll need to take them out first before getting the cargo back. Bring a ship that can store <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4> for the moving. Deliver it to the freight elevator at <EM4>~mission(Destination)</EM4>  and let's make this right.\n\nFly safe,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- C54 SMG\n- C54 SMG Magazine (50 cap)\n- G-2 Helmet Woodland\n- ORC-mkV Arms\n- ORC-mkV Core\n- ORC-mkV Legs\n- ORC-mkX Arms Woodland\n- ORC-mkX Core Woodland\n- ORC-mkX Helmet Woodland\n- ORC-mkX Legs Woodland\n- P8-SC SMG\n- P8-SC SMG Magazine (45 cap)\n- S71 Rifle\n- S71 Rifle Magazine (30 cap)
CFP_RecoverCargo_Hard_Title=[BP] Crucial Supplies Need Retrieving
CFP_RecoverCargo_Medium_Description=A Citizens for Prosperity ship has been ambushed by a group of outlaws over at <EM4>~mission(Location|Address)</EM4> and we need a skilled pilot to help them out.\n\nWe lost contact with them mid comms, but it sounded like they were taking heavy fire. It may be too late for them, but the vital supplies they were carrying could still be put to good use. Fly over there, take out any hostiles, and recover the shipment. You'll need a ship that can support <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4> to transport the supplies onto your ship.\n\nTake them to the freight elevator at <EM4>~mission(Destination|Address)</EM4> and I'll guarantee they'll be put to good use.\n\nBe safe out there,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- C54 SMG\n- C54 SMG Magazine (50 cap)\n- G-2 Helmet Woodland\n- ORC-mkV Arms\n- ORC-mkV Core\n- ORC-mkV Legs\n- ORC-mkX Arms Woodland\n- ORC-mkX Core Woodland\n- ORC-mkX Helmet Woodland\n- ORC-mkX Legs Woodland\n- P8-SC SMG\n- P8-SC SMG Magazine (45 cap)\n- S71 Rifle\n- S71 Rifle Magazine (30 cap)
CFP_RecoverCargo_Medium_Title=[BP] Recovering Valuable Supplies
CFP_RecoverCargo_Super_Description=I wouldn't normally ask someone to do something so risky, but these are exceptional circumstances.\n\nOur pilot was transporting some vital cargo when they were targeted by a group of outlaws. Under no circumstances can we allow them to get their hands on the cargo.\n\nWith the size of the hostile force who attacked, you won't be able to do this on your own, you'll need to bring a skilled crew with you to  <EM4>~mission(Location|Address)</EM4> in order to  take out these outlaws and get the cargo back. Make sure at least one of you has a ship that can store <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4>.\n\nIf by some miracle you can get that cargo back, take it to the freight elevator located at <EM4>~mission(Destination|Address)</EM4>.\n\nIt's a lot to ask, but if you can pull this off you'll have my and the whole organizations appreciation.\n\nBest of luck,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- C54 SMG\n- C54 SMG Magazine (50 cap)\n- G-2 Helmet Woodland\n- ORC-mkV Arms\n- ORC-mkV Core\n- ORC-mkV Legs\n- ORC-mkX Arms Woodland\n- ORC-mkX Core Woodland\n- ORC-mkX Helmet Woodland\n- ORC-mkX Legs Woodland\n- P8-SC SMG\n- P8-SC SMG Magazine (45 cap)\n- S71 Rifle\n- S71 Rifle Magazine (30 cap)
CFP_RecoverCargo_Super_Title=[BP] Special Recovery Operation
CFP_RecoverCargo_VeryHard_Description=More and more CFP ships are being targeted lately, and despite our best efforts to keep our trading routes quiet, we're still losing haulers to outlaw attacks.\n\nOur pilot over at <EM4>~mission(Location|Address)</EM4> is the latest casualty. It pains me to think about how much we've lost, but as long as there are people who need our help, we have to keep on fighting.\n\nIf you have a ship that can carry <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>heavy-duty tractor beam</EM4>, we need you to head to the above location and recover that cargo.\n\nThis won't be easy, the pilot was one of our best and wouldn't go down without a fight. Let's not underestimate these outlaws, bring a trustworthy crew and watch each other's backs.\n\nOnce you've got the cargo, deliver it to the freight elevator at <EM4>~mission(Destination|Address)</EM4> and I'll get it processed.\n\nGood luck and take care,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity\n\nBlueprints this contract can award (as of 4.10.1):\n- C54 SMG\n- C54 SMG Magazine (50 cap)\n- G-2 Helmet Woodland\n- ORC-mkV Arms\n- ORC-mkV Core\n- ORC-mkV Legs\n- ORC-mkX Arms Woodland\n- ORC-mkX Core Woodland\n- ORC-mkX Helmet Woodland\n- ORC-mkX Legs Woodland\n- P8-SC SMG\n- P8-SC SMG Magazine (45 cap)\n- S71 Rifle\n- S71 Rifle Magazine (30 cap)
CFP_RecoverCargo_VeryHard_Title=[BP] Cargo Shipment Must Be Completed
Covalex_HaulCargo_AToB_title=[BP]* ~mission(ReputationRank) Rank - Direct ~mission(CargoGradeToken) Cargo Haul
Covalex_HaulCargo_AtoB_desc_DeliverAll=Hiya, \n\nHere’s the deal, I need someone good for a special run. We’ve got an important client that’s threatening to take their business elsewhere, because their deliveries are consistently missing cargo. They’re demanding that 100% of the cargo be delivered on this run, or they won’t pay. Since this was before my time and my supervisor wants to show that it won’t happen again, they agreed with this. Anyway, I think you might be a good fit. \n\nIf you’re willing to take that risk too, here are all the pertinent details. The cargo can be collected from <EM4>~mission(Location|Address)</EM4> and delivered to <EM4>~mission(Destination|Address)</EM4>. Looks like the largest cargo container you’ll need to handle is <EM4>~mission(MissionMaxSCUSize)</EM4>, so be sure to bring a ship big enough and a <EM4>handheld tractor beam</EM4> to help you move those containers around.  \n \n~mission(Contractor|SignOff) \n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\nBlueprints this contract can award (as of 4.10.1):\n- Balandin\n- Palisade\n- Parapet\n- Rampart\n- Siren\n- TS-2\n- VK-00\n- XL-1\n- Yeager
Covalex_HaulCargo_AtoB_desc_FromLevski=Hey there, \n\nSo the People’s Alliance hired us to move a load of cargo from Levski to <EM4>~mission(Destination|Address)</EM4>. Honestly, I’m surprised that they export some of this stuff, but I guess they must sell something to be able to afford everything they import. \n\nFor the run itself, you’ll need a ship that can hold <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>handheld tractor beam</EM4> to handle the containers. That should be it.  \n\n~mission(Contractor|SignOff)\n  \nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.' \n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\nBlueprints this contract can award (as of 4.10.1):\n- Balandin\n- Palisade\n- Parapet\n- Rampart\n- Siren\n- TS-2\n- VK-00\n- XL-1\n- Yeager
Covalex_HaulCargo_AtoB_desc_FromRuinStation=Hey, it’s El. \n\nGot a client at <EM4>~mission(Location|Address)</EM4>, who needs their cargo picked up from Ruin Station. They’ve been waiting there a while and are starting to get a bit impatient. Any chance you could handle this for us? \n\nYou’ll need a ship that can fit <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>handheld tractor beam</EM4> to be able to move them. \n\n~mission(Contractor|SignOff)\n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.' \n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\nBlueprints this contract can award (as of 4.10.1):\n- Balandin\n- Palisade\n- Parapet\n- Rampart\n- Siren\n- TS-2\n- VK-00\n- XL-1\n- Yeager
Covalex_HaulCargo_AtoB_desc_ToLevski=Hi, \n\nThere’s a bunch of cargo at <EM4>~mission(Location|Address)</EM4> that needs to be moved to Levski. The People’s Alliance has a standing order for this stuff because they desperately need it, but it’s not easy to get in Nyx. Funny how they don’t want to be part of the UEE but still rely on us for their survival.  \n\nAnyway, you’ll need a <EM4>handheld tractor beam</EM4> and a ship that can hold <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> to knock this one out. \n\n~mission(Contractor|SignOff) \n \nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.' \n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\nBlueprints this contract can award (as of 4.10.1):\n- Balandin\n- Palisade\n- Parapet\n- Rampart\n- Siren\n- TS-2\n- VK-00\n- XL-1\n- Yeager
Covalex_HaulCargo_AtoB_desc_ToRuinStation=Hiya, \n\nLooking for a hauler willing to make a run to Ruin Station. Know hauls to Pyro can give some people pause, but this is one we do regularly to help supply the station. I’ve also confirmed that everything on the cargo manifest is above board. \n\nIf you’re interested, the cargo is ready for pick up at <EM4>~mission(Location|Address)</EM4>.  Make sure you bring a <EM4>handheld tractor beam</EM4> and a ship that can hold <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> otherwise it might be a little rough.\n\n~mission(Contractor|SignOff)\n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.' \n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\nBlueprints this contract can award (as of 4.10.1):\n- Balandin\n- Palisade\n- Parapet\n- Rampart\n- Siren\n- TS-2\n- VK-00\n- XL-1\n- Yeager
Covalex_HaulCargo_SingleToMulti_desc_ToCFP_Danger=Hi, \n\nSeveral Citizens for Prosperity outposts in Pyro need supplies. It seems like we regularly do runs like this for them, but this one looks like it might be a bit riskier. A CFP rep let me know that outlaw activity around these sites has spiked recently, but they desperately need these outposts restocked, so we’re going ahead with the delivery. <EM4>Just a head’s up that you could run into trouble, so come prepared</EM4>.       \n\nAll the cargo’s waiting at <EM4>~mission(Location|Address)</EM4> and here’s where it’s heading:  \n\nDROP OFF LOCATIONS (ANY ORDER) \n\n~mission(SingleToMultiToken)  \n\nAccording to the manifest, the largest cargo container you’ll need to deal with is <EM4>~mission(MissionMaxSCUSize)</EM4>. Aside from that, remember to bring a <EM4>handheld tractor beam</EM4> along.    \n\n~mission(Contractor|SignOff) \n  \nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\nBlueprints this contract can award (as of 4.10.1):\n- Balandin\n- Palisade\n- Parapet\n- Rampart\n- Siren\n- TS-2\n- VK-00\n- XL-1\n- Yeager
Covalex_HaulCargo_SingleToMulti_desc_Valakkar_Timed=Hi, \n\nOur client took down a Valakkar and processed it into organics. They've got buyers lined up and waiting for the stuff at a few different locations, so I need someone to go to <EM4>~mission(Location|Address)</EM4>, grab it all, and then deliver it to the following spots:    \n\nDROP OFF LOCATIONS (ANY ORDER) \n\n~mission(SingleToMultiToken)  \n\nAccording to the manifest, the largest cargo container you’ll need to deal with is <EM4>~mission(MissionMaxSCUSize)</EM4>. Don’t forget to bring your <EM4>handheld tractor beam</EM4>. Not sure how you’d move this stuff without it.    \n\n~mission(Contractor|SignOff)   \n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. Total payment will be prorated according to the percentage of cargo successfully delivered.\n\nBlueprints this contract can award (as of 4.10.1):\n- Balandin\n- Palisade\n- Parapet\n- Rampart\n- Siren\n- TS-2\n- VK-00\n- XL-1\n- Yeager
Covalex_HaulCargo_SingleToMulti_title=[BP]* ~mission(ReputationRank) Rank - ~mission(CargoGradeToken) Cargo Haul 
EckhartSecurity_EliminateBoss_DC_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Bounty\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nWe’ve received actionable intelligence on a dangerous bounty, who’s turned out to be extremely elusive. <EM4>~mission(TargetName)</EM4> was spotted with a dedicated contingent of known associates at <EM4>~mission(Location|Address)</EM4>. We’re looking for a contractor ready and willing to execute this bounty before they disappear again.\n\nBased on previous attempts to apprehend this criminal, there’s a good chance that <EM4>~mission(TargetName|Last)</EM4> will try to avoid a direct confrontation, and instead send their allies to confront you. We believe that neutralizing these protective forces, and shredding the safety net they provide, is the best way to draw out <EM4>~mission(TargetName|Last)</EM4> to face you directly. \n\nExpect to confront a significant and skilled force. We advise that you plan accordingly. Payment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\nBlueprints (only some versions of this contract award these, as of 4.10.1):\n- C-788 Cannon\n- Draugar Gatling\n- Fierell Cascade\n- MegaFlux\n- Revenant Gatling\n- Tigerstrike T-19P\n- UltraFlux
EckhartSecurity_EliminateBoss_DC_Title_001=[BP]* High-Risk Bounty: ~mission(TargetName)
EckhartSecurity_MultiEliminateAllAndBoss_DC_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Bounty\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nGot a big league bounty contract that’s primed to be executed. <EM4>~mission(TargetName)</EM4> and their crew were identified executing a raid on <EM4>~mission(Location|Address)</EM4>. If their MO holds true, <EM4>~mission(TargetName|Last)</EM4> has surfaced to land a big score and then will disappear into the ether. Let's not allow that to happen again. \n\nWord is the hostile forces have spread themselves across the location. That’ll make hunting down the precise location of <EM4>~mission(TargetName|Last)</EM4> difficult. In addition, expect the target to act defensively when under attack. In previous engagements, they remained hidden and directed their forces from afar. It is our recommendation that you focus on thinning out their allies first and force <EM4>~mission(TargetName|Last)</EM4> to come to their own defense. Would also advise you to bring plenty of ammo and even some support to help keep you from being overwhelmed.    \n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\nBlueprints this contract can award (as of 4.10.1):\n- C-788 Cannon\n- Draugar Gatling\n- Fierell Cascade\n- MegaFlux\n- Revenant Gatling\n- Tigerstrike T-19P\n- UltraFlux
EckhartSecurity_MultiEliminateAllAndBoss_DC_Title_001=[BP] Deal with ~mission(TargetName) and Support Forces
Eckhart_EscortShips_E_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA group of ships located at <EM4>~mission(Location|Address)</EM4> are requesting an escort. If you accept, head to the location immediately and await instructions. The client claims that this escort is purely a precautionary measure, but that doesn’t mean you should drop your guard. Expect some hostile forces and deal with them appropriately.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- M3A Cannon\n- M4A Cannon\n- M5A Cannon\n- Obscura\n- Shimmer
Eckhart_EscortShips_E_title=[BP] Executive Protection Detail
Eckhart_EscortShips_H_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nIn need of a contractor who can report in now. A client has found themselves in hot water over at <EM4>~mission(Location|Address)</EM4> and a protection detail to get away from an asteroid base. They’ve reported multiple, well-armed hostile ships meaning you’ll need a crew of your own to deal with them. Based on the client’s account, these attackers seem highly motivated so they will likely not back down easily.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Havoc Scattergun\n- Hellion Scattergun\n- M3A Cannon\n- M4A Cannon\n- M5A Cannon\n- Mirage\n- Obscura\n- Predator Scattergun\n- Quarreler Cannon\n- Sheut\n- Shimmer\n- Suckerpunch Cannon\n- Suckerpunch-L Cannon\n- Suckerpunch-XL Cannon\n- Umbra\n- Veil
Eckhart_EscortShips_H_title=[BP] VIP Client Needs Protection
Eckhart_EscortShips_M_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nOne of my clients needs an immediate escort through dangerous space. Rendezvous at <EM4>~mission(Location|Address)</EM4> and they’ll meet you after they launch. Reports indicate increased outlaw activity in the area, so don’t let your guard down.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- M3A Cannon\n- M4A Cannon\n- M5A Cannon\n- Obscura\n- Sheut\n- Shimmer\n- Suckerpunch Cannon\n- Suckerpunch-L Cannon\n- Suckerpunch-XL Cannon\n- Veil
Eckhart_EscortShips_M_title=[BP] Experienced Protection Detail Needed
Eckhart_EscortShips_S_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nThis contract should only be considered by the most capable of pilots. A highly valued client is currently under attack at <EM4>~mission(Location|Address)</EM4> and requires immediate extraction. They’re sitting in the hangar ready to leave, but are unable to move until the hostile ships in the area have been neutralized. \n\nI don’t see the outlaws stopping any time soon and our client’s reporting they’re packing high-grade weaponry on their ships. This will be a test of your skill as much as your endurance. Assemble whoever you need and head there immediately to assist them.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Havoc Scattergun\n- Hellion Scattergun\n- M3A Cannon\n- M4A Cannon\n- M5A Cannon\n- Mirage\n- Obscura\n- Predator Scattergun\n- Quarreler Cannon\n- Sheut\n- Shimmer\n- Suckerpunch Cannon\n- Suckerpunch-L Cannon\n- Suckerpunch-XL Cannon\n- Umbra\n- Veil
Eckhart_EscortShips_S_title=[BP] Top Tier Operator Needed
Eckhart_EscortShips_VE_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA client has requested a contractor with immediate availability to provide extra support to a number of ships leaving an asteroid base located at <EM4>~mission(Location|Address)</EM4>). Once you’ve accepted, rendezvous there and await further instructions. In this instance, your job is to provide support for their safe passage. Hostiles may be present, but they shouldn’t be too challenging to deal with.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- M3A Cannon\n- M4A Cannon\n- M5A Cannon\n- Obscura\n- Shimmer
Eckhart_EscortShips_VE_title=[BP] Low Risk Protection Detail
Eckhart_EscortShips_VH_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Escort Ship\nApproval code: = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nI’m in need of a highly competent pilot who can gather a crew of equally capable pilots for an escort mission. The mining base at <EM4>~mission(Location|Address)</EM4> is currently under attack from a group of outlaws and the crew there is unable to leave without assistance. Our scouts have reported that the attackers are armed with exceptional weaponry and ships.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Havoc Scattergun\n- Hellion Scattergun\n- M3A Cannon\n- M4A Cannon\n- M5A Cannon\n- Mirage\n- Obscura\n- Predator Scattergun\n- Quarreler Cannon\n- Sheut\n- Shimmer\n- Suckerpunch Cannon\n- Suckerpunch-L Cannon\n- Suckerpunch-XL Cannon\n- Umbra\n- Veil
Eckhart_EscortShips_VH_title=[BP] Protection Detail Needed. High Risk.
Eckhart_ShipAmbush_E_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA client of ours has been receiving anonymous threats in an attempt to blackmail them, and after a bit of leg work on our part, we’ve managed to trace it back to an individual who pilots a particular <EM4>~mission(AmbushTarget)</EM4>. The client wants us to take care of this blackmailer before they have a chance to make good. \n\nBased on our assessment, the target shouldn’t be too difficult to handle. They fly by <EM4>~mission(Location|Address)</EM4> on the regular, which has an <EM4>emission cloud</EM4> that’s an ideal spot to power down your ship and lie in wait. Sometimes the target is alone but they often travel with other single-seat ships as protection. Best be strategic when you launch your ambush or the <EM4>~mission(AmbushTarget)</EM4> could have a chance to get away. We don’t want to lose this one. We’ll alert other contractors in the area of the ambush so they can come help once it pops off.     \n\nPayment will be issued upon successful completion of contract. The client has also added a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> for the main contractor.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Cirrus\n- Lightstrike I Cannon\n- Lightstrike II Cannon\n- Lightstrike III Cannon\n- SonicLite
Eckhart_ShipAmbush_E_title=[BP] Time to Teach a Lesson
Eckhart_ShipAmbush_H_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nLooking for a competent contractor who can recruit a wingman to help execute an ambush. The target is a <EM4>~mission(AmbushTarget)</EM4> which has been involved in several operations against one of our most important clients. By neutralizing it once and for all, it’ll make our client’s life a hell of a lot easier. While the ~mission(AmbushTarget) is our focus, they usually don’t fly anywhere without a sizable escort, including large craft. \n\nWe’ve gotten word that this group will be passing by <EM4>~mission(Location|Address)</EM4> soon. Any chance you could hurry and beat them there? That spot has an <EM4>emission cloud</EM4> that you can power down your ship and hide in. Then when they pass, you should have the upper hand.  \n\nPayment will be issued upon successful completion of contract. The client knows this one will be tough, so they threw in a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> that’ll go to the main contractor.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Cirrus\n- DeltaMax\n- Eclipse\n- FL-11 Cannon\n- FL-22 Cannon\n- FL-33 Cannon\n- GammaMax\n- Lightstrike I Cannon\n- Lightstrike II Cannon\n- Lightstrike III Cannon\n- Lightstrike IV Cannon\n- Lightstrike V Cannon\n- Lightstrike VI Cannon\n- Slipstream\n- SonicLite
Eckhart_ShipAmbush_H_title=[BP] Tricky Ambush
Eckhart_ShipAmbush_Intro_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nWe’re looking for contractors with combat experience who are willing to get their hands dirty so to speak. A client of ours was double-crossed by a <EM4>~mission(AmbushTarget)</EM4> and we’ve been waiting for an opportunity to deal with the issue. After tracking them for several weeks, we’ve identified <EM4>~mission(Location|Address)</EM4> as the ideal spot to intercept them. It features an <EM4>emission cloud</EM4> where you can hide and power down your ship while waiting for the <EM4>~mission(AmbushTarget)</EM4>.\n\nIntel suggests that they may travel with an escort. If they do, you’ll have to deal with them too. Since this is your first contract, we will have other contractors in the area who can lend a hand once you strike.\n\nPayment will be issued upon successful completion of contract. There’s a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> in this for the main contractor too.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints (only some versions of this contract award these, as of 4.10.1):\n- Cirrus\n- Lightstrike I Cannon\n- Lightstrike II Cannon\n- Lightstrike III Cannon\n- SonicLite
Eckhart_ShipAmbush_Intro_title=[BP]* New Opportunity - Ambush Strike
Eckhart_ShipAmbush_M_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nNeed someone to take out a <EM4>~mission(AmbushTarget)</EM4> and deal with the escort ships protecting it. They’ve already interfered with several of our ongoing operations and have become a real problem across several of Eckhart Security cases. Not sure what their endgame is, but it won’t matter once you deal with them.\n\nWe’ve let slip that we will be working a job over at <EM4>~mission(Location|Address)</EM4> which should serve as bait to draw them out. The spot is ideal for an ambush because of the <EM4>emission cloud</EM4> that’s a perfect place to power down and hide until you’re ready to strike. If you’re available, the <EM4>~mission(AmbushTarget)</EM4> and its escorts should be passing through soon.   \n\nPayment will be issued upon successful completion of contract. The main contractor will also receive a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Cirrus\n- DeltaMax\n- FL-11 Cannon\n- FL-22 Cannon\n- FL-33 Cannon\n- GammaMax\n- Lightstrike I Cannon\n- Lightstrike II Cannon\n- Lightstrike III Cannon\n- SonicLite
Eckhart_ShipAmbush_M_title=[BP] Launch Surprise Attack
Eckhart_ShipAmbush_S_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nRecently, we sent a contractor after a <EM4>~mission(AmbushTarget)</EM4>, who was leading a crew targeting the operations of an extremely important client. Unfortunately, it was a trap and we lost some good people. We can’t let the target get away again, so we’ve decided the best course of action is to give them a dose of their own medicine.  \n\nAmbushing this target seems like the safest course of action, and we’ve identified a good spot for such an attack. There’s an <EM4>emission cloud</EM4> near <EM4>~mission(Location|Address)</EM4> that the target and their crew frequently fly by. You can power down your ship and hide there until you’re ready to strike. This crew is ruthless and extremely skilled. Don’t make the same mistake as the previous contractor and go this alone. It would be best for you to bring a few trusted friends to help handle this crew.    \n\nPayment will be issued upon successful completion of contract. Plus, we’ll throw in a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> for the main contractor for taking care of this.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Cirrus\n- DeltaMax\n- Eclipse\n- FL-11 Cannon\n- FL-22 Cannon\n- FL-33 Cannon\n- GammaMax\n- Lightstrike I Cannon\n- Lightstrike II Cannon\n- Lightstrike III Cannon\n- Lightstrike IV Cannon\n- Lightstrike V Cannon\n- Lightstrike VI Cannon\n- Slipstream\n- SonicLite
Eckhart_ShipAmbush_S_title=[BP] Highly Dangerous Ambush
Eckhart_ShipAmbush_VE_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nOne of our clients has been the victim of consistent harassment so the time has come to send a clear cease-and-desist message by taking out their prized <EM4>~mission(AmbushTarget)</EM4>.  The lowlife in question follows a fairly predictable routine making them susceptible to an ambush. We’ve identified <EM4>~mission(Location|Address)</EM4> as the ideal spot. It features an <EM4>emission cloud</EM4> where you can hide and power down your ship while waiting. \n\nBy the way, the <EM4>~mission(AmbushTarget)</EM4> often flies alone but is sometimes joined by a friend in a single-seat ship. Neither should give you too much trouble, but we have other contractors in the area who can lend a hand once you strike.\n\nPayment will be issued upon successful completion of contract. There’s a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> in this for the main contractor too.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Cirrus\n- Lightstrike I Cannon\n- Lightstrike II Cannon\n- Lightstrike III Cannon\n- SonicLite
Eckhart_ShipAmbush_VE_title=[BP] Settle a Score
Eckhart_ShipAmbush_VH_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Ship Ambush\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA high profile client recently lost an important shipment when a pilot double-crossed them and ran off with their product. After weeks of hunting we’ve discovered that they were connected with an outlaw pack, so the client is looking to us to deter similar future issues from arising. The ultimate target is the pilot of a <EM4>~mission(AmbushTarget)</EM4>, who leads the crew responsible. This won’t be easy. They don’t go anywhere without escort fighters and sub-capital ships. That’s why we highly recommend that you find a trusted friend or two who can handle this with you.  \n  \nIntel gathered by our analysts indicates that they frequently fly by an <EM4>emission cloud</EM4> near <EM4>~mission(Location|Address)</EM4> which would provide an excellent area to stage a surprise strike.\n\nPayment will be issued upon successful completion of contract. We’re also adding a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> that’ll go to the main contractor.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.\n\n\nBlueprints this contract can award (as of 4.10.1):\n- Cirrus\n- DeltaMax\n- Eclipse\n- FL-11 Cannon\n- FL-22 Cannon\n- FL-33 Cannon\n- GammaMax\n- Lightstrike I Cannon\n- Lightstrike II Cannon\n- Lightstrike III Cannon\n- Lightstrike IV Cannon\n- Lightstrike V Cannon\n- Lightstrike VI Cannon\n- Slipstream\n- SonicLite
Eckhart_ShipAmbush_VH_title=[BP] Dangerous Ambush
FTL_Courier_Nyx_Easy_Desc_001=AVAILABLE FTL CONTRACT\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS**\nFTL requires an entry-level courier to complete deliveries in Nyx.\nCourier must provide own transportation.\nPrior training in manual lifting is preferred, with the <EM4>ability to move boxes of up to .25 SCU</EM4> in weight.\nBy accepting this contract you agree to take full responsibility for the safety of the assigned packages.\n\n~mission(Contractor|SignOff)\n\nBlueprints this contract can award (as of 4.10.1):\n- Agni\n- Colossus\n- Defiant\n- Endurance\n- Huracan\n- Sedulity
