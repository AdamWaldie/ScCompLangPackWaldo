Battaglia_RPT_Scan_05_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Large Deposit Of Ore To Confirm\n\nWORK BRIEF: \nNeed your help with a prospecting job. Need someone to track down a deposit of <EM4>~mission(Resources)</EM4>. \nThis data will be helpful for some studies we're doing about mineral levels. ~mission(Rarity)\n\nAlso, if you're stuck on where to look or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nThanks in advance.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco\n\nBlueprints this contract can award (as of 4.10.1):\n- Abrade Scraper Module\n- Arbor MH1 Mining Laser\n- CF-117 Bulldog "Hazard-Zone" Repeater\n- CF-227 Badger "Hazard-Zone" Repeater\n- CF-337 Panther "Hazard-Zone" Repeater\n- Cinch Scraper Module\n- Comer Scraper Module\n- Hart Scraper Module\n- Helix I Mining Laser\n- Hofstede-S1 Mining Laser\n- Impact I Mining Laser\n- Klein-S1 Mining Laser
