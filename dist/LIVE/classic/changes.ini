Shubin_Industrial_ShipMining_VH_Org_Desc_001=POSTING: Purchase Order\nLOCATION: <EM4>~mission(System) </EM4>\n\nTERMS*: \nShubin Interstellar is currently looking to fulfil another purchase order for a variety of refined materials. This purchase order is more complex than typical, requiring multiple mining methods, but since you've proven your skill thus far, we think you and your team are up for the challenge.\n\nReminder, <EM4>materials must be refined before delivery</EM4>, and since this is a purchase order and not a mining contract, you are expected to provide your own equipment, such as a <EM4>~mission(Hint_Tool)</EM4>.\n\nOnce you’re ready to sell us the required materials, deposit them in the freight elevator located at <EM4>~mission(Destination|Address)</EM4>.\n\n*By accepting this contract you are assuming any and all risks associated with the work outlined herein and in no way can Shubin Interstellar be held accountable for any damages accrued during the duration of the contract.\n\nBlueprints this contract can award (as of 4.10.1):\n- Arbor MH1 Mining Laser\n- Arbor MH2 Mining Laser\n- Arbor MHV Mining Laser\n- Arclight "Nightstalker" Pistol\n- Arclight "Stormfall" Pistol\n- Arclight "Warhawk" Pistol\n- Arclight Pistol\n- Arclight Pistol Battery (30 cap)\n- Aril Arms\n- Aril Core\n- Aril Helmet\n- Aril Legs\n- BroadSpec\n- BroadSpec-Go\n- BroadSpec-Max\n- FullSpec\n- FullSpec-Go\n- FullSpec-Max\n- Helix I Mining Laser\n- Helix II Mining Laser\n- Hofstede-S1 Mining Laser\n- Hofstede-S2 Mining Laser\n- Horizon Helmet\n- Impact I Mining Laser\n- Impact II Mining Laser\n- Klein-S1 Mining Laser\n- Klein-S2 Mining Laser\n- Lancet MH1 Mining Laser\n- Lancet MH2 Mining Laser\n- Lawson Mining Laser\n- Pitman Mining Laser\n- S0 Helix\n- S00 Hofstede\n- Surveyor\n- Surveyor-Go\n- Surveyor-Lite\n- Surveyor-Max\n- Venture Arms\n- Venture Core\n- Venture Legs
